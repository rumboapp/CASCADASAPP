function ajustarNavPorRol() {
  var rol = APP.usuarioStaff.Rol;
  // Historial: ADMIN y RECEPCION.
  var historial = document.querySelector('[data-staff-nav="Historial"]');
  if (historial) historial.classList.toggle('oculto', ['ADMINISTRADOR', 'RECEPCION'].indexOf(rol) === -1);
  // Config y Bloqueos: RECEPCION y ADMIN.
  ['Config', 'Bloqueos'].forEach(function (nav) {
    var el = document.querySelector('[data-staff-nav="' + nav + '"]');
    if (el) el.classList.toggle('oculto', ['ADMINISTRADOR', 'RECEPCION'].indexOf(rol) === -1);
  });
  // Carta: COCINA y ADMIN (RECEPCION solo lectura permitida tambien).
}

function navStaff(seccion) {
  document.querySelectorAll('[data-staff-nav]').forEach(function (el) {
    el.classList.toggle('activo', el.getAttribute('data-staff-nav') === seccion);
  });
  ['Operaciones', 'Reservas', 'Pedidos', 'Carta', 'Historial', 'Bloqueos', 'Config'].forEach(function (s) {
    document.getElementById('staff' + s).classList.toggle('oculto', s !== seccion);
  });
  APP.staffVistaActual = seccion; // recordar la vista para refrescos automaticos
  if (seccion === 'Operaciones') renderOperaciones();
  if (seccion === 'Reservas') renderReservasStaff();
  if (seccion === 'Pedidos') renderPedidosStaff();
  if (seccion === 'Carta') renderCartaStaff();
  if (seccion === 'Historial') renderHistorial();
  if (seccion === 'Bloqueos') renderBloqueos();
  if (seccion === 'Config') renderConfig();
}

/* ---------- Notificaciones (campana, tiempo casi real) ----------
   Estrategia: se hace polling liviano cada 20s. La primera carga fija una
   "linea base" (IDs conocidos) SIN avisar, para que al abrir la app no salgan
   mil pop ups por reservas viejas. Solo las que lleguen mientras la app esta
   abierta muestran un toast. El panel se abre al instante desde memoria. */

function iniciarNotificaciones() {
  llamarAPI('obtenerNotificaciones', [APP.usuarioStaff.Rol, '', false], { loader: false, silencioso: true })
    .then(function (notifs) {
      APP.notifsCache = notifs || [];
      APP.notifIdsConocidos = {};
      APP.notifsCache.forEach(function (n) { APP.notifIdsConocidos[n.ID] = true; });
      actualizarBadgeNotif();
    }).catch(function () {});
  if (!APP.pollNotificaciones) APP.pollNotificaciones = setInterval(pollNotificaciones, 20000);
}

function pollNotificaciones() {
  llamarAPI('obtenerNotificaciones', [APP.usuarioStaff.Rol, '', false], { loader: false, silencioso: true })
    .then(function (notifs) {
      notifs = notifs || [];
      // Nuevas = las que aun no conociamos.
      var nuevas = notifs.filter(function (n) { return !APP.notifIdsConocidos[n.ID]; });
      notifs.forEach(function (n) { APP.notifIdsConocidos[n.ID] = true; });
      APP.notifsCache = notifs;
      actualizarBadgeNotif();

      // Refresca el Centro de Operaciones (si esta visible y sin modal abierto)
      // en el MISMO camino que dispara los pop-ups, para que nunca quede desfasado.
      var modalAbierto = document.getElementById('contenedorModal').innerHTML.trim() !== '';
      if (APP.staffVistaActual === 'Operaciones' && !modalAbierto) {
        cargarOpsContenido();
      }

      var nuevasNoLeidas = nuevas.filter(function (n) { return !n.Leida; });
      if (nuevasNoLeidas.length === 0) return;

      // Pop-up por cada aviso nuevo (con tope para no inundar).
      if (nuevasNoLeidas.length <= 3) {
        nuevasNoLeidas.forEach(function (n) {
          var res = parseNotifReserva(n.Mensaje);
          if (res) mostrarPopupReserva(res);
          else mostrarPopupNotif(escaparHTML(n.Mensaje));
        });
      } else {
        mostrarPopupNotif('<b>' + nuevasNoLeidas.length + ' nuevas notificaciones</b><br>Abre la campana para verlas.');
      }
    }).catch(function () {});
}

/* Interpreta el mensaje estructurado "RES|hab|servicio|fecha|hora|estado". */
function parseNotifReserva(mensaje) {
  if (!mensaje || mensaje.indexOf('RES|') !== 0) return null;
  var p = mensaje.split('|');
  return { hab: p[1] || '', servicio: p[2] || '', fecha: p[3] || '', hora: p[4] || '', estado: p[5] || '' };
}

/* Fecha corta legible: "12 jul". */
function fechaCorta(iso) {
  if (!iso) return '';
  var d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
}

/* Pop-up GRANDE y notorio para una reserva nueva. */
function mostrarPopupReserva(d) {
  var div = document.createElement('div');
  div.className = 'card slide-up shadow-lg';
  div.style.borderLeft = '6px solid var(--grafito)';
  div.style.maxWidth = '360px';
  div.innerHTML =
    '<div class="p-5">' +
      '<div class="flex items-center justify-between mb-2">' +
        '<span class="pill" style="background:var(--grafito);color:#fff"><i class="fa-solid fa-bell mr-1"></i> NUEVA RESERVA</span>' +
        '<button class="text-2xl leading-none opacity-50 hover:opacity-100" onclick="this.closest(\'.card\').remove()">&times;</button>' +
      '</div>' +
      '<p class="font-bold leading-none" style="font-size:2.2rem;color:var(--grafito)">' + escaparHTML(etiquetaHab(d.hab)) + '</p>' +
      '<p class="text-lg font-semibold mt-1">' + escaparHTML(d.servicio) + '</p>' +
      '<p class="text-base mt-2"><i class="fa-regular fa-calendar mr-1"></i> ' + escaparHTML(fechaCorta(d.fecha)) +
        ' &nbsp;·&nbsp; <i class="fa-regular fa-clock mr-1"></i> <b>' + escaparHTML(d.hora) + '</b></p>' +
      '<p class="mt-2"><span class="pill ' + claseEstado(d.estado) + '">' + escaparHTML(d.estado) + '</span></p>' +
    '</div>';
  document.getElementById('contenedorToast').appendChild(div);
  setTimeout(function () { if (div.parentElement) div.remove(); }, 45000);
}

function actualizarBadgeNotif() {
  var badge = document.getElementById('badgeNotif');
  if (!badge) return;
  var noLeidas = (APP.notifsCache || []).filter(function (n) { return !n.Leida; }).length;
  if (noLeidas) { badge.textContent = noLeidas; badge.classList.remove('oculto'); }
  else badge.classList.add('oculto');
}
/* Alias por compatibilidad: refrescar tras una accion (marca leida, etc.). */
function refrescarBadgeNotif() { actualizarBadgeNotif(); }

function abrirPanelNotificaciones() {
  mostrarModal({
    titulo: '<i class="fa-solid fa-bell mr-1" style="color: var(--dorado)"></i> Notificaciones',
    contenidoHTML: '<div id="listaNotifs" class="max-h-96 overflow-y-auto"></div>',
    botones: [
      { texto: 'Marcar todas como leidas', clase: 'btn-outline', accion: marcarTodasLeidas },
      { texto: 'Cerrar', clase: 'btn-primary', accion: cerrarModal }
    ]
  });
  // Pinta al instante desde memoria; refresca en segundo plano.
  pintarListaNotificaciones();
  llamarAPI('obtenerNotificaciones', [APP.usuarioStaff.Rol, '', false], { loader: false, silencioso: true })
    .then(function (notifs) {
      APP.notifsCache = notifs || [];
      (notifs || []).forEach(function (n) { APP.notifIdsConocidos[n.ID] = true; });
      actualizarBadgeNotif();
      pintarListaNotificaciones();
    }).catch(function () {});
}

function pintarListaNotificaciones() {
  var lista = document.getElementById('listaNotifs');
  if (!lista) return;
  var notifs = APP.notifsCache || [];
  if (!notifs.length) {
    lista.innerHTML = '<p class="text-sm opacity-60 text-center py-6"><i class="fa-regular fa-bell-slash mr-1"></i> No hay notificaciones.</p>';
    return;
  }
  lista.innerHTML = notifs.slice(0, 50).map(function (n) {
    var noLeida = !n.Leida;
    // Formatea las reservas (mensaje estructurado) de forma legible.
    var res = parseNotifReserva(n.Mensaje);
    var texto = res
      ? 'Nueva reserva · <b>' + escaparHTML(etiquetaHab(res.hab)) + '</b> · ' + escaparHTML(res.servicio) + ' · ' + escaparHTML(fechaCorta(res.fecha)) + ' ' + escaparHTML(res.hora)
      : escaparHTML(n.Mensaje);
    var icono = res ? 'fa-calendar-check' : (n.Tipo === 'capacidad' ? 'fa-triangle-exclamation' : 'fa-circle-info');
    return '<div class="flex items-start gap-2 py-2 border-b" style="border-color: var(--borde);' + (noLeida ? '' : 'opacity:.55;') + '">' +
      '<i class="fa-solid ' + icono + ' mt-1 text-sm" style="color: var(--dorado)"></i>' +
      '<div class="flex-1">' +
        '<p class="text-sm' + (noLeida ? ' font-semibold' : '') + '">' + texto + '</p>' +
        '<p class="text-[11px] opacity-50">' + escaparHTML(n.Timestamp) + '</p>' +
      '</div>' +
      (noLeida ? '<button class="btn btn-outline !py-1 !px-2 text-xs" title="Marcar leida" onclick="marcarLeidaUI(\'' + n.ID + '\', this)"><i class="fa-solid fa-check"></i></button>' : '') +
    '</div>';
  }).join('');
}

function marcarLeidaUI(id, boton) {
  boton.disabled = true;
  llamarAPI('marcarNotificacionLeida', [id], { loader: false, silencioso: true }).then(function () {
    (APP.notifsCache || []).forEach(function (n) { if (n.ID === id) n.Leida = true; });
    boton.parentElement.style.opacity = '.55';
    boton.remove();
    actualizarBadgeNotif();
  }).catch(function () { boton.disabled = false; });
}

function marcarTodasLeidas() {
  llamarAPI('marcarTodasNotificacionesLeidas', [APP.usuarioStaff.Rol], { loader: false }).then(function () {
    (APP.notifsCache || []).forEach(function (n) { n.Leida = true; });
    pintarListaNotificaciones();
    actualizarBadgeNotif();
  });
}

/* ---------- Centro de Operaciones ---------- */

/* Cambia el dia mostrado en el centro de operaciones (delta en dias). */
function cambiarDiaOps(delta) {
  var d = new Date((APP.fechaOps || hoyISO()) + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  renderOperaciones(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
}

/* Nombre legible del dia: "Miercoles 9 de julio". */
function nombreDia(fechaISO) {
  var d = new Date(fechaISO + 'T12:00:00');
  var texto = d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function renderOperaciones(fecha) {
  APP.fechaOps = fecha || APP.fechaOps || hoyISO();
  fecha = APP.fechaOps;
  var esHoy = fecha === hoyISO();

  var cont = document.getElementById('staffOperaciones');
  // Barra de navegacion de fechas (siempre visible, el contenido carga abajo).
  cont.innerHTML =
    '<div class="flex flex-wrap items-center justify-between gap-3 mb-4">' +
      '<h2 class="text-2xl" style="color:var(--verde-bosque)">Centro de Operaciones</h2>' +
      '<div class="flex items-center gap-2 flex-wrap">' +
        '<button class="btn btn-primary !py-2 !px-3 text-sm" onclick="abrirNuevaReservaStaff()"><i class="fa-solid fa-plus"></i> Nueva Reserva</button>' +
        '<button class="btn btn-outline !py-2 !px-3" onclick="cambiarDiaOps(-1)" title="Dia anterior"><i class="fa-solid fa-chevron-left"></i></button>' +
        '<input id="fechaOps" class="input !w-40 text-center cursor-pointer" readonly>' +
        '<button class="btn btn-outline !py-2 !px-3" onclick="cambiarDiaOps(1)" title="Dia siguiente"><i class="fa-solid fa-chevron-right"></i></button>' +
        (esHoy ? '' : '<button class="btn btn-dorado !py-2 !px-3 text-sm" onclick="renderOperaciones(hoyISO())">Hoy</button>') +
      '</div>' +
    '</div>' +
    '<p class="text-sm opacity-60 mb-4 -mt-2">' + nombreDia(fecha) + (esHoy ? ' · Hoy' : '') + '</p>' +
    '<div id="opsContenido"><div class="flex justify-center py-8"><div class="spinner"></div></div></div>';

  // Calendario para saltar a cualquier fecha.
  flatpickr('#fechaOps', {
    locale: 'es', dateFormat: 'Y-m-d', defaultDate: fecha,
    onChange: function (sel, fechaStr) { if (fechaStr && fechaStr !== APP.fechaOps) renderOperaciones(fechaStr); }
  });

  cargarOpsContenido();
}

/* Carga (o refresca) SOLO el contenido del centro de operaciones, sin tocar la
   barra de fechas. Se usa al abrir y en el refresco automatico. */
function cargarOpsContenido() {
  var fecha = APP.fechaOps || hoyISO();
  var esHoy = fecha === hoyISO();
  var zona = document.getElementById('opsContenido');
  if (!zona) return;
  llamarAPI('obtenerCentroOperaciones', [fecha], { loader: false, silencioso: true }).then(function (data) {
    var alertasHTML = (data.alertas || []).length ?
      '<div class="card p-4 mb-4" style="border-left:4px solid var(--dorado)"><p class="font-semibold mb-2"><i class="fa-solid fa-triangle-exclamation" style="color:var(--dorado)"></i> Alertas</p>' +
      data.alertas.map(function (a) { return '<p class="text-sm opacity-80">· ' + escaparHTML(a) + '</p>'; }).join('') + '</div>' : '';

    // Guarda datos de cada reserva para el editor (sin otra llamada).
    APP.reservasCache = APP.reservasCache || {};

    // Indexa pedidos por reserva para mostrarlos DENTRO de cada reserva.
    APP.pedidosOps = data.pedidos || [];
    var pedidoPorReserva = {};
    APP.pedidosOps.forEach(function (p) { if (p.ReservaID) pedidoPorReserva[p.ReservaID] = p; });

    // Resumen del dia: cuantas reservas por servicio (deteccion rapida).
    var conteo = {}, servPorNombre = {};
    (data.bloques || []).forEach(function (b) {
      b.items.forEach(function (it) {
        conteo[it.servicioNombre] = (conteo[it.servicioNombre] || 0) + 1;
        servPorNombre[it.servicioNombre] = it.servicioID;
      });
    });
    var resumenHTML = Object.keys(conteo).length
      ? '<div class="flex flex-wrap gap-2 mb-4">' + Object.keys(conteo).map(function (nom) {
          var col = colorDeServicio(servPorNombre[nom], nom);
          var ic = iconoServicio((APP.servicios || []).filter(function (x) { return x.ID === servPorNombre[nom]; })[0] || { ID: '', Categoria: '' });
          return '<span class="pill inline-flex items-center gap-1" style="background:' + col + '40; color:' + col + '; border-color:' + col + '99;">' +
            '<i class="fa-solid ' + ic + '"></i> ' + escaparHTML(nom) + ' <b>' + conteo[nom] + '</b></span>';
        }).join('') + '</div>'
      : '';

    var timelineHTML = (data.bloques || []).length ? data.bloques.map(function (b) {
      return '<div class="flex gap-3 mb-4">' +
        '<div class="w-14 text-right font-semibold shrink-0" style="color:var(--verde-bosque)">' + b.hora + '</div>' +
        '<div class="flex-1 border-l-2 pl-3 pb-2" style="border-color: var(--borde)">' +
          b.items.map(function (it) {
            APP.reservasCache[it.reservaID] = {
              servicioID: it.servicioID, fecha: fecha, horaInicio: it.horaInicio,
              personas: it.personas, notas: it.notas
            };
            var esComida = servicioPermitePedido(it.servicioID);
            var pedido = pedidoPorReserva[it.reservaID];

            var acciones = '';
            if (['Solicitada', 'Pendiente aprobacion'].indexOf(it.estado) !== -1) {
              acciones += '<button class="btn btn-primary !py-1 !px-2 text-xs" onclick="confirmarReservaStaff(\'' + it.reservaID + '\',\'ops\')" title="Confirmar"><i class="fa-solid fa-check"></i></button>';
            }
            if (['Solicitada', 'Pendiente aprobacion', 'Confirmada', 'En curso'].indexOf(it.estado) !== -1) {
              acciones += '<button class="btn btn-outline !py-1 !px-2 text-xs" onclick="abrirEditarReserva(\'' + it.reservaID + '\',\'ops\')" title="Editar"><i class="fa-solid fa-pen"></i></button>';
              // Agregar/editar pedido para servicios de comida (recepcion).
              if (esComida) {
                acciones += '<button class="btn btn-dorado !py-1 !px-2 text-xs" onclick="abrirPrepedidoOps(\'' + it.reservaID + '\',\'' + it.horaInicio + '\')" title="' + (pedido ? 'Editar pedido' : 'Agregar pedido') + '"><i class="fa-solid fa-utensils"></i></button>';
              }
              acciones += '<button class="btn btn-peligro !py-1 !px-2 text-xs" onclick="cancelarReservaStaff(\'' + it.reservaID + '\',\'ops\')" title="Cancelar"><i class="fa-solid fa-xmark"></i></button>';
            }

            // Detalle del pedido, dentro de la misma reserva.
            var pedidoHTML = '';
            if (pedido) {
              var esHab = pedido.Entrega === 'Habitacion';
              // Badge de entrega bien visible (recalcado si es a la habitacion).
              var badgeEntrega = esHab
                ? '<span class="pill" style="background:#8B3A3A;color:#fff;font-size:.7rem"><i class="fa-solid fa-bell-concierge"></i> A LA HABITACION</span>'
                : '<span class="pill estado-Finalizada"><i class="fa-solid fa-utensils"></i> En restaurant</span>';
              pedidoHTML = '<div class="mt-2 pt-2 border-t text-xs" style="border-color:var(--borde)' + (esHab ? ';background:#8B3A3A14;border-radius:8px;padding:8px' : '') + '">' +
                '<div class="flex items-center justify-between mb-1"><p class="font-semibold"><i class="fa-solid fa-utensils" style="color:var(--dorado)"></i> Pedido</p>' + badgeEntrega + '</div>' +
                pedido.Detalles.map(function (d) {
                  return '<div class="flex justify-between"><span>' + d.Cantidad + 'x ' + escaparHTML(d.Nombre) + (d.Notas ? ' <i class="opacity-50">(' + escaparHTML(d.Notas) + ')</i>' : '') + '</span><span>' + fmtMoneda(d.Subtotal) + '</span></div>';
                }).join('') +
                (pedido.Notas ? '<p class="opacity-70 mt-1"><i class="fa-solid fa-note-sticky"></i> ' + escaparHTML(pedido.Notas) + '</p>' : '') +
                '<div class="flex justify-between font-semibold mt-1"><span>Total</span><span>' + fmtMoneda(pedido.Total) + '</span></div>' + '</div>';
            }

            // Identificacion visual del servicio: color propio + icono en circulo.
            var col = colorDeServicio(it.servicioID, it.servicioNombre);
            var icono = iconoServicio((APP.servicios || []).filter(function (x) { return x.ID === it.servicioID; })[0] || { ID: it.servicioID, Categoria: '' });
            return '<div class="card p-3 mb-2" style="border-left:6px solid ' + col + '; background:' + col + '40;">' +
              '<div class="flex items-start gap-3">' +
                '<div class="shrink-0 flex items-center justify-center rounded-full" style="width:44px;height:44px;font-size:1.15rem;background:' + col + ';color:#fff;box-shadow:inset 0 -2px 4px rgba(0,0,0,.3)"><i class="fa-solid ' + icono + '"></i></div>' +
                '<div class="flex-1 min-w-0">' +
                  '<div class="flex items-start justify-between gap-2">' +
                    '<p class="font-bold text-xl leading-tight" style="color:var(--grafito)">' + etiquetaHab(it.habitacion) + '</p>' +
                    '<span class="pill ' + claseEstado(it.estado) + '">' + it.estado + '</span>' +
                  '</div>' +
                  '<p class="font-semibold text-base leading-tight" style="color:' + col + '">' + escaparHTML(it.servicioNombre) + (it.variante ? ' · ' + escaparHTML(it.variante) : '') + '</p>' +
                  '<p class="text-xs opacity-70 mt-0.5">' + it.personas + ' pers.' + (it.notas ? ' · ' + escaparHTML(it.notas) : '') + '</p>' +
                '</div>' +
              '</div>' + pedidoHTML +
              (acciones ? '<div class="flex flex-wrap gap-1 justify-end mt-2">' + acciones + '</div>' : '') +
            '</div>';
          }).join('') +
        '</div></div>';
    }).join('') : '<div class="card p-8 text-center opacity-60 text-sm"><i class="fa-regular fa-calendar text-2xl block mb-2 opacity-50"></i>Sin actividad registrada para ' + (esHoy ? 'hoy' : 'este dia') + '.</div>';

    // Solo el contenido se reemplaza; la barra de fechas queda intacta.
    zona.innerHTML = alertasHTML + resumenHTML + timelineHTML;
  }).catch(function () {
    zona.innerHTML = htmlError('No pudimos cargar el centro de operaciones.', 'renderOperaciones()');
  });
}

/* Etiqueta de la "habitacion" (o pasante/grupo si es externo). */
function etiquetaHab(hab) {
  var h = String(hab || '');
  if (/^\d+$/.test(h)) return 'Hab ' + h;   // numero de habitacion
  return escaparHTML(h);                     // pasante / grupo (texto libre)
}

/* Paleta para el selector de color en el formulario de servicios y como
   respaldo. Colores distinguibles entre si, acordes al estilo sobrio. */
var PALETA_SERVICIOS = ['#3E6FA3', '#2E8A86', '#7E4EA3', '#4E8A5B', '#9C4A63', '#556070',
  '#C0603E', '#5B5FB0', '#8B3A5A', '#3A7D8C', '#6E7F3E', '#A6524B'];

/* Color de un servicio: usa el guardado (columna Color); si no, uno estable
   derivado del nombre como respaldo. */
function colorDeServicio(servicioID, nombre) {
  var s = (APP.servicios || []).filter(function (x) { return x.ID === servicioID; })[0];
  if (s && s.Color) return s.Color;
  var base = (s && s.Nombre) || nombre || servicioID || '';
  var h = 0;
  for (var i = 0; i < base.length; i++) h = (h * 31 + base.charCodeAt(i)) >>> 0;
  return PALETA_SERVICIOS[h % PALETA_SERVICIOS.length];
}

/* True si el servicio permite pedido (comida): usa APP.servicios. */
function servicioPermitePedido(servicioID) {
  var s = (APP.servicios || []).filter(function (x) { return x.ID === servicioID; })[0];
  return s && s.PermitePrepedido;
}

/* Abre el prepedido desde operaciones para una reserva (recepcion). */
function abrirPrepedidoOps(reservaID, hora) {
  APP.prepedidoOrigen = 'ops';
  abrirPrepedido(reservaID, { ID: reservaID, Fecha: APP.fechaOps, HoraInicio: hora });
}

/* Refresca la vista staff correcta despues de una accion sobre reservas. */
function refrescarVistaStaff(origen) {
  if (origen === 'ops') renderOperaciones();
  else aplicarFiltrosReservas();
}

/* ---------- Editar reserva (recepcion/admin) ---------- */
function abrirEditarReserva(reservaID, origen) {
  var r = (APP.reservasCache || {})[reservaID];
  if (!r) { mostrarToast('No encontramos los datos de la reserva.', 'error'); return; }
  APP.edicionOrigen = origen || 'tabla';
  APP.edicionReservaID = reservaID;
  APP.edicionServicioID = r.servicioID;
  APP.edicionHoraActual = r.horaInicio;

  mostrarModal({
    titulo: 'Editar reserva',
    contenidoHTML:
      '<div class="grid grid-cols-2 gap-4 mb-3">' +
        '<div><label class="lbl">Fecha</label><input id="edFecha" class="input" value="' + r.fecha + '"></div>' +
        '<div><label class="lbl">Personas</label><input id="edPersonas" type="number" min="1" class="input" value="' + r.personas + '"></div>' +
      '</div>' +
      '<label class="lbl">Hora</label>' +
      '<div class="flex gap-2 mb-3">' +
        '<select id="edHora" class="input flex-1"><option value="' + r.horaInicio + '">' + r.horaInicio + ' (actual)</option></select>' +
        '<button class="btn btn-outline !py-2 !px-3" onclick="buscarHorariosEdicion()" title="Ver horarios disponibles"><i class="fa-solid fa-clock"></i></button>' +
      '</div>' +
      '<label class="lbl">Notas</label>' +
      '<textarea id="edNotas" class="input" rows="2">' + escaparHTML(r.notas || '') + '</textarea>',
    botones: [
      { texto: 'Cancelar', clase: 'btn-outline', accion: cerrarModal },
      { texto: 'Guardar cambios', clase: 'btn-primary', accion: guardarEdicionReserva }
    ]
  });
  flatpickr('#edFecha', { locale: 'es', dateFormat: 'Y-m-d', minDate: 'today', defaultDate: r.fecha,
    onChange: function () { buscarHorariosEdicion(true); } });
  // Carga los horarios disponibles de inmediato (sin tener que apretar el reloj).
  buscarHorariosEdicion(true);
}

function buscarHorariosEdicion(silencioso) {
  var fecha = document.getElementById('edFecha').value;
  var personas = document.getElementById('edPersonas').value;
  var select = document.getElementById('edHora');
  var horaActual = APP.edicionHoraActual || select.value;
  llamarAPI('consultarDisponibilidad', [APP.edicionServicioID, fecha, personas], { loader: false, silencioso: true })
    .then(function (res) {
      var opciones = '<option value="' + horaActual + '">' + horaActual + ' (actual)</option>';
      (res.bloques || []).forEach(function (b) {
        if (b.hora !== horaActual) opciones += '<option value="' + b.hora + '">' + b.hora + '</option>';
      });
      select.innerHTML = opciones;
      if (!silencioso) mostrarToast((res.bloques || []).length + ' horarios disponibles.', 'exito');
    })
    .catch(function () { if (!silencioso) mostrarToast('No pudimos consultar horarios.', 'error'); });
}

function guardarEdicionReserva() {
  var datos = {
    fecha: document.getElementById('edFecha').value,
    horaInicio: document.getElementById('edHora').value,
    personas: document.getElementById('edPersonas').value,
    notas: document.getElementById('edNotas').value
  };
  llamarAPI('modificarReserva', [APP.edicionReservaID, datos]).then(function (res) {
    mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
    if (res.success) { cerrarModal(); refrescarVistaStaff(APP.edicionOrigen); }
  });
}

/* ---------- Nueva reserva creada por recepcion ---------- */
function abrirNuevaReservaStaff() {
  function pintar() {
    var habOpts = APP.habitacionesStaff.map(function (h) {
      return '<option value="' + h.Numero + '">' + h.Numero + '</option>';
    }).join('');
    var servOpts = APP.servicios.map(function (s) {
      return '<option value="' + s.ID + '">' + escaparHTML(s.Nombre) + '</option>';
    }).join('');
    mostrarModal({
      titulo: 'Nueva reserva (recepcion)',
      contenidoHTML:
        '<label class="lbl">Para quien es</label>' +
        '<div class="grid grid-cols-3 gap-2 mb-3">' +
          '<button type="button" class="btn btn-dorado tipo-cliente" data-tipo="habitacion" onclick="seleccionarTipoCliente(\'habitacion\')">Habitacion</button>' +
          '<button type="button" class="btn btn-outline tipo-cliente" data-tipo="pasante" onclick="seleccionarTipoCliente(\'pasante\')">Pasante</button>' +
          '<button type="button" class="btn btn-outline tipo-cliente" data-tipo="grupo" onclick="seleccionarTipoCliente(\'grupo\')">Grupo</button>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-4 mb-3">' +
          '<div id="nrHabBox"><label class="lbl">Habitacion</label><select id="nrHab" class="input">' + habOpts + '</select></div>' +
          '<div id="nrNombreBox" class="oculto"><label class="lbl" id="nrNombreLbl">Nombre</label><input id="nrNombre" class="input" placeholder="Ej: Familia Perez"></div>' +
          '<div><label class="lbl">Servicio</label><select id="nrServicio" class="input" onchange="alCambiarServicioStaff()">' + servOpts + '</select></div>' +
          '<div><label class="lbl">Fecha</label><input id="nrFecha" class="input"></div>' +
          '<div><label class="lbl">Personas</label><input id="nrPersonas" type="number" min="1" value="2" class="input"></div>' +
        '</div>' +
        '<div id="nrVarianteBox" class="mb-3 oculto"><label class="lbl">Opcion</label><select id="nrVariante" class="input"></select></div>' +
        '<button class="btn btn-outline w-full mb-2" onclick="buscarHorariosNuevaReserva()"><i class="fa-solid fa-clock"></i> Ver horarios disponibles</button>' +
        '<div id="nrHorarios" class="grid grid-cols-3 gap-2 mb-3"></div>' +
        '<label class="lbl">Notas</label>' +
        '<textarea id="nrNotas" class="input" rows="2" placeholder="Preferencias, ocasion especial, etc."></textarea>' +
        '<p class="text-xs opacity-50 mt-2">La reserva quedara Confirmada de inmediato (salvo servicios que requieren aprobacion). Recepcion no tiene limite de dias.</p>',
      botones: [
        { texto: 'Cancelar', clase: 'btn-outline', accion: cerrarModal },
        { texto: 'Crear reserva', clase: 'btn-primary', accion: crearReservaDesdeStaff }
      ]
    });
    APP.tipoClienteNR = 'habitacion';
    APP.horaNR = '';
    // Sin maxDate: recepcion puede agendar cuando quiera. Al cambiar la fecha
    // o las personas, recarga los horarios automaticamente.
    flatpickr('#nrFecha', { locale: 'es', dateFormat: 'Y-m-d', minDate: 'today', defaultDate: APP.fechaOps || 'today',
      onChange: function () { buscarHorariosNuevaReserva(); } });
    var pers = document.getElementById('nrPersonas');
    if (pers) pers.addEventListener('change', buscarHorariosNuevaReserva);
    // alCambiarServicioStaff ya dispara la carga de horarios.
    alCambiarServicioStaff();
  }
  // Las habitaciones se piden una sola vez y quedan en memoria.
  if (APP.habitacionesStaff) { pintar(); }
  else {
    llamarAPI('obtenerHabitaciones', [], { loader: true }).then(function (habs) {
      APP.habitacionesStaff = habs || [];
      pintar();
    });
  }
}

/* Cambia el tipo de cliente de la nueva reserva (habitacion/pasante/grupo). */
function seleccionarTipoCliente(tipo) {
  APP.tipoClienteNR = tipo;
  document.querySelectorAll('.tipo-cliente').forEach(function (b) {
    var sel = b.getAttribute('data-tipo') === tipo;
    b.classList.toggle('btn-dorado', sel); b.classList.toggle('btn-outline', !sel);
  });
  var esHab = tipo === 'habitacion';
  document.getElementById('nrHabBox').classList.toggle('oculto', !esHab);
  document.getElementById('nrNombreBox').classList.toggle('oculto', esHab);
  document.getElementById('nrNombreLbl').textContent = tipo === 'grupo' ? 'Nombre del grupo' : 'Nombre del pasante';
}

/* Muestra/oculta el selector de variante segun el servicio elegido (staff). */
function alCambiarServicioStaff() {
  var servicioID = document.getElementById('nrServicio').value;
  var s = (APP.servicios || []).filter(function (x) { return x.ID === servicioID; })[0];
  var box = document.getElementById('nrVarianteBox');
  var sel = document.getElementById('nrVariante');
  if (s && s.Variantes && s.Variantes.length) {
    sel.innerHTML = s.Variantes.map(function (v) {
      return '<option value="' + escaparHTML(v.nombre) + '">' + escaparHTML(v.nombre) + ' · ' + fmtMoneda(v.precio) + '</option>';
    }).join('');
    box.classList.remove('oculto');
  } else {
    sel.innerHTML = ''; box.classList.add('oculto');
  }
  // Al cambiar de servicio, invalida la hora elegida y recarga horarios.
  APP.horaNR = '';
  if (document.getElementById('nrHorarios')) buscarHorariosNuevaReserva();
}

/* Selecciona una hora en la grilla de la nueva reserva (staff). */
function seleccionarHoraNR(el, hora) {
  document.querySelectorAll('#nrHorarios button').forEach(function (b) {
    b.classList.remove('btn-dorado'); b.classList.add('btn-outline');
  });
  el.classList.remove('btn-outline'); el.classList.add('btn-dorado');
  APP.horaNR = hora;
}

function buscarHorariosNuevaReserva() {
  var servicioID = document.getElementById('nrServicio').value;
  var fecha = document.getElementById('nrFecha').value;
  var personas = document.getElementById('nrPersonas').value;
  var cont = document.getElementById('nrHorarios');
  if (!cont) return;
  if (!fecha) { cont.innerHTML = '<p class="col-span-3 text-xs opacity-50 text-center py-2">Elige una fecha.</p>'; return; }
  APP.horaNR = '';
  cont.innerHTML = '<div class="col-span-3 flex justify-center py-2"><div class="spinner"></div></div>';
  llamarAPI('consultarDisponibilidad', [servicioID, fecha, personas], { loader: false, silencioso: true })
    .then(function (res) {
      if (!res.success || !res.bloques.length) {
        cont.innerHTML = '<p class="col-span-3 text-xs opacity-60 text-center py-2">Sin horarios disponibles.</p>';
        return;
      }
      cont.innerHTML = res.bloques.map(function (b) {
        return '<button type="button" class="btn btn-outline !py-2 text-sm" onclick="seleccionarHoraNR(this,\'' + b.hora + '\')">' + b.hora + '</button>';
      }).join('');
    })
    .catch(function () { cont.innerHTML = '<p class="col-span-3 text-xs opacity-60 text-center py-2">No pudimos consultar horarios.</p>'; });
}

function crearReservaDesdeStaff() {
  var hora = APP.horaNR || '';
  if (!hora) { mostrarToast('Elige un horario.', 'error'); return; }
  var varBox = document.getElementById('nrVarianteBox');
  var variante = (varBox && !varBox.classList.contains('oculto')) ? document.getElementById('nrVariante').value : '';

  var tipo = APP.tipoClienteNR || 'habitacion';
  var habitacion;
  if (tipo === 'habitacion') {
    habitacion = document.getElementById('nrHab').value;
  } else {
    var nombre = (document.getElementById('nrNombre').value || '').trim();
    if (!nombre) { mostrarToast('Escribe el nombre del ' + (tipo === 'grupo' ? 'grupo' : 'pasante') + '.', 'error'); return; }
    // Prefijo para distinguir en operaciones (ej. "Pasante: Juan").
    habitacion = (tipo === 'grupo' ? 'Grupo: ' : 'Pasante: ') + nombre;
  }

  var datos = {
    habitacion: habitacion,
    tipoCliente: tipo,
    servicioID: document.getElementById('nrServicio').value,
    variante: variante,
    fecha: document.getElementById('nrFecha').value,
    horaInicio: hora,

    habitacion: document.getElementById('filtroHab').value || '',

  };

function filaReservaStaff(r) {
  // Cachea los datos para el modal de edicion.
  APP.reservasCache = APP.reservasCache || {};
  APP.reservasCache[r.ID] = {
    servicioID: r.ServicioID, fecha: r.Fecha, horaInicio: r.HoraInicio,
    personas: r.Personas, notas: r.Notas
  };
  var acciones = '';
  if (['Solicitada', 'Pendiente aprobacion'].indexOf(r.Estado) !== -1) {
    acciones += '<button class="btn btn-primary !py-1 !px-2 text-xs mr-1" onclick="confirmarReservaStaff(\'' + r.ID + '\')" title="Confirmar"><i class="fa-solid fa-check"></i></button>';
  }
  if (['Solicitada', 'Pendiente aprobacion', 'Confirmada'].indexOf(r.Estado) !== -1) {
    acciones += '<button class="btn btn-outline !py-1 !px-2 text-xs mr-1" onclick="abrirEditarReserva(\'' + r.ID + '\')" title="Editar"><i class="fa-solid fa-pen"></i></button>';
    acciones += '<button class="btn btn-peligro !py-1 !px-2 text-xs mr-1" onclick="cancelarReservaStaff(\'' + r.ID + '\')" title="Cancelar"><i class="fa-solid fa-xmark"></i></button>';
  }
  if (r.PrepedidoID) {
    acciones += '<button class="btn btn-outline !py-1 !px-2 text-xs" onclick="verPedidoStaff(\'' + r.ID + '\')" title="Ver pedido"><i class="fa-solid fa-utensils"></i></button>';
  }
  return '<tr>' +
    '<td>' + r.Fecha + '</td><td>' + r.HoraInicio + '</td><td>' + r.Habitacion + '</td>' +
    '<td>' + escaparHTML(r.ServicioNombre) + '</td><td>' + r.Personas + '</td>' +
    '<td><span class="pill ' + claseEstado(r.Estado) + '">' + r.Estado + '</span></td>' +
    '<td class="whitespace-nowrap">' + (acciones || '—') + '</td>' +
  '</tr>';
}

function cargarTablaCarta() {
  var tabla = document.getElementById('tablaCarta');
  tabla.innerHTML = '<div class="flex justify-center py-6"><div class="spinner"></div></div>';
  llamarAPI('obtenerProductosGestion', [], { loader: false }).then(function (productos) {
    APP.productosGestion = productos;
    filtrarCarta();
  }).catch(function () {
    tabla.innerHTML = htmlError('No pudimos cargar la carta.', 'cargarTablaCarta()');
  });
}

function filtrarCarta() {
  var productos = APP.productosGestion || [];
  var cat = document.getElementById('filtroCatCarta').value;
  var busqueda = (document.getElementById('buscarCarta').value || '').toLowerCase();
  var catNombre = {};
  APP.categorias.forEach(function (c) { catNombre[c.ID] = c.Nombre; });

  var filtrados = productos.filter(function (p) {
    if (cat && p.CategoriaID !== cat) return false;
    if (busqueda && p.Nombre.toLowerCase().indexOf(busqueda) === -1) return false;
    return true;
  });

  var tabla = document.getElementById('tablaCarta');
  if (!filtrados.length) { tabla.innerHTML = '<p class="text-sm opacity-60 py-4 text-center">Sin productos.</p>'; return; }
  tabla.innerHTML = '<table class="tabla"><thead><tr>' +
    '<th>Nombre</th><th>Categoria</th><th>Precio</th><th>Disponible</th><th>Visible</th><th>Orden</th><th>Acciones</th>' +
    '</tr></thead><tbody>' + filtrados.map(function (p) {
      return '<tr>' +
        '<td>' + escaparHTML(p.Nombre) + '</td>' +
        '<td class="text-xs opacity-70">' + escaparHTML(catNombre[p.CategoriaID] || p.CategoriaID) + '</td>' +
        '<td>' + fmtMoneda(p.Precio) + '</td>' +
        '<td><label class="switch"><input type="checkbox" ' + (p.Disponible ? 'checked' : '') + ' onchange="toggleDisponible(\'' + p.ID + '\', this.checked)"><span class="slider"></span></label></td>' +
        '<td>' + (p.Visible ? '<i class="fa-solid fa-eye" style="color:var(--verde-bosque)"></i>' : '<i class="fa-solid fa-eye-slash opacity-40"></i>') + '</td>' +
        '<td>' + p.Orden + '</td>' +
        '<td class="whitespace-nowrap">' +
          '<button class="btn btn-outline !py-1 !px-2 text-xs mr-1" onclick="abrirFormProducto(\'' + p.ID + '\')" title="Editar"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="btn btn-peligro !py-1 !px-2 text-xs" onclick="eliminarProductoStaff(\'' + p.ID + '\')" title="Ocultar"><i class="fa-solid fa-trash"></i></button>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
}

function toggleDisponible(productoID, nuevoEstado) {
  llamarAPI('toggleDisponibleProducto', [productoID, nuevoEstado, APP.usuarioStaff.Email], { loader: false }).then(function (res) {
    mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
    if (res.success && APP.productosGestion) {
      APP.productosGestion.forEach(function (p) { if (p.ID === productoID) p.Disponible = nuevoEstado; });
    }
  });
}

function eliminarProductoStaff(productoID) {
  mostrarModal({
    titulo: 'Ocultar producto',
    contenidoHTML: '<p class="text-sm">El producto se ocultara de la carta (soft delete). Podras reactivarlo despues. Se conserva el historial de pedidos.</p>',
    botones: [
      { texto: 'Cancelar', clase: 'btn-outline', accion: cerrarModal },
      { texto: 'Ocultar', clase: 'btn-peligro', accion: function () {
        llamarAPI('eliminarProducto', [productoID, APP.usuarioStaff.Email]).then(function (res) {
          cerrarModal(); mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
          if (res.success) cargarTablaCarta();
        });
      }}
    ]
  });
}

function abrirFormProducto(productoID) {
  var catOpts = APP.categorias.map(function (c) { return '<option value="' + c.ID + '">' + escaparHTML(c.Nombre) + '</option>'; }).join('');

  function pintarForm(p) {
    p = p || { CategoriaID: APP.categorias[0] ? APP.categorias[0].ID : '', Disponible: true, Visible: true, Orden: 0, TiempoPreparacionMin: 0, EsMenuDelDia: false, Etiquetas: '', Precio: 0, Nombre: '', Descripcion: '', NombreEN: '', DescripcionEN: '' };
    var etiquetasSel = (p.Etiquetas || '').split(',').map(function (e) { return e.trim(); });
    function chkEtiqueta(nombre) { return etiquetasSel.indexOf(nombre) !== -1 ? 'checked' : ''; }

    var form =
      '<input type="hidden" id="prodID" value="' + (p.ID || '') + '">' +
      '<label class="lbl">Categoria</label><select id="prodCat" class="input mb-2">' + catOpts + '</select>' +
      '<label class="lbl">Nombre</label><input id="prodNombre" class="input mb-2" value="' + escaparHTML(p.Nombre) + '">' +
      '<label class="lbl"><i class="fa-solid fa-language"></i> Nombre (ingles)</label><input id="prodNombreEN" class="input mb-2" placeholder="English name" value="' + escaparHTML(p.NombreEN || '') + '">' +
      '<label class="lbl">Descripcion</label><textarea id="prodDesc" class="input mb-2" rows="2">' + escaparHTML(p.Descripcion) + '</textarea>' +
      '<label class="lbl"><i class="fa-solid fa-language"></i> Descripcion (ingles)</label><textarea id="prodDescEN" class="input mb-2" rows="2" placeholder="English description">' + escaparHTML(p.DescripcionEN || '') + '</textarea>' +
      '<div class="grid grid-cols-2 gap-2">' +
        '<div><label class="lbl">Precio</label><input id="prodPrecio" type="number" class="input mb-2" value="' + p.Precio + '"></div>' +
        '<div><label class="lbl">Orden</label><input id="prodOrden" type="number" class="input mb-2" value="' + p.Orden + '"></div>' +
      '</div>' +
      '<div class="grid grid-cols-2 gap-2">' +
        '<div><label class="lbl">Tiempo prep. (min)</label><input id="prodTiempo" type="number" class="input mb-2" value="' + p.TiempoPreparacionMin + '"></div>' +
        '<div><label class="lbl">Etiquetas</label>' +
          '<div class="flex flex-col gap-1 text-sm">' +
            '<label><input type="checkbox" class="etq" value="Vegano" ' + chkEtiqueta('Vegano') + '> Vegano</label>' +
            '<label><input type="checkbox" class="etq" value="Sin Gluten" ' + chkEtiqueta('Sin Gluten') + '> Sin Gluten</label>' +
            '<label><input type="checkbox" class="etq" value="Picante" ' + chkEtiqueta('Picante') + '> Picante</label>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="flex gap-6 mt-3">' +
        '<label class="flex items-center gap-2 text-sm"><span class="switch"><input type="checkbox" id="prodDisp" ' + (p.Disponible ? 'checked' : '') + '><span class="slider"></span></span> Disponible</label>' +
        '<label class="flex items-center gap-2 text-sm"><span class="switch"><input type="checkbox" id="prodVis" ' + (p.Visible ? 'checked' : '') + '><span class="slider"></span></span> Visible</label>' +
        '<label class="flex items-center gap-2 text-sm"><span class="switch"><input type="checkbox" id="prodMenu" ' + (p.EsMenuDelDia ? 'checked' : '') + '><span class="slider"></span></span> Menu del dia</label>' +
      '</div>';

    mostrarModal({
      titulo: productoID ? 'Editar plato' : 'Nuevo plato',
      contenidoHTML: form,
      botones: [
        { texto: 'Cancelar', clase: 'btn-outline', accion: cerrarModal },
        { texto: 'Guardar', clase: 'btn-primary', accion: guardarProductoStaff }
      ]
    });
    if (p.CategoriaID) document.getElementById('prodCat').value = p.CategoriaID;
  }

  if (productoID) {
    llamarAPI('obtenerProductoParaEditar', [productoID]).then(pintarForm);
  } else {
    pintarForm(null);
  }

function guardarProductoStaff() {
  var etiquetas = Array.prototype.slice.call(document.querySelectorAll('.etq:checked')).map(function (e) { return e.value; }).join(', ');
  var datos = {
    id: document.getElementById('prodID').value,
    categoriaID: document.getElementById('prodCat').value,
    nombre: document.getElementById('prodNombre').value,
    nombreEN: document.getElementById('prodNombreEN').value,
    descripcion: document.getElementById('prodDesc').value,
    descripcionEN: document.getElementById('prodDescEN').value,
    precio: document.getElementById('prodPrecio').value,
    orden: document.getElementById('prodOrden').value,
    tiempoPreparacionMin: document.getElementById('prodTiempo').value,
    etiquetas: etiquetas,
    disponible: document.getElementById('prodDisp').checked,
    visible: document.getElementById('prodVis').checked,
    esMenuDelDia: document.getElementById('prodMenu').checked,
    email: APP.usuarioStaff.Email
  };
  if (!datos.nombre) { mostrarToast('El nombre es obligatorio.', 'error'); return; }
  llamarAPI('guardarProducto', [datos]).then(function (res) {
    mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
    if (res.success) { cerrarModal(); cargarTablaCarta(); }
  });
}

function buscarHistorial() {
  // Resuelve productoID por nombre (si se ingreso).
  var nombreProd = (document.getElementById('hisProducto').value || '').toLowerCase();
  var productoID = '';
  if (nombreProd && APP.productosGestion) {
    var encontrado = APP.productosGestion.filter(function (p) { return p.Nombre.toLowerCase().indexOf(nombreProd) !== -1; })[0];
    if (encontrado) productoID = encontrado.ID;
  }
  var filtros = {
    habitacion: document.getElementById('hisHab').value || '',
    fechaDesde: document.getElementById('hisDesde').value || '',
    fechaHasta: document.getElementById('hisHasta').value || '',
    servicioID: document.getElementById('hisServicio').value || '',
    productoID: productoID,
    usuarioConsulta: APP.usuarioStaff.Email
  };
  var tabla = document.getElementById('tablaHistorial');
  tabla.innerHTML = '<div class="flex justify-center py-6"><div class="spinner"></div></div>';
  // Asegura productos cargados para la resolucion de nombre proxima vez.
  if (!APP.productosGestion) {
    llamarAPI('obtenerProductosGestion', [], { loader: false }).then(function (p) { APP.productosGestion = p; });
  }
  llamarAPI('buscarHistorialPedidos', [filtros], { loader: false }).then(function (resultados) {
    if (!resultados.length) { tabla.innerHTML = '<p class="text-sm opacity-60 py-4 text-center">Sin resultados.</p>'; return; }
    tabla.innerHTML = '<table class="tabla"><thead><tr><th>Fecha</th><th>Hab</th><th>Servicio</th><th>Productos</th><th>Total</th><th>Estado</th></tr></thead><tbody>' +
      resultados.map(function (r) {
        return '<tr><td>' + r.Fecha + '</td><td>' + r.Habitacion + '</td><td>' + escaparHTML(r.ServicioNombre) + '</td>' +
          '<td class="text-xs">' + escaparHTML(r.Resumen) + '</td><td>' + fmtMoneda(r.Total) + '</td>' +
          '<td><span class="pill estado-Finalizada">' + escaparHTML(r.Estado) + '</span></td></tr>';
      }).join('') + '</tbody></table>';
  }).catch(function () {
    tabla.innerHTML = htmlError('No pudimos completar la busqueda.', 'buscarHistorial()');
  });
}

function cargarTablaBloqueos() {
  var tabla = document.getElementById('tablaBloqueos');
  var hoy = hoyISO();
  var enUnAno = (new Date().getFullYear() + 1) + '-12-31';
  llamarAPI('obtenerBloqueos', [hoy, enUnAno, ''], { loader: false }).then(function (bloqueos) {
    if (!bloqueos.length) { tabla.innerHTML = '<p class="text-sm opacity-60 py-4 text-center">Sin bloqueos vigentes.</p>'; return; }
    var servNombre = {}; APP.servicios.forEach(function (s) { servNombre[s.ID] = s.Nombre; });
    tabla.innerHTML = '<table class="tabla"><thead><tr><th>Tipo</th><th>Servicio</th><th>Desde</th><th>Hasta</th><th>Horario</th><th>Motivo</th></tr></thead><tbody>' +
      bloqueos.map(function (b) {
        return '<tr><td>' + escaparHTML(b.Tipo) + '</td><td>' + escaparHTML(servNombre[b.ServicioID] || 'Todos') + '</td>' +
          '<td>' + b.FechaInicio + '</td><td>' + b.FechaFin + '</td>' +
          '<td>' + (b.HoraInicio || '—') + ' - ' + (b.HoraFin || '—') + '</td>' +
          '<td class="text-xs">' + escaparHTML(b.Motivo) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }).catch(function () {
    tabla.innerHTML = htmlError('No pudimos cargar los bloqueos.', 'cargarTablaBloqueos()');
  });
}

/* ---------- Enlaces de reserva por habitacion (?hab=NUMERO) ---------- */
function pintarPortal() {
  var p = APP.portal || { base: '', mensaje: '', habitaciones: [] };
  var habs = p.habitaciones || [];
  var opts = habs.map(function (n) { return '<option value="' + escaparHTML(n) + '">Habitacion ' + escaparHTML(n) + '</option>'; }).join('');

  var avisoBase = p.base
    ? '<p class="text-xs opacity-55 mt-1">Base detectada: <span class="mono">' + escaparHTML(p.base) + '</span></p>'
    : '<p class="text-xs mt-1" style="color:var(--rojo,#b23)">No se pudo detectar la URL sola. Pega abajo la URL del portal (la que termina en <b>/exec</b>).</p>';

  var contenido =
    '<p class="text-xs opacity-60 mb-3">Comparte con cada huesped el enlace directo de su habitacion. Al abrirlo, entra al portal ya identificado en esa habitacion (igual que el codigo QR).</p>' +
    // URL base (editable, se guarda en Configuracion). Si esta vacia se autodetecta.
    '<label class="lbl">URL del portal (opcional, se autodetecta)</label>' +
    '<input class="input mono" id="portalBase" value="' + escaparHTML(p.base || '') + '" placeholder="https://script.google.com/macros/s/.../exec" onchange="guardarPortalBase(this.value)">' +
    avisoBase +
    // Mensaje opcional
    '<label class="lbl mt-3">Mensaje opcional (se copia junto al enlace)</label>' +
    '<textarea class="input" id="portalMensaje" rows="3" onchange="guardarConfigValor(\'PORTAL_MENSAJE\', this.value)">' + escaparHTML(p.mensaje || '') + '</textarea>' +
    // Selector de habitacion + vista previa + botones de copiar
    '<label class="lbl mt-3">Habitacion</label>' +
    '<div class="flex gap-2 items-center flex-wrap">' +
      '<select class="input" id="portalHab" style="max-width:180px" onchange="actualizarPreviewEnlace()">' + opts + '</select>' +
    '</div>' +
    '<div class="card p-3 mt-3" style="background:var(--fondo,#f7f6f3)">' +
      '<p class="text-xs opacity-60 mb-1">Enlace de la habitacion seleccionada:</p>' +
      '<p class="mono text-sm break-all" id="portalPreview" style="word-break:break-all">-</p>' +
    '</div>' +
    '<div class="flex gap-2 mt-3 flex-wrap">' +
      '<button class="btn btn-dorado !py-2 !px-3 text-sm" onclick="copiarEnlaceHab(false)"><i class="fa-solid fa-link"></i> Copiar enlace</button>' +
      '<button class="btn btn-outline !py-2 !px-3 text-sm" onclick="copiarEnlaceHab(true)"><i class="fa-solid fa-comment-dots"></i> Copiar mensaje + enlace</button>' +
    '</div>';

  var card = tarjetaConfig('Enlaces de reserva por habitacion', 'fa-link', contenido);
  // Programa el preview inicial cuando el DOM ya exista.
  setTimeout(actualizarPreviewEnlace, 0);
  return card;
}

/* Devuelve la base actual (campo editable o la autodetectada). */
function _portalBaseActual() {
  var inp = document.getElementById('portalBase');
  var manual = inp ? inp.value.trim() : '';
  return manual || (APP.portal && APP.portal.base) || '';
}
/* Construye el enlace ?hab=NUMERO para una habitacion. */
function _enlaceHab(num) {
  var base = _portalBaseActual();
  if (!base) return '';
  return base + (base.indexOf('?') >= 0 ? '&' : '?') + 'hab=' + encodeURIComponent(num);
}
function actualizarPreviewEnlace() {
  var sel = document.getElementById('portalHab');
  var prev = document.getElementById('portalPreview');
  if (!sel || !prev) return;
  var url = _enlaceHab(sel.value);
  prev.textContent = url || '(define primero la URL del portal arriba)';
}
function guardarPortalBase(valor) {
  guardarConfigValor('PORTAL_BASE_URL', (valor || '').trim());
  if (APP.portal) APP.portal.base = (valor || '').trim();
  actualizarPreviewEnlace();
}
function copiarEnlaceHab(conMensaje) {
  var sel = document.getElementById('portalHab');
  if (!sel || !sel.value) { mostrarToast('Elige una habitacion', 'error'); return; }
  var url = _enlaceHab(sel.value);
  if (!url) { mostrarToast('Primero define la URL del portal (termina en /exec)', 'error'); return; }
  var texto = url;
  if (conMensaje) {
    var msgInp = document.getElementById('portalMensaje');
    var msg = msgInp ? msgInp.value.trim() : '';
    texto = (msg ? msg + '\n' : '') + url;
  }
  copiarTexto(texto);
}
/* Copia texto al portapapeles con respaldo para navegadores viejos. */
function copiarTexto(texto) {
  var ok = function () { mostrarToast('Copiado ✓', 'exito'); };
  var fallback = function () {
    try {
      var ta = document.createElement('textarea');
      ta.value = texto; ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var r = document.execCommand('copy'); document.body.removeChild(ta);
      if (r) ok(); else mostrarToast('No se pudo copiar automatico', 'error');
    } catch (e) { mostrarToast('No se pudo copiar automatico', 'error'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(ok, fallback);
  } else { fallback(); }
}

    '<div id="fsColores" class="flex flex-wrap gap-2 mb-2">' +
      PALETA_SERVICIOS.map(function (cl) {
        return '<button type="button" class="fs-color" data-cl="' + cl + '" onclick="seleccionarColorServicio(\'' + cl + '\')" ' +
          'style="width:30px;height:30px;border-radius:50%;background:' + cl + ';border:3px solid ' + (cl === APP.formColor ? 'var(--grafito)' : 'transparent') + ';box-shadow:0 1px 3px rgba(0,0,0,.3)"></button>';
      }).join('') +
    '</div>' +

    // Interruptores
    '<div class="grid grid-cols-2 gap-2 mt-3">' +
      switchLinea('Activo', 'fsActivo', s.Activo) +
      switchLinea('Requiere aprobacion', 'fsAprob', s.RequiereAprobacion) +
      switchLinea('Permite pedido (restaurant)', 'fsPedido', s.PermitePrepedido) +
      switchLinea('Uso exclusivo (1 a la vez)', 'fsExcl', s.UsoExclusivo) +
    '</div>' +

    // Variantes
    '<div class="mt-4"><div class="flex items-center justify-between mb-1"><label class="lbl !mb-0">Opciones / variantes (precio distinto)</label>' +
      '<button type="button" class="btn btn-outline !py-1 !px-2 text-xs" onclick="agregarVarianteForm()"><i class="fa-solid fa-plus"></i></button></div>' +
      '<p class="text-xs opacity-55 mb-2">Ej: masaje Relajacion / Descontracturante. Si no usas, dejalo vacio.</p>' +
      '<div id="fsVariantes"></div>' +
    '</div>';

  var botones = [{ texto: 'Cancelar', clase: 'btn-outline', accion: cerrarModal }];
  if (servicioID) {
    botones.push({ texto: 'Guardar', clase: 'btn-primary', accion: guardarFormServicio });
  } else {
    botones.push({ texto: 'Crear servicio', clase: 'btn-primary', accion: guardarFormServicio });
  }

  mostrarModal({ titulo: servicioID ? 'Editar servicio' : 'Nuevo servicio', contenidoHTML: form, botones: botones });
  pintarVariantesForm();
}

function switchLinea(etiqueta, id, activo) {
  return '<label class="flex items-center justify-between gap-2 text-sm py-1"><span>' + etiqueta + '</span>' +
    '<span class="switch"><input type="checkbox" id="' + id + '" ' + (activo ? 'checked' : '') + '><span class="slider"></span></span></label>';
}
function seleccionarIconoServicio(ic) {
  APP.formIcono = ic;
  document.querySelectorAll('#fsIconos .fs-icono').forEach(function (b) {
    var sel = b.getAttribute('data-ic') === ic;
    b.classList.toggle('btn-dorado', sel); b.classList.toggle('btn-outline', !sel);
  });
}
function seleccionarColorServicio(cl) {
  APP.formColor = cl;
  document.querySelectorAll('#fsColores .fs-color').forEach(function (b) {
    b.style.borderColor = b.getAttribute('data-cl') === cl ? 'var(--grafito)' : 'transparent';
  });
}
function agregarVarianteForm() {
  APP.formVariantes.push({ nombre: '', precio: 0 });
  pintarVariantesForm();
}
function quitarVarianteForm(i) {
  APP.formVariantes.splice(i, 1);
  pintarVariantesForm();
}
function pintarVariantesForm() {
  // Guarda lo escrito antes de repintar.
  leerVariantesForm();
  var cont = document.getElementById('fsVariantes');
  if (!cont) return;
  cont.innerHTML = APP.formVariantes.map(function (v, i) {
    return '<div class="flex gap-2 mb-2">' +
      '<input class="input flex-1 fs-var-nombre" placeholder="Nombre" value="' + escaparHTML(v.nombre) + '">' +
      '<input class="input !w-28 fs-var-precio" type="number" placeholder="Precio" value="' + (v.precio || 0) + '">' +
      '<button type="button" class="btn btn-peligro !px-3" onclick="quitarVarianteForm(' + i + ')"><i class="fa-solid fa-trash"></i></button>' +
    '</div>';
  }).join('');
}
function leerVariantesForm() {
  var cont = document.getElementById('fsVariantes');
  if (!cont) return;
  var nombres = cont.querySelectorAll('.fs-var-nombre');
  var precios = cont.querySelectorAll('.fs-var-precio');
  for (var i = 0; i < nombres.length; i++) {
    if (APP.formVariantes[i]) {
      APP.formVariantes[i].nombre = nombres[i].value;
      APP.formVariantes[i].precio = Number(precios[i].value) || 0;
    }
  }
}
function guardarFormServicio() {
  leerVariantesForm();
  var variantes = APP.formVariantes.filter(function (v) { return v.nombre && v.nombre.trim(); });
  var datos = {
    nombre: document.getElementById('fsNombre').value.trim(),
    nombreEN: document.getElementById('fsNombreEN').value.trim(),
    categoria: document.getElementById('fsCategoria').value,
    descripcion: document.getElementById('fsDescripcion').value,
    descripcionEN: document.getElementById('fsDescripcionEN').value,
    icono: APP.formIcono,
    costoBase: document.getElementById('fsPrecio').value,
    capacidad: document.getElementById('fsCapacidad').value,
    duracionMinutos: document.getElementById('fsDuracion').value,
    horarioInicio: document.getElementById('fsAbre').value.trim(),
    horarioFin: document.getElementById('fsCierra').value.trim(),
    requiereAprobacion: document.getElementById('fsAprob').checked,
    permitePrepedido: document.getElementById('fsPedido').checked,
    usoExclusivo: document.getElementById('fsExcl').checked,
    activo: document.getElementById('fsActivo').checked,
    color: APP.formColor,
    variantes: variantes
  };
  if (!datos.nombre) { mostrarToast('El nombre es obligatorio.', 'error'); return; }
  if (!/^\d{1,2}:\d{2}$/.test(datos.horarioInicio) || !/^\d{1,2}:\d{2}$/.test(datos.horarioFin)) {
    mostrarToast('Los horarios deben ser tipo 10:00.', 'error'); return;
  }

  var fn, args;
  if (APP.formServicioID) {
    datos.id = APP.formServicioID;
    fn = 'guardarServicioConfig'; args = [datos, APP.usuarioStaff.Email];
  } else {
    fn = 'guardarServicioNuevo'; args = [datos, APP.usuarioStaff.Email];
  }
  llamarAPI(fn, args).then(function (res) {
    mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
    if (res.success) {
      cerrarModal();
      // Refresca servicios en memoria (config y app) y repinta.
      APP.carta = null; // por si cambio algo de la carta asociada
      llamarAPI('obtenerServiciosGestion', [], { loader: false, silencioso: true }).then(function (serv) {
        APP.serviciosConfig = serv || [];
        APP.servicios = serv.filter(function (x) { return x.Activo; });
        pintarConfig();
      });
    }
  });
}

/* ---------- Bloques reutilizables de configuracion ---------- */
function tarjetaConfig(titulo, icono, contenido) {
  return '<div class="card p-5 mb-5">' +
    '<div class="flex items-center gap-2 mb-4"><i class="fa-solid ' + icono + '" style="color:var(--dorado)"></i>' +
    '<h3 class="text-xl">' + titulo + '</h3></div>' + contenido + '</div>';
}
function campoToggle(etiqueta, clave, activo, ayuda) {
  return '<div class="flex items-center justify-between gap-3 py-2 border-b" style="border-color:var(--borde)">' +
    '<div><p class="text-sm font-medium">' + etiqueta + '</p>' + (ayuda ? '<p class="text-xs opacity-55">' + ayuda + '</p>' : '') + '</div>' +
    '<label class="switch"><input type="checkbox" ' + (activo ? 'checked' : '') + ' onchange="guardarConfigBool(\'' + clave + '\', this.checked)"><span class="slider"></span></label></div>';
}
function campoTexto(etiqueta, clave, valor) {
  return '<div class="py-2"><label class="lbl">' + etiqueta + '</label>' +
    '<input class="input" value="' + escaparHTML(valor || '') + '" onchange="guardarConfigValor(\'' + clave + '\', this.value)"></div>';
}
function campoNumero(etiqueta, clave, valor, ayuda) {
  return '<div class="py-2"><label class="lbl">' + etiqueta + '</label>' +
    '<input type="number" class="input" value="' + (valor || 0) + '" onchange="guardarConfigValor(\'' + clave + '\', this.value)">' +
    (ayuda ? '<p class="text-xs opacity-55 mt-1">' + ayuda + '</p>' : '') + '</div>';
}
function campoMoneda(etiqueta, clave, valor, ayuda) {
  var simbolo = APP.config.MONEDA_SIMBOLO || '$';
  return '<div class="py-2"><label class="lbl">' + etiqueta + '</label>' +
    '<div class="flex items-center gap-2"><span class="opacity-60">' + simbolo + '</span>' +
    '<input type="number" class="input" value="' + (valor || 0) + '" onchange="guardarConfigValor(\'' + clave + '\', this.value)"></div>' +
    (ayuda ? '<p class="text-xs opacity-55 mt-1">' + ayuda + '</p>' : '') + '</div>';
}
function campoTextarea(etiqueta, clave, valor) {
  return '<div class="py-2"><label class="lbl">' + etiqueta + '</label>' +
    '<textarea class="input" rows="3" onchange="guardarConfigValor(\'' + clave + '\', this.value)">' + escaparHTML(valor || '') + '</textarea></div>';
}
function campoOpciones(etiqueta, clave, valorActual, opciones, ayuda) {
  var opts = opciones.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === valorActual ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('');
  return '<div class="py-2"><label class="lbl">' + etiqueta + '</label>' +
    '<select class="input" onchange="guardarConfigValor(\'' + clave + '\', this.value)">' + opts + '</select>' +
    (ayuda ? '<p class="text-xs opacity-55 mt-1">' + ayuda + '</p>' : '') + '</div>';
}

/* ---------- Guardado de configuracion ---------- */
function guardarConfigValor(clave, valor) {
  llamarAPI('actualizarConfiguracion', [clave, valor, APP.usuarioStaff.Email], { loader: false }).then(function (res) {
    if (res.success) { APP.config[clave] = valor; mostrarToast('Guardado ✓', 'exito'); }
    else mostrarToast(res.mensaje, 'error');
  });
}
function guardarConfigBool(clave, activo) {
  guardarConfigValor(clave, activo ? 'TRUE' : 'FALSE');
}
</script>
</body>
</html>
