<!-- ============================================================================
     CASCADAS CONCIERGE — ACTO 2: FRONTEND (Index.html)
     Archivo unico autocontenido: CSS + HTML + JS inline.
     Se sirve desde Code.gs (doGet). La variable HABITACION_QR se inyecta por
     el motor de plantillas de Apps Script.
     ============================================================================ -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cascadas Concierge</title>

  <!-- TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome v6 via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Flatpickr via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
  <!-- Google Fonts: Bebas Neue (titulos) + Oswald (interfaz) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- ===== CSS ===== -->
  <style>
    /* =======================================================================
       SISTEMA DE DISENO ESCUEOMORFICO — CASCADAS
       Paleta de marca: grafito #414143 · hueso #ECECEE · blanco.
       Los nombres de variables antiguos se conservan como alias para no
       tocar el JS: --verde-bosque ahora ES el grafito, --dorado es el laton
       de los herrajes, --arena es el gris calido claro.
       ======================================================================= */
    :root {
      --grafito: #414143;
      --grafito-claro: #5A5A5D;
      --grafito-oscuro: #2E2E30;
      --hueso: #ECECEE;

      /* Alias heredados (el JS los referencia) */
      --antracita: #2E2E30;
      --arena: #D8D8DA;
      --blanco: #FFFFFF;
      --verde-bosque: #414143;
      --dorado: #66666A;          /* acento gris acero (antes laton) */
      --fondo: #ECECEE;
      --texto: #3A3A3C;
      --borde: #CECECF;
      --exito: #4E6B54;
      --alerta: #66666A;
      --peligro: #8B3A3A;
    }

    /* Modo oscuro: grafito profundo, mismas reglas de relieve */
    .dark-mode {
      --fondo: #2A2A2C;
      --texto: #ECECEE;
      --blanco: #3C3C3E;
      --borde: #232325;
      --arena: #4A4A4D;
    }

    * { box-sizing: border-box; }

    /* Fondo tipo lino: trama fina + vineta superior de luz */
    body {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      background-color: var(--fondo);
      background-image:
        radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.55), transparent 55%),
        repeating-linear-gradient(0deg, rgba(65,65,67,.025) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(65,65,67,.025) 0 1px, transparent 1px 4px);
      background-attachment: fixed;
      color: var(--texto);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    .dark-mode body, body.dark-mode {
      background-image:
        radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.07), transparent 55%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 4px);
    }

    /* Titulos: Bebas Neue con efecto letterpress (grabado en el material) */
    h1, h2, h3, .serif {
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      letter-spacing: .05em;
      font-weight: 400;
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    .dark-mode h1, .dark-mode h2, .dark-mode h3, .dark-mode .serif {
      text-shadow: 0 -1px 0 rgba(0,0,0,.6);
    }

    /* Animaciones (curvas con rebote sutil, como mecanismos reales) */
    .fade-in { animation: fadeIn .35s ease; }
    .slide-up { animation: slideUp .45s cubic-bezier(.22, 1, .36, 1); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Panel elevado: superficie LISA (sin degradado) con la sombra caracteristica */
    .card {
      background: #FFFFFF;
      border: 1px solid #D0D0D2;
      border-radius: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(0,0,0,.04),
        0 1px 2px rgba(0,0,0,.08),
        0 10px 24px -10px rgba(46,46,48,.28);
      transition: box-shadow .3s ease, transform .3s ease;
    }
    .card:hover { box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(0,0,0,.04),
        0 2px 4px rgba(0,0,0,.10),
        0 16px 32px -12px rgba(46,46,48,.35); }
    .dark-mode .card {
      background: #3C3C3E;
      border-color: #232325;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.07),
        inset 0 -1px 0 rgba(0,0,0,.3),
        0 1px 2px rgba(0,0,0,.4),
        0 12px 26px -10px rgba(0,0,0,.6);
    }

    /* Placa oscura (bienvenida): metal cepillado grafito */
    .panel-oscuro {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
        linear-gradient(160deg, #525255, #414143 55%, #353537) !important;
      border: 1px solid #2A2A2C !important;
      color: var(--hueso);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -2px 6px rgba(0,0,0,.35),
        0 12px 28px -10px rgba(46,46,48,.55) !important;
    }
    .panel-oscuro h1, .panel-oscuro h2, .panel-oscuro h3 { text-shadow: 0 -1px 0 rgba(0,0,0,.55); }

    /* Cabecera clara (huesped): placa translucida con arista */
    .header-claro {
      background: rgba(251,250,249,.92);
      border-bottom: 1px solid #CECECF;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }
    .dark-mode .header-claro { background: rgba(48,48,50,.92); border-bottom-color: #232325; }

    /* Cabecera del staff: metal cepillado con arista inferior */
    .header-metal {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #4C4C4F, #414143 60%, #38383A);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 10px rgba(0,0,0,.35);
      border-bottom: 1px solid #2A2A2C;
    }

    /* Tarjetas-boton de servicio: teclas grandes que se presionan.
       Entran escalonadas, como piezas que se asientan una a una. */
    .tarjeta-servicio:nth-child(2) { animation-delay: .05s; }
    .tarjeta-servicio:nth-child(3) { animation-delay: .10s; }
    .tarjeta-servicio:nth-child(4) { animation-delay: .15s; }
    .tarjeta-servicio:nth-child(5) { animation-delay: .20s; }
    .tarjeta-servicio:nth-child(6) { animation-delay: .25s; }
    .tarjeta-servicio:nth-child(7) { animation-delay: .30s; }
    .tarjeta-servicio:nth-child(8) { animation-delay: .35s; }
    .tarjeta-servicio {
      cursor: pointer;
      animation: slideUp .5s cubic-bezier(.22,1,.36,1) backwards;
      background: #FFFFFF;
      border: 1px solid #CBCBCD;
      border-radius: 14px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 3px 0 #C2C2C4,
        0 8px 16px -6px rgba(46,46,48,.30);
      transition: transform .12s ease, box-shadow .15s ease;
    }
    .tarjeta-servicio:hover { transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 5px 0 #C2C2C4, 0 14px 24px -8px rgba(46,46,48,.38); }
    .tarjeta-servicio:active { transform: translateY(2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 #C2C2C4, inset 0 2px 6px rgba(0,0,0,.10); }
    .tarjeta-servicio.activa {
      background: #E4E4E6;
      box-shadow: inset 0 3px 8px rgba(0,0,0,.16), inset 0 0 0 2px var(--grafito), 0 1px 0 rgba(255,255,255,.7);
      transform: translateY(1px);
    }
    .dark-mode .tarjeta-servicio {
      background: #404043;
      border-color: #232325;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 0 #1F1F21, 0 8px 16px -6px rgba(0,0,0,.5);
    }
    .dark-mode .tarjeta-servicio.activa {
      background: #313133;
      box-shadow: inset 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 2px var(--hueso);
    }

    /* Medallon metalico del servicio (moneda grabada) */
    .icono-servicio {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; margin-bottom: .6rem;
      background: radial-gradient(circle at 32% 26%, #6B6B6F, #414143 62%, #313133);
      color: var(--hueso);
      box-shadow:
        0 2px 5px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.28),
        inset 0 -2px 4px rgba(0,0,0,.4);
      text-shadow: 0 -1px 0 rgba(0,0,0,.5);
    }

    /* -------------------- BOTONES FISICOS -------------------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      padding: .7rem 1.25rem; border-radius: 10px; cursor: pointer;
      font-family: 'Oswald', sans-serif; font-weight: 500; font-size: .88rem;
      text-transform: uppercase; letter-spacing: .07em;
      min-height: 44px; border: 1px solid transparent;
      transition: transform .08s ease, box-shadow .12s ease, filter .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* Tecla grafito (accion principal) */
    .btn-primary {
      background: linear-gradient(180deg, #57575A, #414143 50%, #39393B);
      color: #F2F2F3; border-color: #2A2A2C;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 #242426, 0 6px 12px -4px rgba(0,0,0,.4);
      text-shadow: 0 -1px 0 rgba(0,0,0,.4);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:active { transform: translateY(3px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.4), 0 0 0 #242426; }
    /* Tecla clara (accion secundaria) */
    .btn-outline {
      background: linear-gradient(180deg, #FFFFFF, #E7E7E9);
      color: var(--grafito); border-color: #BDBDBF;
      box-shadow: inset 0 1px 0 #fff, 0 2px 0 #B7B7B9, 0 5px 10px -4px rgba(46,46,48,.25);
    }
    .btn-outline:hover { filter: brightness(1.03); }
    .btn-outline:active { transform: translateY(2px);
      box-shadow: inset 0 2px 5px rgba(0,0,0,.12), 0 0 0 #B7B7B9; }
    .dark-mode .btn-outline {
      background: linear-gradient(180deg, #4C4C4F, #3E3E40);
      color: var(--hueso); border-color: #232325;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 2px 0 #1E1E20, 0 5px 10px -4px rgba(0,0,0,.5);
    }
    /* Tecla de acero (enfasis/seleccion) */
    .btn-dorado {
      background: linear-gradient(180deg, #7C7C80, #66666A 55%, #545458);
      color: #F2F2F3; border-color: #3E3E40;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 #3A3A3C, 0 6px 12px -4px rgba(0,0,0,.35);
      text-shadow: 0 -1px 0 rgba(0,0,0,.35);
    }
    .btn-dorado:hover { filter: brightness(1.06); }
    .btn-dorado:active { transform: translateY(3px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.3), 0 0 0 #3A3A3C; }
    /* Tecla peligro (ladrillo apagado) */
    .btn-peligro {
      background: linear-gradient(180deg, #A05252, #8B3A3A 55%, #7A3232);
      color: #F5EBEA; border-color: #612B2B;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 0 #572626, 0 6px 12px -4px rgba(0,0,0,.35);
      text-shadow: 0 -1px 0 rgba(0,0,0,.35);
    }
    .btn-peligro:active { transform: translateY(3px);
      box-shadow: inset 0 2px 6px rgba(0,0,0,.4), 0 0 0 #572626; }
    .btn:disabled {
      opacity: .45; cursor: not-allowed; transform: none !important;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.12) !important; filter: grayscale(.4);
    }

    /* -------------------- ETIQUETAS / ESTADOS -------------------- */
    /* Placa cosida: gradiente + borde + luz superior */
    .pill {
      display: inline-block; padding: .22rem .6rem; border-radius: 6px;
      font-size: .66rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
      border: 1px solid; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.10);
    }
    .estado-Solicitada { background: linear-gradient(180deg,#F4E9CF,#E9D8AC); color: #77591F; border-color: #C7B183; }
    .estado-Confirmada { background: linear-gradient(180deg,#E0E9DD,#C8D7C3); color: #3C5A40; border-color: #9CB497; }
    .estado-Pendiente  { background: linear-gradient(180deg,#E5E5E7,#D6D6D8); color: #6B655C; border-color: #BBBBBD; }
    .estado-Encurso    { background: linear-gradient(180deg,#DDE5EB,#C5D2DC); color: #3B5367; border-color: #99ADBD; }
    .estado-Finalizada { background: linear-gradient(180deg,#E5E3E1,#D2D0CE); color: #55534F; border-color: #B6B6B8; }
    .estado-Cancelada  { background: linear-gradient(180deg,#ECDAD7,#DCC1BD); color: #793A33; border-color: #BF9993; }
    .estado-Bloqueada  { background: linear-gradient(180deg,#E3DEE8,#CEC6D7); color: #544868; border-color: #A89CBA; }

    /* Etiqueta de producto (Vegano, Sin Gluten...): grabada en la placa */
    .pill-etiqueta {
      background: linear-gradient(180deg, #E6E6E8, #D8D8DA);
      color: #6A6A6D; border-color: #C0C0C2;
    }

    /* Cajas informativas hundidas en el panel */
    .caja-info {
      background: linear-gradient(180deg, #E2E2E4, #E7E7E9);
      border: 1px solid #C9C9CB; border-radius: 10px; color: #5C5A56;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.09), 0 1px 0 rgba(255,255,255,.8);
    }
    .caja-error {
      background: linear-gradient(180deg, #E6D6D3, #EDDCD9);
      border: 1px solid #C7A19B; border-radius: 10px; color: #7A3B33;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.09), 0 1px 0 rgba(255,255,255,.7);
      padding: .5rem .75rem;
    }
    .dark-mode .caja-info { background: linear-gradient(180deg,#333335,#3A3A3C); border-color: #232325; color: #CECECF;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.35); }

    /* -------------------- MODAL -------------------- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(38,38,40,.55);
      backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem; animation: fadeIn .2s ease;
    }
    .modal-box {
      background: #FFFFFF;
      color: var(--texto); border-radius: 16px; border: 1px solid #C9C9CB;
      max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto;
      animation: pop .35s cubic-bezier(.34, 1.4, .64, 1);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 30px 70px -10px rgba(0,0,0,.5),
        0 4px 12px rgba(0,0,0,.25);
    }
    .dark-mode .modal-box {
      background: #3C3C3E;
      border-color: #232325;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 30px 70px -10px rgba(0,0,0,.7);
    }

    /* -------------------- INTERRUPTOR FISICO -------------------- */
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; border-radius: 999px;
      background: linear-gradient(180deg, #CECECF, #DBDBDD);
      border: 1px solid #B2B2B4;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.28);
      transition: background .25s ease, box-shadow .25s ease;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 2px; top: 2px;
      background: radial-gradient(circle at 35% 30%, #FFFFFF, #DBDBDD 70%);
      border: 1px solid #B9B9BB;
      border-radius: 50%;
      box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.9);
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .switch input:checked + .slider {
      background: linear-gradient(180deg, #3A3A3C, #4A4A4D);
      border-color: #29292B;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.5);
    }
    .switch input:checked + .slider:before { transform: translateX(22px); }

    /* -------------------- SPINNER (dial metalico) -------------------- */
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #D0D0D2;
      border-top-color: var(--dorado);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
      animation: spin .9s linear infinite;
    }

    /* -------------------- CAMPOS HUNDIDOS -------------------- */
    .input {
      /* min-width:0 evita que un input de texto (por su contenido/placeholder)
         "empuje" su columna de grid mas alla del ancho asignado (bug clasico
         de Safari/iOS: el ancho minimo intrinseco del input gana a width:100%). */
      width: 100%; min-width: 0; padding: .65rem .9rem; border-radius: 10px;
      font-family: 'Oswald', sans-serif; font-weight: 300; font-size: .95rem;
      background: linear-gradient(180deg, #EDEDEF, #F6F6F7 30%);
      border: 1px solid #C3C3C5; border-top-color: #ADADAF;
      color: var(--texto); min-height: 44px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.10), 0 1px 0 rgba(255,255,255,.85);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .input:focus {
      outline: none; border-color: var(--grafito);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.10), 0 0 0 3px rgba(65,65,67,.14);
    }
    .dark-mode .input {
      background: linear-gradient(180deg, #2E2E30, #343436 30%);
      border-color: #1E1E20; color: var(--hueso);
      box-shadow: inset 0 2px 5px rgba(0,0,0,.4);
    }
    label.lbl {
      font-size: .72rem; font-weight: 500; margin-bottom: .3rem; display: block;
      text-transform: uppercase; letter-spacing: .08em; color: #6C6C6F;
    }
    .dark-mode label.lbl { color: #ADADAF; }

    /* -------------------- NAVEGACION STAFF (sobre metal) -------------------- */
    .nav-item {
      cursor: pointer; padding: .55rem .9rem; border-radius: 8px; transition: .2s;
      font-weight: 400; text-transform: uppercase; letter-spacing: .05em; font-size: .8rem;
      white-space: nowrap;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); }
    .nav-item.activo {
      background: rgba(0,0,0,.30); color: #fff;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.07);
    }

    /* Acordeon carta */
    .acordeon-header { cursor: pointer; user-select: none; }
    .acordeon-header:active { background: rgba(0,0,0,.03); }
    .acordeon-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.22,1,.36,1); }
    .acordeon-body.abierto { max-height: 4000px; }

    /* Tabla */
    table.tabla { width: 100%; border-collapse: collapse; }
    table.tabla th {
      text-align: left; font-size: .7rem; text-transform: uppercase; font-weight: 500;
      letter-spacing: .08em; color: #88888B; padding: .6rem .5rem;
      border-bottom: 2px solid #C9C9CB;
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    table.tabla td { padding: .7rem .5rem; border-bottom: 1px solid #D9D9DB; font-size: .9rem; }
    table.tabla tbody tr { transition: background .15s ease; }
    table.tabla tbody tr:hover { background: rgba(65,65,67,.04); }
    .dark-mode table.tabla th { color: #ADADAF; border-bottom-color: #232325; text-shadow: none; }
    .dark-mode table.tabla td { border-bottom-color: #48484A; }
    .dark-mode table.tabla tbody tr:hover { background: rgba(255,255,255,.04); }

    .oculto { display: none !important; }

    /* -------------------- LOGO DEL HOTEL -------------------- */
    .logo-img { display: inline-block; object-fit: contain; max-width: 100%; }
    /* Respaldo plano, sin efecto grabado (letterpress) que se veia como contorno. */
    .logo-fallback { letter-spacing: .06em; text-shadow: none !important; }

    /* -------------------- BANDEJA INFERIOR (huesped) -------------------- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, #F6F6F7, #E7E7E9);
      border-top: 1px solid #C9C9CB;
      box-shadow: 0 -4px 14px rgba(0,0,0,.12), inset 0 1px 0 #fff;
      display: flex; justify-content: space-around;
      padding: .45rem 0 calc(.45rem + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .bottom-nav .nav-btn {
      display: flex; flex-direction: column; align-items: center;

/* ==========================================================================
   ESTADO GLOBAL DE LA APP
   ========================================================================== */
var APP = {
  habitacion: '<?= HABITACION_QR ?>'.trim(),   // inyectada por Apps Script
  idioma: (function () { try { return localStorage.getItem('cascadas_idioma') || 'es'; } catch (e) { return 'es'; } })(),
  modo: null,             // 'huesped' | 'staff'
  usuarioStaff: null,     // {Email, Rol, Nombre}
  config: {},             // configuracion completa
  servicios: [],          // servicios activos
  categorias: [],         // categorias visibles
  categoriasTodas: [],    // todas las categorias (gestion staff)
  carta: null,            // carta completa en memoria {categorias, productosPorCategoria}
  misReservas: [],        // reservas del huesped en memoria
  fechaOps: null,         // fecha visible en el centro de operaciones
  carrito: [],            // prepedido en construccion
  reservaPrepedido: null, // reserva sobre la que se hace prepedido
  cuentaRegresiva: null   // intervalo de la cuenta regresiva
};

/* ==========================================================================
   WRAPPER DE API (google.script.run)
   ========================================================================== */
/**
 * Llama a una funcion del backend devolviendo una promesa.
 * Muestra loader global opcional y maneja errores con modal elegante.
 */
function llamarAPI(nombreFuncion, parametros, opciones) {
  opciones = opciones || {};
  return new Promise(function (resolve, reject) {
    if (opciones.loader !== false) mostrarLoaderGlobal(true);
    google.script.run
      .withSuccessHandler(function (resultado) {
        mostrarLoaderGlobal(false);
        resolve(resultado);
      })
      .withFailureHandler(function (error) {
        mostrarLoaderGlobal(false);
        // Con silencioso:true no se muestra modal; el llamador decide que hacer.
        if (!opciones.silencioso) {
          mostrarModal({
            titulo: t('ocurrio_problema'),
            contenidoHTML: '<p class="text-sm">' + (error && error.message ? error.message : t('error_inesperado')) + '</p>',
            botones: [{ texto: t('entendido'), clase: 'btn-primary', accion: cerrarModal }]
          });
        }
        reject(error);
      })[nombreFuncion].apply(null, parametros || []);
  });
}

/* Loader global (overlay ligero) */
function mostrarLoaderGlobal(mostrar) {
  var existente = document.getElementById('loaderGlobal');
  if (mostrar) {
    if (existente) return;
    var div = document.createElement('div');
    div.id = 'loaderGlobal';
    div.className = 'fixed inset-0 flex items-center justify-center z-[1400]';
    div.style.background = 'rgba(0,0,0,.12)';
    div.innerHTML = '<div class="spinner"></div>';
    document.body.appendChild(div);
  } else if (existente) {
    existente.remove();
  }
}

/* ==========================================================================
   SISTEMA DE MODALES
   ========================================================================== */
function mostrarModal(config) {
  var cerrable = config.cerrable !== false;
  var botonesHTML = (config.botones || []).map(function (b, i) {
    return '<button class="btn ' + (b.clase || 'btn-outline') + '" data-modal-btn="' + i + '">' + b.texto + '</button>';
  }).join('');

  var html =
    '<div class="modal-overlay" id="modalOverlay">' +
      '<div class="modal-box">' +
        '<div class="flex items-center justify-between p-5 border-b" style="border-color: var(--borde)">' +
          '<h3 class="text-xl">' + (config.titulo || '') + '</h3>' +
          (cerrable ? '<button onclick="cerrarModal()" class="text-2xl opacity-50 hover:opacity-100">&times;</button>' : '') +
        '</div>' +
        '<div class="p-5">' + (config.contenidoHTML || '') + '</div>' +
        (botonesHTML ? '<div class="flex flex-wrap gap-2 justify-end p-5 border-t" style="border-color: var(--borde)">' + botonesHTML + '</div>' : '') +
      '</div>' +
    '</div>';

  document.getElementById('contenedorModal').innerHTML = html;

  // Enlaza acciones de botones.
  (config.botones || []).forEach(function (b, i) {
    var el = document.querySelector('[data-modal-btn="' + i + '"]');
    if (el) el.onclick = function () { if (b.accion) b.accion(); };
  });

  // Cerrar al hacer click en el backdrop.
  if (cerrable) {
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'modalOverlay') cerrarModal();
    });
  }
}

function cerrarModal() {
  document.getElementById('contenedorModal').innerHTML = '';
  if (APP.cuentaRegresiva) { clearInterval(APP.cuentaRegresiva); APP.cuentaRegresiva = null; }
}

/* HTML de error para reemplazar spinners cuando una llamada falla. */
function htmlError(mensaje, codigoReintento) {
  return '<div class="card p-6 text-center fade-in">' +
    '<i class="fa-solid fa-triangle-exclamation text-2xl mb-2" style="color: var(--dorado)"></i>' +
    '<p class="text-sm opacity-70 mb-3">' + mensaje + '</p>' +
    (codigoReintento ? '<button class="btn btn-outline" onclick="' + codigoReintento + '"><i class="fa-solid fa-rotate-right"></i> Reintentar</button>' : '') +
  '</div>';
}

/* Toast de notificacion breve */
function mostrarToast(mensaje, tipo) {
  var color = tipo === 'error' ? 'var(--peligro)' : (tipo === 'exito' ? 'var(--verde-bosque)' : 'var(--antracita)');
  var div = document.createElement('div');
  div.className = 'card px-4 py-3 slide-up text-sm shadow-lg';
  div.style.borderLeft = '4px solid ' + color;
  div.innerHTML = mensaje;
  document.getElementById('contenedorToast').appendChild(div);
  setTimeout(function () { div.remove(); }, 3500);
}

/* Pop-up de aviso que PERMANECE hasta que se cierra (para nuevas reservas). */
function mostrarPopupNotif(mensaje) {
  var div = document.createElement('div');
  div.className = 'card slide-up shadow-lg';
  div.style.borderLeft = '4px solid var(--dorado)';
  div.style.maxWidth = '340px';
  div.innerHTML =
    '<div class="flex items-start gap-3 p-4">' +
      '<i class="fa-solid fa-bell mt-1" style="color: var(--dorado)"></i>' +
      '<div class="flex-1 text-sm">' + mensaje + '</div>' +
      '<button class="text-lg leading-none opacity-50 hover:opacity-100" onclick="this.closest(\'.card\').remove()">&times;</button>' +
    '</div>';
  document.getElementById('contenedorToast').appendChild(div);
  // Respaldo: si nadie lo cierra, se va solo tras 30s para no acumular.
  setTimeout(function () { if (div.parentElement) div.remove(); }, 30000);
}

function fmtMoneda(valor) {
  var simbolo = APP.config.MONEDA_SIMBOLO || '$';
  var n = Number(valor) || 0;
  return simbolo + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function claseEstado(estado) {
  if (!estado) return 'estado-Solicitada';
  if (estado.indexOf('Cancelada') === 0) return 'estado-Cancelada';
  if (estado.indexOf('Pendiente') === 0) return 'estado-Pendiente';
  if (estado === 'En curso') return 'estado-Encurso';
  return 'estado-' + estado.replace(/\s/g, '');
}

function escaparHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* Traduce una clave; admite variables {x} para interpolar. */
function t(clave, vars) {
  var dic = I18N[APP.idioma] || I18N.es;
  var s = (dic && dic[clave] != null) ? dic[clave] : (I18N.es[clave] != null ? I18N.es[clave] : clave);
  if (vars) Object.keys(vars).forEach(function (k) {
    // Reemplazo con funcion para no interpretar '$' de los valores.
    s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), function () { return String(vars[k]); });
  });
  return s;
}

/* Traduce el estado de una reserva (los estados viven en espanol en la BD). */
function estadoLabel(estado) {
  if (APP.idioma !== 'en' || !estado) return estado;
  var map = {
    'Solicitada': 'Requested', 'Pendiente aprobacion': 'Pending approval',
    'Pendiente aprobación': 'Pending approval', 'Confirmada': 'Confirmed',
    'En curso': 'In progress', 'Finalizada': 'Completed',
    'Cancelada huesped': 'Cancelled by guest', 'Cancelada hotel': 'Cancelled by hotel',
    'No asistio': 'No show', 'Rechazada': 'Rejected', 'Registrado': 'Registered'
  };
  return map[estado] || estado;
}

/* Nombre de un objeto (servicio/producto/categoria) segun el idioma activo.
   Usa la version EN si existe; si no, cae al nombre original en espanol. */
function nombreDe(o) {
  if (!o) return '';
  if (APP.idioma === 'en' && o.NombreEN) return o.NombreEN;
  return o.Nombre || '';
}

/* Descripcion segun idioma (EN si existe, si no la original). */
function descDe(o) {
  if (!o) return '';
  if (APP.idioma === 'en' && o.DescripcionEN) return o.DescripcionEN;
  return o.Descripcion || '';
}

/* Traduce una etiqueta de producto (Vegano, Sin Gluten, etc.). */
function etiquetaLabel(tag) {
  if (APP.idioma !== 'en') return tag;
  var map = {
    'Vegano': 'Vegan', 'Vegetariano': 'Vegetarian', 'Sin Gluten': 'Gluten-free',
    'Sin gluten': 'Gluten-free', 'Sin Lactosa': 'Lactose-free', 'Picante': 'Spicy',
    'Recomendado': 'Recommended', 'Nuevo': 'New', 'Menu del dia': 'Daily menu'
  };
  return map[tag] || tag;
}

/* Nombre de servicio de una reserva, buscando la version EN por ID. */
function nombreServicioReserva(r) {
  var s = (APP.servicios || []).filter(function (x) { return x.ID === r.ServicioID; })[0];
  if (s) return nombreDe(s);
  return r.ServicioNombre || '';
}

/* True si el restaurant esta aceptando pedidos anticipados (config). */
function prepedidoDisponible() {
  return String(APP.config.PREPEDIDO_ACTIVO || 'TRUE').toUpperCase() !== 'FALSE';
}

/* Recargo configurable del pedido a la habitacion. */
function recargoHabitacion() {
  return Number(APP.config.PEDIDO_HABITACION_RECARGO) || 0;
}

/* Aplica el idioma a todos los textos estaticos marcados con data-i18n. */
function aplicarIdioma() {
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
  });
  document.querySelectorAll('[data-idioma-label]').forEach(function (el) {
    el.textContent = (APP.idioma === 'en') ? 'ES' : 'EN';
  });
  document.documentElement.setAttribute('lang', APP.idioma);
}

/* Cambia el idioma, lo recuerda y refresca lo que el huesped este viendo. */
function cambiarIdioma(idioma) {
  APP.idioma = (idioma === 'en') ? 'en' : 'es';
  try { localStorage.setItem('cascadas_idioma', APP.idioma); } catch (e) {}
  aplicarIdioma();
  // Vuelve a pintar la seccion visible del huesped (contenido dinamico).
  if (APP.modo === 'huesped') {
    if (!document.getElementById('seccionMisReservas').classList.contains('oculto')) renderMisReservas();
    else renderReservar();
    // La carta tambien, si esta abierta y ya cargo.
    if (!document.getElementById('seccionCarta').classList.contains('oculto') && APP.carta) pintarCarta();
  }
}

/* Alterna entre espanol e ingles (boton de la cabecera del huesped). */
function alternarIdioma() {
  cambiarIdioma(APP.idioma === 'en' ? 'es' : 'en');
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
window.addEventListener('DOMContentLoaded', function () {
  // Extrae ?hab= del query string (respaldo si la plantilla no la inyecto).
  var params = new URLSearchParams(window.location.search);
  var habQuery = params.get('hab');
  if (!APP.habitacion && habQuery) APP.habitacion = habQuery.trim();

  // Si la habitacion ya se conoce (acceso por QR), pide el link de WhatsApp
  // EN PARALELO con la carga inicial (en vez de esperar a que termine y
  // recien ahi pedirlo): asi no se ve aparecer el boton un segundo despues.
  if (APP.habitacion) {
    APP.whatsappPromise = llamarAPI('obtenerWhatsappHabitacion', [APP.habitacion], { loader: false, silencioso: true }).catch(function () { return ''; });
  }

  // Carga TODO lo inicial en UNA sola llamada (config + servicios + categorias):
  // cada viaje al servidor cuesta ~1-2s, asi que agruparlos acelera el arranque.
  llamarAPI('obtenerDatosIniciales', [], { loader: false }).then(function (datos) {
    APP.config = datos.config || {};
    APP.servicios = datos.servicios || [];
    APP.categorias = datos.categorias || [];
    APP.categoriasTodas = datos.categoriasTodas || [];
    if ((APP.config.MODO_OSCURO_DEFAULT || '').toString().toUpperCase() === 'TRUE') {
      document.body.classList.add('dark-mode');
    }
    document.getElementById('cargaInicial').classList.add('oculto');
    aplicarIdioma();

    if (APP.habitacion) {
      // Guarda en sessionStorage y entra como huesped.
      sessionStorage.setItem('habitacion', APP.habitacion);
      iniciarHuesped();
    } else if (sessionStorage.getItem('staffEmail')) {
      // Reanuda sesion staff previa.
      reanudarStaff(sessionStorage.getItem('staffEmail'));
    } else {
      document.getElementById('vistaAcceso').classList.remove('oculto');
    }
  }).catch(function () {
    document.getElementById('cargaInicial').classList.add('oculto');
    document.getElementById('vistaAcceso').classList.remove('oculto');
  });
});

function mostrarAccesoHuesped() {
  document.getElementById('accesoHuesped').classList.remove('oculto');
  document.getElementById('accesoStaff').classList.add('oculto');
}
function mostrarAccesoStaff() {
  document.getElementById('accesoStaff').classList.remove('oculto');
  document.getElementById('accesoHuesped').classList.add('oculto');
}
function entrarComoHuesped() {
  var hab = (document.getElementById('inputHabManual').value || '').trim();
  if (!hab) { mostrarToast(t('ingresa_hab'), 'error'); return; }
  APP.habitacion = hab;
  sessionStorage.setItem('habitacion', hab);
  document.getElementById('vistaAcceso').classList.add('oculto');
  iniciarHuesped();
}
function entrarComoStaff() {
  var email = (document.getElementById('inputEmailStaff').value || '').trim();
  if (!email) { mostrarToast('Ingresa tu correo.', 'error'); return; }
  llamarAPI('autenticarStaff', [email]).then(function (res) {
    if (!res.success) { mostrarToast(res.mensaje, 'error'); return; }
    APP.usuarioStaff = res.usuario;
    sessionStorage.setItem('staffEmail', email);
    document.getElementById('vistaAcceso').classList.add('oculto');
    iniciarStaff();
  });
}
function reanudarStaff(email) {
  llamarAPI('autenticarStaff', [email], { loader: false, silencioso: true }).then(function (res) {
    if (res.success) { APP.usuarioStaff = res.usuario; iniciarStaff(); }
    else { document.getElementById('vistaAcceso').classList.remove('oculto'); }
  }).catch(function () {
    document.getElementById('vistaAcceso').classList.remove('oculto');
  });
}
function cerrarSesionStaff() {
  sessionStorage.removeItem('staffEmail');
  // Detiene los sondeos en segundo plano.
  if (APP.pollNotificaciones) { clearInterval(APP.pollNotificaciones); APP.pollNotificaciones = null; }
  // Reinicia estado y vuelve al selector de acceso SIN recargar (evita el blanco).
  APP.usuarioStaff = null;
  APP.modo = null;
  cerrarModal();
  document.getElementById('vistaStaff').classList.add('oculto');
  document.getElementById('vistaHuesped').classList.add('oculto');
  document.getElementById('accesoHuesped').classList.add('oculto');
  document.getElementById('accesoStaff').classList.add('oculto');
  var inputEmail = document.getElementById('inputEmailStaff');
  if (inputEmail) inputEmail.value = '';
  document.getElementById('vistaAcceso').classList.remove('oculto');
}

   ===================  VISTA HUESPED  ===================
   ========================================================================== */
function iniciarHuesped() {
  APP.modo = 'huesped';
  document.getElementById('vistaHuesped').classList.remove('oculto');
  document.getElementById('habLabel').textContent = APP.habitacion;
  document.getElementById('bienvenidaHab').textContent = APP.habitacion;
  document.getElementById('hotelNombreHeader').textContent = APP.config.HOTEL_NOMBRE || 'Cascadas';
  document.getElementById('bienvenidaHotel').textContent = APP.config.HOTEL_NOMBRE || 'Cascadas Hotel';
  aplicarIdioma();
  actualizarHora();
  setInterval(actualizarHora, 30000);

  // Los servicios y categorias ya llegaron con obtenerDatosIniciales.
  // Solo se piden de nuevo si por algun motivo no estan (respaldo).
  if (APP.servicios && APP.servicios.length) {
    renderReservar();
  } else {
    cargarServiciosHuesped();
  }

  // Sondeo para enterarse al instante si el hotel confirma/cancela/edita
  // una reserva del huesped mientras tiene la app abierta.
  iniciarPollHuesped();

  // Boton del grupo de WhatsApp de la habitacion (si tiene link configurado).
  // Si ya se pidio en paralelo al arrancar (acceso por QR), reusa esa promesa
  // en vez de partir de cero; si no (ingreso manual del numero), la pide ahora.
  var whatsappPromise = APP.whatsappPromise ||
    llamarAPI('obtenerWhatsappHabitacion', [APP.habitacion], { loader: false, silencioso: true });
  APP.whatsappPromise = null;
  whatsappPromise
    .then(function (link) {
      var box = document.getElementById('whatsappBox');
      if (box && link) { box.href = link; box.classList.remove('oculto'); }
      // Si esta habitacion no tiene WhatsApp, Instagram ocupa el ancho completo.
      var insta = document.getElementById('instagramBox');
      if (insta && !link) insta.classList.add('col-span-2');
    }).catch(function () {});
}

function iniciarPollHuesped() {
  // Foto inicial (sin avisar) para tener linea base.
  llamarAPI('obtenerReservas', [{ habitacion: APP.habitacion }], { loader: false, silencioso: true })
    .then(function (reservas) { actualizarSnapshotHuesped(filtrarReservasHuesped(reservas || [])); })
    .catch(function () {});
  if (!APP.pollHuesped) APP.pollHuesped = setInterval(pollHuesped, 20000);
}

function pollHuesped() {
  llamarAPI('obtenerReservas', [{ habitacion: APP.habitacion }], { loader: false, silencioso: true })
    .then(function (reservas) {
      var lista = filtrarReservasHuesped(reservas || []);
      var previo = APP.snapshotReservas || {};
      var huboCambio = false;

      lista.forEach(function (r) {
        var prev = previo[r.ID];
        if (!prev) return; // reserva nueva creada por el propio huesped: sin aviso
        if (_esEstadoCanceladoJS(r.Estado) && !_esEstadoCanceladoJS(prev.estado)) {
          mostrarPopupNotif(t('aviso_cancelada', { serv: escaparHTML(nombreServicioReserva(r)) }) +
            (r.MotivoCancelacion ? ': ' + escaparHTML(r.MotivoCancelacion) : '.'));
          huboCambio = true;
        } else if (r.Estado === 'Confirmada' && prev.estado !== 'Confirmada') {
          mostrarPopupNotif(t('aviso_confirmada', { serv: escaparHTML(nombreServicioReserva(r)) }));
          huboCambio = true;
        } else if ((r.Fecha !== prev.fecha || r.HoraInicio !== prev.hora) && !_esEstadoCanceladoJS(r.Estado)) {
          mostrarPopupNotif(t('aviso_modificada', { serv: escaparHTML(nombreServicioReserva(r)), fecha: r.Fecha, hora: r.HoraInicio }));
          huboCambio = true;
        }
      });

      APP.misReservas = lista;
      actualizarSnapshotHuesped(lista);
      // Si estoy viendo "Mis Reservas", refrescalo para reflejar el cambio.
      if (huboCambio && !document.getElementById('seccionMisReservas').classList.contains('oculto')) {
        document.getElementById('seccionMisReservas').innerHTML =
          '<h3 class="text-2xl mb-4" style="color: var(--verde-bosque)">' + t('mis_reservas') + '</h3>' +
          (lista.length ? lista.map(tarjetaReserva).join('') : '<div class="card p-8 text-center"><p class="text-sm opacity-60">' + t('aun_no_reservas') + '</p></div>');
      }
    }).catch(function () {});
}

/* Estado cancelado (lado cliente). */
function _esEstadoCanceladoJS(estado) {
  return estado === 'Cancelada huesped' || estado === 'Cancelada hotel';
}

/* Carga los servicios activos de forma aislada y refresca la vista Reservar. */
function cargarServiciosHuesped() {
  APP.errorServicios = null;
  llamarAPI('obtenerServiciosActivos', [], { loader: false }).then(function (servicios) {
    APP.servicios = servicios || [];
    renderReservar();
  }).catch(function (err) {
    // Guarda el error real para mostrarlo en pantalla y poder diagnosticar.
    APP.errorServicios = (err && err.message) ? err.message : 'Error desconocido';
    APP.servicios = [];
    renderReservar();
  });
}

function actualizarHora() {
  var ahora = new Date();
  var h = ahora.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  var el = document.getElementById('bienvenidaHora');
  if (el) el.textContent = h;
}

function navHuesped(seccion) {
  document.querySelectorAll('[data-huesped-nav]').forEach(function (el) {
    el.classList.toggle('activo', el.getAttribute('data-huesped-nav') === seccion);
  });
  document.getElementById('seccionReservar').classList.toggle('oculto', seccion !== 'Reservar');
  document.getElementById('seccionMisReservas').classList.toggle('oculto', seccion !== 'MisReservas');
  document.getElementById('huespedBienvenida').classList.toggle('oculto', seccion !== 'Reservar');
  document.getElementById('huespedContacto').classList.toggle('oculto', seccion !== 'Reservar');

  if (seccion === 'MisReservas') renderMisReservas();
}

/* Icono FontAwesome para cada servicio: usa el guardado en la hoja; si no,
   respaldo por ID conocido, luego por categoria. */
function iconoServicio(s) {
  if (s.Icono) return s.Icono;
  var porID = {
    S001: 'fa-bowl-food', S002: 'fa-mug-saucer', S003: 'fa-utensils',
    S004: 'fa-wine-glass', S005: 'fa-hot-tub-person', S006: 'fa-bicycle', S007: 'fa-spa'
  };
  if (porID[s.ID]) return porID[s.ID];
  if (s.Categoria === 'Gastronomia') return 'fa-utensils';
  if (s.Categoria === 'Bienestar') return 'fa-spa';
  if (s.Categoria === 'Actividad') return 'fa-person-hiking';
  return 'fa-calendar-check';
}

/* Paleta de iconos para el selector visual del formulario de servicios. */
var ICONOS_SERVICIO = [
  'fa-utensils','fa-bowl-food','fa-mug-saucer','fa-wine-glass','fa-martini-glass','fa-champagne-glasses',
  'fa-spa','fa-hot-tub-person','fa-hands','fa-dumbbell','fa-person-swimming','fa-bicycle',
  'fa-person-hiking','fa-mountain-sun','fa-fish','fa-horse','fa-car','fa-van-shuttle',
  'fa-golf-ball-tee','fa-table-tennis-paddle-ball','fa-music','fa-camera','fa-fire','fa-leaf',
  'fa-heart','fa-star','fa-gift','fa-bell-concierge','fa-key','fa-suitcase-rolling',
  'fa-bed','fa-shirt','fa-baby','fa-dog','fa-tree','fa-umbrella-beach'
];

function renderReservar() {
  APP.servicioActivoHuesped = null;
  APP.horaSeleccionada = null;

  // Estado si por algun motivo no cargaron los servicios.
  if (!APP.servicios || !APP.servicios.length) {
    var detalleError = APP.errorServicios
      ? '<p class="caja-error text-xs mt-3">' + t('detalle') + ' ' + escaparHTML(APP.errorServicios) + '</p>'
      : '<p class="text-xs opacity-40 mt-2">' + t('espera_reintenta') + '</p>';
    document.getElementById('seccionReservar').innerHTML =
      '<div class="card p-8 text-center fade-in">' +
        '<i class="fa-solid fa-triangle-exclamation text-3xl mb-3" style="color: var(--dorado)"></i>' +
        '<p class="text-sm opacity-70 mb-1">' + t('no_cargaron_servicios') + '</p>' +
        '<button class="btn btn-primary mt-3" onclick="recargarServiciosHuesped()"><i class="fa-solid fa-rotate-right"></i> ' + t('reintentar') + '</button>' +
        detalleError +
      '</div>';
    return;
  }

  // Tarjetas-boton por servicio.
  var tarjetas = APP.servicios.map(function (s) {
    // Badge sin posicion absoluta: va debajo del texto para no tapar el icono.
    var badge = s.RequiereAprobacion
      ? '<span class="pill estado-Pendiente mt-2 inline-block">' + t('requiere_aprobacion') + '</span>' : '';
    // Precio: si hay variantes, muestra "Desde <menor precio>".
    var precioMostrar = s.CostoBase;
    if (s.Variantes && s.Variantes.length) {
      precioMostrar = s.Variantes.reduce(function (min, v) { return Math.min(min, v.precio); }, Infinity);
    }
    var precio = precioMostrar > 0 ? '<p class="text-xs font-semibold mt-1" style="color: var(--dorado)">' + t('desde') + ' ' + fmtMoneda(precioMostrar) + '</p>' : '';
    return '<button class="tarjeta-servicio card p-5 text-left flex flex-col" data-serv="' + s.ID + '" onclick="seleccionarServicioHuesped(\'' + s.ID + '\')">' +
      '<div class="icono-servicio"><i class="fa-solid ' + iconoServicio(s) + '"></i></div>' +
      '<p class="font-semibold text-base leading-tight">' + escaparHTML(nombreDe(s)) + '</p>' +
      '<p class="text-xs opacity-60 mt-1 leading-snug">' + escaparHTML(descDe(s)) + '</p>' +
      precio + badge +
    '</button>';
  }).join('');

  var html =
    '<div class="fade-in">' +
      '<h3 class="text-2xl mb-1 px-1" style="color: var(--verde-bosque)">' + t('reservar_titulo') + '</h3>' +
      '<p class="text-sm opacity-60 mb-4 px-1">' + t('reservar_sub') + '</p>' +
      '<div class="grid grid-cols-2 gap-3">' + tarjetas + '</div>' +

      // Panel de reserva (aparece al elegir un servicio).

    '</div>';

  document.getElementById('seccionReservar').innerHTML = html;
}

/* Recarga servicios desde el backend (boton reintentar). */
function recargarServiciosHuesped() {

}

/* Al tocar una tarjeta de servicio: abre el panel con fecha/personas/horarios. */
function seleccionarServicioHuesped(servicioID) {
  var s = APP.servicios.filter(function (x) { return x.ID === servicioID; })[0];
  if (!s) return;
  APP.servicioActivoHuesped = s;
  APP.horaSeleccionada = null;

  // Resalta la tarjeta elegida.
  document.querySelectorAll('.tarjeta-servicio').forEach(function (t) {
    t.classList.toggle('activa', t.getAttribute('data-serv') === servicioID);
  });

  APP.varianteHuesped = '';

  // Caja informativa del Desayuno Habitacion (lee del propio servicio S002).
  var cajaDesayuno = '';
  if (s.ID === 'S002') {
    var costo = fmtMoneda(s.CostoBase || 0);
    cajaDesayuno = '<div class="caja-info mb-4 p-3 text-sm">' +
      '<p class="font-semibold mb-1"><i class="fa-solid fa-mug-saucer"></i> ' + t('desayuno_continental') + ' (' + costo + ')</p>' +
      '<p class="text-xs">' + escaparHTML(descDe(s)) + '</p></div>';
  }

  // Selector de variantes (ej. masaje relajacion/descontracturante).
  var cajaVariantes = '';
  if (s.Variantes && s.Variantes.length) {
    cajaVariantes = '<label class="lbl">' + t('elige_opcion') + '</label>' +
      '<div class="grid grid-cols-1 gap-2 mb-3">' +
        s.Variantes.map(function (v, i) {
          return '<button type="button" class="btn btn-outline justify-between !py-3 var-opcion" data-var="' + escaparHTML(v.nombre) + '" onclick="seleccionarVarianteHuesped(this, \'' + escaparHTML(v.nombre).replace(/'/g, "\\'") + '\')">' +
            '<span>' + escaparHTML(v.nombre) + '</span><span class="font-semibold">' + fmtMoneda(v.precio) + '</span></button>';
        }).join('') +
      '</div>';
  }

  // Personas: si el aforo es 1 (ej. masaje), es fijo en 1 y no se muestra.
  var cap = s.Capacidad || 1;
  var camposFechaPersonas;
  if (cap <= 1) {
    camposFechaPersonas =
      '<div class="mb-3"><label class="lbl">' + t('fecha') + '</label><input id="resFecha" class="input" placeholder="' + t('elige_fecha') + '"></div>' +
      '<input type="hidden" id="resPersonas" value="1">';
  } else {
    var porDefecto = Math.min(2, cap);
    // En movil se apilan (grid-cols-1); en pantallas anchas van lado a lado.
    camposFechaPersonas =
      '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">' +
        '<div><label class="lbl">' + t('fecha') + '</label><input id="resFecha" class="input" placeholder="' + t('elige_fecha') + '"></div>' +
        '<div><label class="lbl">' + t('personas') + '</label><input id="resPersonas" type="number" min="1" max="' + cap + '" value="' + porDefecto + '" class="input"></div>' +
      '</div>';
  }

  var panel = document.getElementById('panelReserva');
  panel.className = 'card p-5 sm:p-6 mt-4 slide-up';
  panel.innerHTML =
    '<div class="flex items-center gap-3 mb-4">' +
      '<div class="icono-servicio !mb-0 !w-11 !h-11 text-lg shrink-0"><i class="fa-solid ' + iconoServicio(s) + '"></i></div>' +
      '<div><p class="font-semibold text-lg leading-tight">' + escaparHTML(nombreDe(s)) + '</p>' +
      '<p class="text-xs opacity-60">' + t('rango_horario', { ini: s.HorarioInicio, fin: s.HorarioFin }) + '</p></div>' +
    '</div>' +
    cajaDesayuno +
    cajaVariantes +
    camposFechaPersonas +
    '<button class="btn btn-outline w-full mb-3" onclick="buscarHorarios()"><i class="fa-solid fa-clock"></i> ' + t('ver_horarios') + '</button>' +
    '<div id="resHorarios" class="grid grid-cols-3 gap-2 mb-3"></div>' +
    '<label class="lbl">' + t('notas_opcional') + '</label>' +
    '<textarea id="resNotas" class="input mb-4" rows="2" placeholder="' + t('notas_ph') + '"></textarea>' +
    '<button class="btn btn-primary w-full" id="btnConfirmarReserva" onclick="confirmarReserva()" disabled>' +
      '<i class="fa-solid fa-check"></i> ' + t('confirmar_reserva') + '</button>';

  // Flatpickr: los huespedes solo pueden reservar hasta N dias hacia adelante.
  var maxDias = Number(APP.config.MAX_DIAS_RESERVA_HUESPED);
  if (!maxDias && maxDias !== 0) maxDias = 3;
  var tope = new Date(); tope.setDate(tope.getDate() + maxDias);
  // disableMobile: obliga a usar el calendario propio de Flatpickr en iOS/Android.
  // Sin esto, el movil usa el selector nativo (input type=date), que no respeta
  // width:100% y se desborda de la tarjeta. altInput muestra la fecha en formato
  // amigable (d-m-Y) mientras el valor real que se envia sigue en Y-m-d.
  flatpickr('#resFecha', {
    locale: (APP.idioma === 'en' ? 'default' : 'es'),
    minDate: 'today', maxDate: tope, defaultDate: 'today',
    dateFormat: 'Y-m-d', altInput: true, altFormat: 'd-m-Y', disableMobile: true
  });

  // Lleva la vista al panel.
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* Selecciona una variante (huesped) y resalta el boton. */
function seleccionarVarianteHuesped(el, nombre) {
  document.querySelectorAll('.var-opcion').forEach(function (b) {
    b.classList.remove('btn-dorado'); b.classList.add('btn-outline');
  });
  el.classList.remove('btn-outline'); el.classList.add('btn-dorado');
  APP.varianteHuesped = nombre;
}

function buscarHorarios() {
  var s = APP.servicioActivoHuesped;
  if (!s) return;
  var fecha = document.getElementById('resFecha').value;
  var personas = document.getElementById('resPersonas').value;
  if (!fecha) { mostrarToast(t('selecciona_fecha'), 'error'); return; }

  var cont = document.getElementById('resHorarios');
  cont.innerHTML = '<div class="col-span-3 flex justify-center py-3"><div class="spinner"></div></div>';
  APP.horaSeleccionada = null;
  document.getElementById('btnConfirmarReserva').disabled = true;

  llamarAPI('consultarDisponibilidad', [s.ID, fecha, personas], { loader: false }).then(function (res) {
    if (!res.success || !res.bloques.length) {
      var esHoy = fecha === hoyISO();
      cont.innerHTML = '<p class="col-span-3 text-sm opacity-60 text-center py-3">' +
        (esHoy ? t('no_horarios_hoy') : t('no_horarios_fecha')) + '</p>';
      return;
    }
    cont.innerHTML = res.bloques.map(function (b) {
      return '<button class="btn btn-outline !py-2 text-sm" onclick="seleccionarHora(this,\'' + b.hora + '\')">' + b.hora + '</button>';
    }).join('');
  });
}

function seleccionarHora(el, hora) {
  document.querySelectorAll('#resHorarios button').forEach(function (b) {
    b.classList.remove('btn-dorado'); b.classList.add('btn-outline');
  });
  el.classList.remove('btn-outline'); el.classList.add('btn-dorado');
  APP.horaSeleccionada = hora;
  document.getElementById('btnConfirmarReserva').disabled = false;
}

function confirmarReserva() {
  var s = APP.servicioActivoHuesped;
  if (!s) return;
  if (s.Variantes && s.Variantes.length && !APP.varianteHuesped) {
    mostrarToast(t('elige_opcion_serv'), 'error'); return;
  }
  if (!APP.horaSeleccionada) { mostrarToast(t('elige_horario'), 'error'); return; }
  var datos = {
    habitacion: APP.habitacion,
    servicioID: s.ID,
    variante: APP.varianteHuesped || '',
    fecha: document.getElementById('resFecha').value,
    horaInicio: APP.horaSeleccionada,
    personas: document.getElementById('resPersonas').value,
    notas: document.getElementById('resNotas').value,
    solicitadoPor: 'Huesped Hab ' + APP.habitacion
  };
  llamarAPI('crearReserva', [datos]).then(function (res) {
    if (!res.success) { mostrarToast(res.mensaje, 'error'); return; }

    var encabezadoExito = '<div class="text-center"><i class="fa-solid fa-circle-check text-4xl mb-3" style="color: var(--verde-bosque)"></i>' +
      '<p class="text-sm">' + t('tu_reserva_estado', {
        serv: escaparHTML(nombreDe(s)),
        estado: '<span class="pill ' + claseEstado(res.estado) + '">' + estadoLabel(res.estado) + '</span>'
      }) + '</p>';

    if (s.PermitePrepedido && prepedidoDisponible()) {
      // Restaurant (almuerzo/cena): ofrece dejar el pedido listo de una vez.
      var reservaNueva = {
        ID: res.id, ServicioID: s.ID, ServicioNombre: s.Nombre, Estado: res.estado,
        Fecha: datos.fecha, HoraInicio: datos.horaInicio, Personas: datos.personas, PrepedidoID: ''
      };
      mostrarModal({
        titulo: t('reserva_registrada'),
        contenidoHTML: encabezadoExito +
          '<p class="text-sm mt-3 opacity-80">' + t('dejar_pedido') + '</p></div>',
        botones: [
          { texto: t('solo_reserva'), clase: 'btn-outline', accion: function () { cerrarModal(); navHuesped('MisReservas'); } },
          { texto: t('agregar_pedido_ahora'), clase: 'btn-primary', accion: function () { abrirPrepedido(res.id, reservaNueva); } }
        ]
      });
    } else {
      mostrarModal({
        titulo: t('reserva_registrada'),
        contenidoHTML: encabezadoExito +
          (s.RequiereAprobacion ? '<p class="text-xs opacity-60 mt-2">' + t('requiere_confirmacion') + '</p>' : '') + '</div>',
        botones: [{ texto: t('ver_mis_reservas'), clase: 'btn-primary', accion: function () { cerrarModal(); navHuesped('MisReservas'); } }]
      });

}

/* ---------- Mis Reservas ---------- */
function renderMisReservas() {
  var cont = document.getElementById('seccionMisReservas');
  cont.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';
  llamarAPI('obtenerReservas', [{ habitacion: APP.habitacion }], { loader: false }).then(function (reservas) {
    APP.misReservas = filtrarReservasHuesped(reservas || []);
    actualizarSnapshotHuesped(APP.misReservas);
    if (!APP.misReservas.length) {
      cont.innerHTML = '<div class="card p-8 text-center"><i class="fa-regular fa-calendar text-3xl opacity-30 mb-2"></i>' +
        '<p class="text-sm opacity-60">' + t('aun_no_reservas') + '</p></div>';
      return;
    }
    cont.innerHTML = '<h3 class="text-2xl mb-4" style="color: var(--verde-bosque)">' + t('mis_reservas') + '</h3>' +
      APP.misReservas.map(tarjetaReserva).join('');
  }).catch(function () {
    cont.innerHTML = htmlError(t('no_cargar_reservas'), 'renderMisReservas()');
  });
}

/* El huesped ve sus reservas de hoy en adelante (incluidas canceladas/editadas
   recientes, para enterarse), pero no el historial viejo del huesped anterior. */
/* Horas que una reserva sigue visible para el huesped despues de terminar. */
var GRACIA_RESERVA_HORAS = 2;

function filtrarReservasHuesped(reservas) {
  var ahora = Date.now();
  var graciaMs = GRACIA_RESERVA_HORAS * 60 * 60 * 1000;
  var hoy = hoyISO();
  return reservas.filter(function (r) {
    var fecha = String(r.Fecha || '');
    var horaFin = String(r.HoraFin || r.HoraInicio || '');
    // Momento de fin de la reserva (hora local del dispositivo).
    var fin = new Date(fecha + 'T' + (horaFin || '00:00') + ':00');
    if (isNaN(fin.getTime())) return fecha >= hoy; // respaldo si el dato viene raro
    // Se muestra hasta 2 horas despues de su hora de fin; luego se "borra".
    return (fin.getTime() + graciaMs) > ahora;
  }).sort(function (a, b) { return (a.Fecha + a.HoraInicio) < (b.Fecha + b.HoraInicio) ? -1 : 1; });
}

/* Guarda una "foto" del estado de las reservas para detectar cambios. */
function actualizarSnapshotHuesped(reservas) {
  APP.snapshotReservas = {};
  reservas.forEach(function (r) {
    APP.snapshotReservas[r.ID] = { estado: r.Estado, fecha: r.Fecha, hora: r.HoraInicio };
  });
}

function tarjetaReserva(r) {
  var puedeCancelar = ['Solicitada', 'Pendiente aprobacion', 'Confirmada'].indexOf(r.Estado) !== -1;
  // El prepedido aplica a servicios con PermitePrepedido (almuerzo/cena),
  // desde que se solicita la reserva hasta que se confirma.
  var servicio = (APP.servicios || []).filter(function (s) { return s.ID === r.ServicioID; })[0];
  var esGastroPrepedible = servicio && servicio.PermitePrepedido && prepedidoDisponible() &&
    ['Solicitada', 'Confirmada'].indexOf(r.Estado) !== -1;
  var linkPrepedido = '';
  if (esGastroPrepedible) {
    var texto = r.PrepedidoID ? t('ver_modificar_pedido') : t('agregar_pedido_reserva');
    linkPrepedido = '<a class="text-xs text-gray-400 hover:text-gray-600 underline cursor-pointer mt-2 inline-block" ' +
      'onclick="abrirPrepedido(\'' + r.ID + '\')">' + texto + '</a>';
  }
  return '<div class="card p-4 mb-3 fade-in">' +
    '<div class="flex items-start justify-between gap-2">' +
      '<div>' +
        '<p class="font-semibold">' + escaparHTML(nombreServicioReserva(r)) + (r.Variante ? ' <span class="text-xs font-normal opacity-70">· ' + escaparHTML(r.Variante) + '</span>' : '') + '</p>' +
        '<p class="text-sm opacity-60">' + r.Fecha + ' · ' + r.HoraInicio + ' · ' + r.Personas + ' ' + t('pers_abbr') + '</p>' +
        (r.Notas ? '<p class="text-xs opacity-50 mt-1"><i class="fa-solid fa-note-sticky"></i> ' + escaparHTML(r.Notas) + '</p>' : '') +
        linkPrepedido +
      '</div>' +
      '<span class="pill ' + claseEstado(r.Estado) + '">' + estadoLabel(r.Estado) + '</span>' +
    '</div>' +
    (puedeCancelar ? '<div class="mt-3 text-right"><button class="btn btn-outline !py-2 text-sm" onclick="cancelarReservaHuesped(\'' + r.ID + '\')">' + t('cancelar') + '</button></div>' : '') +
  '</div>';
}

function cancelarReservaHuesped(id) {
  mostrarModal({
    titulo: t('cancelar_reserva'),
    contenidoHTML: '<p class="text-sm mb-2">' + t('cuentanos_motivo') + '</p>' +
      '<input id="motivoCancel" class="input" placeholder="' + t('motivo') + '">',
    botones: [
      { texto: t('volver'), clase: 'btn-outline', accion: cerrarModal },
      { texto: t('confirmar_cancelacion'), clase: 'btn-peligro', accion: function () {
          var motivo = document.getElementById('motivoCancel').value;
          llamarAPI('cancelarReserva', [id, motivo, false]).then(function (res) {
            cerrarModal();
            mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
            if (res.success) renderMisReservas();
          });
      }}
    ]
  });
}

/* ---------- Carta Digital (acordeon, sin fotos) ---------- */

/**
 * Garantiza que la carta completa este en memoria (APP.carta).
 * Se pide UNA sola vez al servidor y queda cacheada para toda la sesion.
 * @return {Promise}
 */
function asegurarCarta() {
  if (APP.carta) return Promise.resolve(APP.carta);
  return llamarAPI('obtenerCartaCompleta', [], { loader: false, silencioso: true }).then(function (c) {
    APP.carta = c;
    return c;
  });
}

function renderCarta() {
  var cont = document.getElementById('seccionCarta');
  if (!APP.carta) {
    cont.innerHTML = '<div class="flex justify-center py-8"><div class="spinner"></div></div>';
    asegurarCarta().then(pintarCarta).catch(function () {
      cont.innerHTML = htmlError(t('no_cargar_carta'), 'renderCarta()');
    });
  } else {
    pintarCarta();
  }
}

/* Pinta el acordeon completo desde memoria: abrir categorias es instantaneo. */
function pintarCarta() {
  var cont = document.getElementById('seccionCarta');
  cont.innerHTML = '<h3 class="text-2xl mb-4" style="color: var(--verde-bosque)">' + t('carta') + '</h3>' +
    APP.carta.categorias.map(function (c) {
      var productos = APP.carta.productosPorCategoria[c.ID] || [];
      var cuerpo = productos.length
        ? '<div class="p-4 pt-0 space-y-3">' + productos.map(tarjetaProductoCarta).join('') + '</div>'
        : '<div class="p-4 pt-0 text-sm opacity-50">' + t('sin_productos') + '</div>';
      return '<div class="card mb-2 overflow-hidden">' +
        '<div class="acordeon-header flex items-center justify-between p-4" onclick="toggleAcordeon(this,\'' + c.ID + '\')">' +
          '<span class="font-semibold"><i class="fa-solid ' + c.IconoFontAwesome + ' mr-2" style="color:' + c.Color + '"></i>' + escaparHTML(nombreDe(c)) +
          ' <span class="text-xs opacity-40 font-normal">(' + productos.length + ')</span></span>' +
          '<i class="fa-solid fa-chevron-down transition-transform"></i>' +
        '</div>' +
        '<div class="acordeon-body" id="cat-' + c.ID + '">' + cuerpo + '</div>' +
      '</div>';
    }).join('');
}

function toggleAcordeon(header, categoriaID) {
  var body = document.getElementById('cat-' + categoriaID);
  var chevron = header.querySelector('.fa-chevron-down');
  var abierto = body.classList.contains('abierto');
  body.classList.toggle('abierto', !abierto);
  chevron.style.transform = abierto ? '' : 'rotate(180deg)';
}

function tarjetaProductoCarta(p) {
  var etiquetas = (p.Etiquetas || '').split(',').filter(function (e) { return e.trim(); })
    .map(function (e) { return '<span class="pill pill-etiqueta">' + escaparHTML(etiquetaLabel(e.trim())) + '</span>'; }).join(' ');
  var desc = descDe(p);
  return '<div class="flex justify-between gap-3 border-b pb-2" style="border-color: var(--borde)">' +
    '<div>' +
      '<p class="font-medium">' + escaparHTML(nombreDe(p)) + '</p>' +
      (desc ? '<p class="text-xs opacity-60">' + escaparHTML(desc) + '</p>' : '') +
      (etiquetas ? '<div class="mt-1 space-x-1">' + etiquetas + '</div>' : '') +
    '</div>' +
    '<div class="whitespace-nowrap font-semibold" style="color: var(--verde-bosque)">' + fmtMoneda(p.Precio) + '</div>' +
  '</div>';
}

/* ---------- Prepedido (modal) ---------- */

/**
 * Abre el modal de prepedido para una reserva.
 * @param {string} reservaID
 * @param {Object} reservaObj Opcional: la reserva ya conocida (recien creada),
 *   para no volver a pedirla al servidor.
 */
function abrirPrepedido(reservaID, reservaObj) {
  // Si el restaurant no acepta prepedidos hoy, no se abre el modal.
  if (!prepedidoDisponible()) { mostrarToast(t('prepedido_no_disponible'), 'error'); return; }
  APP.reservaPrepedido = reservaID;
  // Origen: 'ops' si lo abrio abrirPrepedidoOps; si no, huesped.
  if (APP.prepedidoOrigen !== 'ops') APP.prepedidoOrigen = 'huesped';
  APP.carrito = [];

  // La reserva ya esta en memoria (recien creada o listada en Mis Reservas).
  var reserva = reservaObj ||
    (APP.misReservas || []).filter(function (r) { return r.ID === reservaID; })[0] || null;

  // En paralelo: pedido existente (si lo hay) + carta en memoria.
  Promise.all([
    llamarAPI('obtenerPedidosPorReserva', [reservaID], { loader: true }),
    asegurarCarta()
  ]).then(function (resultados) {
    var existente = resultados[0];
    APP.pedidoNotasPrevias = (existente && existente.pedido) ? (existente.pedido.Notas || '') : '';
    APP.pedidoEntrega = (existente && existente.pedido && existente.pedido.Entrega === 'Habitacion') ? 'Habitacion' : 'Restaurant';
    if (existente && existente.detalles) {
      APP.carrito = existente.detalles.map(function (d) {
        return { productoID: d.ProductoID, nombre: d.Nombre, precio: d.PrecioUnitario, cantidad: d.Cantidad };
      });
    }
    renderModalPrepedido(reserva);
  }).catch(function () {
    mostrarToast(t('no_abrir_pedido'), 'error');
  });
}

function renderModalPrepedido(reserva) {
  // Solo categorias que tienen productos (oculta vacias como "Fondos").
  var categoriasConProductos = APP.carta.categorias.filter(function (c) {
    var arr = APP.carta.productosPorCategoria[c.ID];
    return arr && arr.length;
  });

  // Chips de categoria en fila horizontal (scroll lateral, sin ocupar alto).
  var categoriasHTML = categoriasConProductos.map(function (c, i) {
    return '<button class="chip-cat btn ' + (i === 0 ? 'btn-dorado' : 'btn-outline') + ' !py-1.5 !px-3 text-xs shrink-0" data-cat="' + c.ID + '" onclick="cargarProductosPrepedido(\'' + c.ID + '\', this)">' + escaparHTML(nombreDe(c)) + '</button>';
  }).join('');

  var notasPrevias = (APP.pedidoNotasPrevias || '');
  // Interruptor de configuracion: si esta apagado, no se puede pedir a la habitacion.
  var habDisponible = String(APP.config.PEDIDO_HABITACION_ACTIVO || 'TRUE').toUpperCase() !== 'FALSE';
  var entregaHab = habDisponible && APP.pedidoEntrega === 'Habitacion';
  if (!habDisponible) APP.pedidoEntrega = 'Restaurant';
  var contenido =
    '<div id="contadorPrepedido" class="text-xs mb-2 text-center opacity-70"></div>' +
    // Selector: comer en el restaurant o pedir a la habitacion.
    '<label class="lbl">' + t('donde') + '</label>' +
    '<div class="grid grid-cols-2 gap-2 ' + (habDisponible ? 'mb-3' : 'mb-1') + '">' +
      '<button type="button" id="entRest" class="btn ' + (entregaHab ? 'btn-outline' : 'btn-dorado') + '" onclick="elegirEntrega(\'Restaurant\')"><i class="fa-solid fa-utensils"></i> ' + t('en_restaurant') + '</button>' +
      '<button type="button" id="entHab" class="btn ' + (entregaHab ? 'btn-dorado' : 'btn-outline') + '"' +
        (habDisponible ? ' onclick="elegirEntrega(\'Habitacion\')"' : ' disabled style="opacity:.45;cursor:not-allowed"') +
        '><i class="fa-solid fa-bell-concierge"></i> ' + t('a_habitacion') +
        (recargoHabitacion() > 0 ? ' <span class="text-xs opacity-80">(+' + fmtMoneda(recargoHabitacion()) + ')</span>' : '') + '</button>' +
    '</div>' +
    (habDisponible ? '' : '<p class="text-xs mb-3" style="color:#A6524B"><i class="fa-solid fa-circle-info"></i> ' + t('hab_no_disponible') + '</p>') +
    // Carrito visible: lo que ya se pidio, sin tener que recorrer categorias.
    '<div id="carritoPrepedido" class="oculto mb-3"></div>' +
    '<div class="flex gap-2 mb-3 overflow-x-auto pb-1" style="scrollbar-width:thin">' + categoriasHTML + '</div>' +
    '<div id="listaProductosPrepedido" class="space-y-1"></div>' +
    // Notas del pedido (ej. punto de la carne, sin sal, etc.)
    '<div class="mt-4"><label class="lbl"><i class="fa-solid fa-pen-to-square"></i> ' + t('notas_pedido') + '</label>' +
      '<textarea id="notasPedido" class="input" rows="2" placeholder="' + t('notas_pedido_ph') + '">' + escaparHTML(notasPrevias) + '</textarea></div>' +
    // Barra de total fija abajo del modal.
    '<div class="sticky bottom-0 -mx-5 px-5 pt-3 pb-1 mt-3 border-t" style="border-color: var(--borde); background: var(--blanco);">' +
      '<div id="resumenPrepedido" class="flex items-center justify-between text-sm"></div>' +
    '</div>';

  mostrarModal({
    titulo: t('pedido'),
    contenidoHTML: contenido,
    botones: [
      { texto: t('cerrar'), clase: 'btn-outline', accion: cerrarModal },
      { texto: t('guardar_pedido'), clase: 'btn-primary', accion: guardarPrepedido }
    ]
  });

  // Carga la primera categoria con productos de una vez.
  if (categoriasConProductos[0]) cargarProductosPrepedido(categoriasConProductos[0].ID, null);
  renderCarritoPrepedido();
  iniciarContadorPrepedido(reserva);
}

function iniciarContadorPrepedido(reserva) {
  if (!reserva) return;
  var limite = Number(APP.config.PREPEDIDO_MINUTOS_LIMITE) || 30;
  var cont = document.getElementById('contadorPrepedido');
  function tick() {
    if (!cont) return;
    var objetivo = new Date(reserva.Fecha + 'T' + reserva.HoraInicio + ':00');
    var limiteMs = objetivo.getTime() - limite * 60000;
    var restante = limiteMs - Date.now();
    if (restante <= 0) {
      cont.innerHTML = '<span style="color: var(--peligro)"><i class="fa-solid fa-lock"></i> ' + t('ventana_cerrada') + '</span>';
    } else {
      var min = Math.floor(restante / 60000);
      var seg = Math.floor((restante % 60000) / 1000);
      cont.innerHTML = '<i class="fa-regular fa-clock"></i> ' + t('puedes_modificar', { m: min, s: seg });
    }
  }
  tick();
  if (APP.cuentaRegresiva) clearInterval(APP.cuentaRegresiva);
  APP.cuentaRegresiva = setInterval(tick, 1000);
}

function cargarProductosPrepedido(categoriaID, chip) {
  APP.prepedidoCatActual = categoriaID;
  // Resalta el chip activo.
  document.querySelectorAll('.chip-cat').forEach(function (b) {
    var sel = b.getAttribute('data-cat') === categoriaID;
    b.classList.toggle('btn-dorado', sel); b.classList.toggle('btn-outline', !sel);
  });

  var lista = document.getElementById('listaProductosPrepedido');
  var productos = (APP.carta && APP.carta.productosPorCategoria[categoriaID]) || [];
  if (!productos.length) { lista.innerHTML = '<p class="text-xs opacity-50 text-center py-4">' + t('sin_productos_cat') + '</p>'; return; }
  lista.innerHTML = productos.map(function (p) {
    var enCarrito = APP.carrito.filter(function (i) { return i.productoID === p.ID; })[0];
    var cant = enCarrito ? enCarrito.cantidad : 0;
    var nombreEsc = escaparHTML(nombreDe(p)).replace(/'/g, "\\'");
    var control = cant > 0
      ? '<div class="flex items-center gap-2">' +
          '<button class="btn btn-outline !py-1 !px-3" onclick="cambiarCantidad(\'' + p.ID + '\',-1)">−</button>' +
          '<b class="w-5 text-center">' + cant + '</b>' +
          '<button class="btn btn-dorado !py-1 !px-3" onclick="cambiarCantidad(\'' + p.ID + '\',1)">+</button>' +
        '</div>'
      : '<button class="btn btn-outline !py-1 !px-3 text-xs" onclick="agregarAlCarrito(\'' + p.ID + '\',\'' + nombreEsc + '\',' + p.Precio + ')"><i class="fa-solid fa-plus"></i></button>';
    // Lupa: solo si el producto tiene descripcion. Abre/cierra el detalle.
    var lupa = descDe(p)
      ? '<button class="btn btn-outline !py-1 !px-2 text-xs" onclick="toggleDescProducto(\'' + p.ID + '\')" title="' + t('ver_descripcion') + '"><i class="fa-solid fa-magnifying-glass"></i></button>'
      : '';
    return '<div class="py-2 border-b" style="border-color: var(--borde)">' +
      '<div class="flex items-center justify-between gap-2">' +
        '<div class="min-w-0"><p class="font-medium text-sm">' + escaparHTML(nombreDe(p)) + '</p><p class="text-xs opacity-60">' + fmtMoneda(p.Precio) + '</p></div>' +
        '<div class="flex items-center gap-1 shrink-0">' + lupa + control + '</div>' +
      '</div>' +
      (descDe(p) ? '<div id="desc-' + p.ID + '" class="oculto caja-info text-xs mt-2 p-2">' + escaparHTML(descDe(p)) + '</div>' : '') +
    '</div>';
  }).join('');
}

/* Elige donde se entrega el pedido (restaurant o habitacion). */
function elegirEntrega(donde) {
  // Seguridad: si el pedido a la habitacion esta apagado, siempre restaurant.
  if (donde === 'Habitacion' && String(APP.config.PEDIDO_HABITACION_ACTIVO || 'TRUE').toUpperCase() === 'FALSE') return;
  APP.pedidoEntrega = donde;
  var rest = document.getElementById('entRest'), hab = document.getElementById('entHab');
  var esHab = donde === 'Habitacion';
  if (rest) { rest.classList.toggle('btn-dorado', !esHab); rest.classList.toggle('btn-outline', esHab); }
  if (hab) { hab.classList.toggle('btn-dorado', esHab); hab.classList.toggle('btn-outline', !esHab); }
  // El total cambia si hay recargo por entrega a la habitacion.
  renderCarritoPrepedido();
}

/* Muestra/oculta la descripcion completa de un plato en el prepedido. */
function toggleDescProducto(productoID) {
  var el = document.getElementById('desc-' + productoID);
  if (el) el.classList.toggle('oculto');
}

function agregarAlCarrito(productoID, nombre, precio) {
  var item = APP.carrito.filter(function (i) { return i.productoID === productoID; })[0];
  if (item) item.cantidad += 1;
  else APP.carrito.push({ productoID: productoID, nombre: nombre, precio: precio, cantidad: 1 });
  cargarProductosPrepedido(APP.prepedidoCatActual); // refresca el stepper del producto
  renderCarritoPrepedido();
}

function cambiarCantidad(productoID, delta) {
  var item = APP.carrito.filter(function (i) { return i.productoID === productoID; })[0];
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) APP.carrito = APP.carrito.filter(function (i) { return i.productoID !== productoID; });
  cargarProductosPrepedido(APP.prepedidoCatActual);
  renderCarritoPrepedido();
}

/* Pinta la lista detallada del carrito (arriba) y la barra de total (abajo). */
function renderCarritoPrepedido() {
  pintarListaCarrito();

  var cont = document.getElementById('resumenPrepedido');
  if (!cont) return;
  var total = 0, unidades = 0;
  APP.carrito.forEach(function (i) { total += i.precio * i.cantidad; unidades += i.cantidad; });
  if (!unidades) {
    cont.innerHTML = '<span class="opacity-50 text-xs"><i class="fa-solid fa-basket-shopping mr-1"></i> ' + t('toca_agregar') + '</span>';
    return;
  }
  // El recargo por entrega a la habitacion se suma y se muestra desglosado.
  var recargo = (APP.pedidoEntrega === 'Habitacion') ? recargoHabitacion() : 0;
  var detalleRecargo = recargo > 0
    ? ' <span class="text-xs opacity-60">+ ' + t('recargo_habitacion') + ' ' + fmtMoneda(recargo) + '</span>' : '';
  cont.innerHTML = '<span class="opacity-70"><i class="fa-solid fa-basket-shopping mr-1"></i> ' + unidades + ' item' + (unidades > 1 ? 's' : '') + detalleRecargo + '</span>' +
    '<span class="font-semibold text-base">' + fmtMoneda(total + recargo) + '</span>';
}

/* Lista detallada del carrito: cada producto con su stepper y subtotal,
   visible arriba de las categorias (sin tener que ir a buscarlo). */
function pintarListaCarrito() {
  var cont = document.getElementById('carritoPrepedido');
  if (!cont) return;
  if (!APP.carrito.length) { cont.classList.add('oculto'); cont.innerHTML = ''; return; }
  cont.classList.remove('oculto');

  var filas = APP.carrito.map(function (i) {
    return '<div class="flex items-center justify-between gap-2 py-2 border-b" style="border-color: var(--borde)">' +
      '<div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">' + escaparHTML(i.nombre) + '</p>' +
        '<p class="text-xs opacity-60">' + fmtMoneda(i.precio) + ' c/u</p></div>' +
      '<div class="flex items-center gap-2 shrink-0">' +
        '<button class="btn btn-outline !py-1 !px-3" onclick="cambiarCantidad(\'' + i.productoID + '\',-1)">−</button>' +
        '<b class="w-5 text-center">' + i.cantidad + '</b>' +
        '<button class="btn btn-dorado !py-1 !px-3" onclick="cambiarCantidad(\'' + i.productoID + '\',1)">+</button>' +
      '</div>' +
      '<div class="text-sm font-semibold w-16 text-right shrink-0">' + fmtMoneda(i.precio * i.cantidad) + '</div>' +
    '</div>';
  }).join('');

  cont.innerHTML =
    '<div class="caja-info p-3">' +
      '<p class="lbl !mb-2"><i class="fa-solid fa-basket-shopping"></i> ' + t('tu_pedido') + '</p>' +
      '<div style="max-height:220px; overflow-y:auto">' + filas + '</div>' +
    '</div>';
}

function guardarPrepedido() {
  if (!APP.carrito.length) { mostrarToast(t('agrega_producto'), 'error'); return; }
  var items = APP.carrito.map(function (i) { return { productoID: i.productoID, cantidad: i.cantidad }; });
  var notasEl = document.getElementById('notasPedido');
  var notas = notasEl ? notasEl.value : '';
  var entrega = APP.pedidoEntrega === 'Habitacion' ? 'Habitacion' : 'Restaurant';
  llamarAPI('crearPedido', [APP.reservaPrepedido, items, notas, entrega]).then(function (res) {
    mostrarToast(res.mensaje, res.success ? 'exito' : 'error');
    if (res.success) {
      cerrarModal();
      // Refresca la vista correcta segun desde donde se abrio.
      if (APP.prepedidoOrigen === 'ops') renderOperaciones();
      else renderMisReservas();
      APP.prepedidoOrigen = null;
    }
  });
}

/* ==========================================================================
   ===================  VISTA STAFF  ===================
   ========================================================================== */
function iniciarStaff() {
  APP.modo = 'staff';
  document.getElementById('vistaStaff').classList.remove('oculto');
  document.getElementById('staffRol').textContent = APP.usuarioStaff.Rol;

  // Ajusta visibilidad de pestanas segun rol.
  ajustarNavPorRol();

  // El staff usa TODAS las categorias (incluidas ocultas) para gestion.
  // Ya llegaron con obtenerDatosIniciales; no hay que volver a pedirlas.

    APP.categorias = APP.categoriasTodas;
  }

  navStaff('Operaciones');
  iniciarNotificaciones();
