<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles Cascadas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #ECECEE; --surface: #FFFFFF; --tinta: #3A3A3C; --tinta-suave: #6E6C69;
      --grafito: #414143; --hueso: #ECECEE; --borde: #CECECF; --input: #F3F3F4;
      --sombra: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,.06), 0 10px 24px -12px rgba(46,46,48,.3);
    }
    html, body { font-family: 'Oswald', -apple-system, sans-serif; font-weight: 300; background: var(--bg); color: var(--tinta);
      background-image: radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.6), transparent 55%); min-height: 100%; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; letter-spacing: .5px; }

    .topbar { background: linear-gradient(180deg, #4C4C4F, #414143 60%, #38383A); color: #E9E7E5; padding: 16px 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 12px rgba(0,0,0,.28); position: sticky; top: 0; z-index: 40; }
    .topbar .in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .topbar h1 { font-size: 24px; line-height: 1; }
    .topbar p { font-size: 10.5px; color: #C9C6C2; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }
    .lang { display: flex; gap: 4px; }
    .lang button { background: rgba(255,255,255,.1); border: none; color: #E9E7E5; font-family: 'Oswald'; font-weight: 500;
      font-size: 12px; padding: 6px 12px; border-radius: 9px; cursor: pointer; }
    .lang button.activo { background: #E9E7E5; color: #38383A; }

    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
    .paso-tit { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--tinta-suave); font-weight: 600;
      font-family: 'Oswald'; margin: 6px 0 12px; display: flex; align-items: center; gap: 8px; }
    .paso-tit .n { background: var(--grafito); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-size: 11px; }

    /* Selector de ocasion */
    .grid-oc { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .oc {
      background: var(--surface); border: 1px solid var(--borde); border-radius: 18px; padding: 20px 18px; cursor: pointer;
      box-shadow: var(--sombra); text-align: left; display: flex; flex-direction: column; gap: 10px; position: relative; transition: transform .15s, box-shadow .2s;
      border-left: 5px solid var(--acc, #999);
    }
    .oc:hover { transform: translateY(-3px); }
    .oc.sel { outline: 3px solid var(--acc); outline-offset: 1px; }
    .oc .ic { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 21px; color: #fff; background: var(--acc, #888); box-shadow: inset 0 1px 1px rgba(255,255,255,.3), 0 2px 4px rgba(0,0,0,.2); }
    .oc .nom { font-weight: 500; font-size: 17.5px; color: var(--tinta); }
    .oc .tip { font-size: 11.5px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
    .oc .cupon-badge { position: absolute; top: 14px; right: 14px; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--acc); border: 1px solid var(--acc); border-radius: 7px; padding: 3px 7px; font-weight: 600; }

    /* Formulario */
    .card { background: var(--surface); border: 1px solid var(--borde); border-radius: 18px; padding: 22px; box-shadow: var(--sombra); margin-top: 10px; }
    .oculto { display: none !important; }
    .campo { margin-bottom: 18px; }
    .campo label { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-suave); font-weight: 600; margin-bottom: 7px; }
    .campo input, .campo textarea, .campo select {
      width: 100%; border: none; border-radius: 14px; background: var(--input); box-shadow: inset 0 0 0 1px var(--borde);
      font-family: 'Oswald'; font-size: 16.5px; color: var(--tinta); padding: 14px 16px; resize: vertical;
    }
    .campo textarea { min-height: 100px; line-height: 1.55; }
    .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hint { font-size: 12.5px; color: var(--tinta-suave); margin-top: 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .chip { border: 1.5px solid var(--borde); background: var(--surface); color: var(--tinta-suave); font-family: 'Oswald';
      font-weight: 500; font-size: 13.5px; padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: all .15s; }
    .chip:hover { border-color: var(--acc-campo, var(--tinta-suave)); color: var(--tinta); }
    .chip.act { background: var(--acc-campo, var(--grafito)); border-color: var(--acc-campo, var(--grafito)); color: #fff; }
    .btn { border: none; border-radius: 15px; cursor: pointer; font-family: 'Oswald'; font-weight: 600; font-size: 17px;
      padding: 17px 24px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-dark { background: linear-gradient(180deg, #4C4C4F, #414143 60%, #38383A); color: #E9E7E5; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 6px rgba(0,0,0,.22); }
    .btn-dark:active { transform: translateY(1px); }
    .btn-ghost { background: var(--surface); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--borde); }
    .acciones { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }

    .instr { background: #F1EFEA; border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; margin-top: 16px; font-size: 13px; color: var(--tinta-suave); line-height: 1.55; }
    .instr b { color: var(--tinta); }
    .instr ol { margin: 8px 0 0 18px; }
    .instr li { margin-bottom: 3px; }

    .previa-wrap { display: flex; justify-content: center; margin-top: 4px; }
    .previa { width: 250px; border-radius: 6px; box-shadow: 0 12px 30px -12px rgba(30,26,20,.4); }
    .previa svg { display: block; width: 100%; height: auto; border-radius: 6px; }
    .previa-cap { text-align: center; font-size: 11.5px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; margin-top: 16px; margin-bottom: 6px; }
    .previa-reverso { width: 250px; aspect-ratio: 210/148.5; border-radius: 6px; box-shadow: 0 12px 30px -12px rgba(30,26,20,.4); }

    .tabla-gc { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .tabla-gc th, .tabla-gc td { text-align: left; padding: 9px 12px; white-space: nowrap; }
    .tabla-gc th { color: var(--tinta-suave); text-transform: uppercase; font-size: 11px; letter-spacing: .04em; border-bottom: 2px solid var(--borde); }
    .tabla-gc td { border-bottom: 1px solid var(--borde); }
    .tabla-gc tbody tr:last-child td { border-bottom: none; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
      background: #2c2c2e; color: #fff; padding: 11px 20px; border-radius: 12px; font-size: 13px; box-shadow: 0 8px 22px rgba(0,0,0,.3);
      z-index: 300; pointer-events: none; transition: all .25s; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #8B3A3A; }
    @media (max-width: 520px) { .fila2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="in">
      <div>
        <h1 data-t="titulo">Detalles Cascadas</h1>
        <p data-t="subtitulo">Tarjetas de atención · Cascadas Hotel</p>
      </div>
      <div class="lang">
        <button id="langEs" class="activo" onclick="setIdioma('es')">ES</button>
        <button id="langEn" onclick="setIdioma('en')">EN</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="paso-tit"><span class="n">1</span> <span data-t="paso1">Elige el tipo de tarjeta</span></div>
    <div class="grid-oc" id="gridOcasiones"></div>

    <div id="panelForm" class="oculto">
      <div class="paso-tit" style="margin-top:26px"><span class="n">2</span> <span data-t="paso2">Completa los datos</span></div>
      <div class="card">
        <div id="camposForm"></div>
        <div class="campo" id="campoMensaje">
          <label data-t="lbl_mensaje">Mensaje (editable)</label>
          <textarea id="inpMensaje" oninput="APP.mensajeTocado=true; refrescarPrevia()"></textarea>
          <p class="hint" data-t="hint_mensaje">Viene un texto sugerido; puedes cambiarlo como quieras.</p>
        </div>
        <div class="acciones">
          <button class="btn btn-ghost" onclick="volverInicio()"><i class="fa-solid fa-arrow-left"></i> <span data-t="btn_cambiar">Cambiar tipo</span></button>
          <button class="btn btn-dark" onclick="generarPDF()"><i class="fa-solid fa-file-arrow-down"></i> <span data-t="btn_pdf">Generar tarjeta (PDF)</span></button>
        </div>

        <div class="instr" id="instrBox"></div>
      </div>

      <div class="paso-tit" style="margin-top:22px"><span class="n">3</span> <span data-t="paso3">Vista previa</span></div>
      <div class="previa-wrap">
        <div class="previa" id="previa"></div>
      </div>
      <div id="previaRevSection">
        <p class="previa-cap" data-t="previa_reverso">Reverso (color sólido, a sangre completa)</p>
        <div class="previa-wrap">
          <div class="previa-reverso" id="previaReverso"></div>
        </div>
      </div>

      <div id="giftcardsSection" class="oculto">
        <div class="paso-tit" style="margin-top:22px"><i class="fa-solid fa-clock-rotate-left"></i> <span data-t="gc_historial">Gift Cards emitidas</span></div>
        <div class="card" id="giftcardsLista"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    var APP = { idioma: 'es', ocasion: null, mensajeTocado: false };
    var LOGO_URL = 'https://lh3.googleusercontent.com/d/1l-GRXICSU6fHGe9uGsnGdZ6M0FKgKevJ';

    // Paleta base de las tarjetas
    var PAPEL = [247, 244, 238], INK = [58, 54, 48], INK_SOFT = [124, 118, 108];
    var GRAFITO = [65, 65, 67]; // reverso solido: mismo grafito de marca del resto de las apps
    // Mezcla dos colores RGB (f=1 -> todo c1, f=0 -> todo c2). Para tintes de fondo.
    function mezclar(c1, c2, f) { return [0, 1, 2].map(function (i) { return Math.round(c1[i] * f + c2[i] * (1 - f)); }); }

    // ---------------------------------------------------------------------
    //  LOGO real del hotel (mismo que usan las demas apps de Cascadas).
    //  Se convierte a base64 una sola vez (promesa cacheada) y se guarda su
    //  proporcion ancho/alto para dibujarlo sin deformarlo. Si no carga (sin
    //  internet, CORS, etc.) se usa el respaldo de texto "CASCADAS HOTEL".
    // ---------------------------------------------------------------------
    var LOGO_URL = 'https://lh3.googleusercontent.com/d/1l-GRXICSU6fHGe9uGsnGdZ6M0FKgKevJ';
    var logoPromise = null;
    function obtenerLogo() {
      if (logoPromise) return logoPromise;
      logoPromise = new Promise(function (resolve) {
        try {
          var img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = function () {
            try {
              var canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
              canvas.getContext('2d').drawImage(img, 0, 0);
              resolve({ url: canvas.toDataURL('image/png'), aspecto: img.naturalWidth / img.naturalHeight });
            } catch (e) { resolve(null); }
          };
          img.onerror = function () { resolve(null); };
          img.src = LOGO_URL;
        } catch (e) { resolve(null); }
      });
      return logoPromise;
    }
    // Precarga el logo apenas arranca la app; si llega despues de pintar la
    // vista previa, la vuelve a pintar para que aparezca el logo real.
    obtenerLogo().then(function (logo) {
      APP.logo = logo;
      if (APP.ocasion) refrescarPrevia();
    });

    // Dibuja el logo (si cargo) centrado en (cx,cy) con una altura fija; si
    // no hay logo, cae al respaldo de texto "CASCADAS / HOTEL".
    function dibujarMarca(p, cx, cy, altura, colorTexto, colorSub, maxW) {
      if (APP.logo) {
        var h = altura, w = h * APP.logo.aspecto;
        maxW = maxW || 62; if (w > maxW) { w = maxW; h = w / APP.logo.aspecto; }
        p.image(APP.logo.url, cx - w / 2, cy - h / 2, w, h);
      } else if (altura < 9) {
        // Espacio angosto (p.ej. cupones): version compacta, sin quiebre de linea.
        var s = altura / 11;
        p.text('CASCADAS', cx, cy + 1.5 * s, Math.max(4.2, 9 * s), colorTexto, { font: 'helvetica', style: 'bold', charSpace: .15 });
      } else {
        p.text('C A S C A D A S', cx, cy + 1, 10, colorTexto, { font: 'helvetica', style: 'bold', charSpace: .8 });
        p.text('H O T E L', cx, cy + 7, 5, colorSub, { font: 'helvetica', charSpace: 1.8 });
      }
    }

    // ---------------------------------------------------------------------
    //  PATRONES DECORATIVOS (para que las tarjetas no se sientan vacias)
    // ---------------------------------------------------------------------
    // Ribete de pequeños rombos conectados por lineas finas, a lo largo de
    // una franja horizontal (arriba/abajo de cada pagina).
    function patronRombos(p, x0, x1, y, col, n) {
      n = n || 7;
      var paso = (x1 - x0) / (n - 1);
      for (var i = 0; i < n; i++) {
        var x = x0 + i * paso;
        p.poly([[x, y - 1.3], [x + 1.3, y], [x, y + 1.3], [x - 1.3, y], [x, y - 1.3]], col, .35);
        if (i < n - 1) p.line(x + 1.7, y, x + paso - 1.7, y, col, .25);
      }
    }
    // Textura de puntos muy tenue en toda un area, para dar riqueza al fondo
    // sin ensuciar la lectura del texto.
    function patronPuntos(p, x0, y0, x1, y1, col, paso) {
      paso = paso || 8.5;
      for (var yy = y0; yy <= y1; yy += paso) {
        for (var xx = x0; xx <= x1; xx += paso) { p.dot(xx, yy, 0.32, col); }
      }
    }

    // Meses del año, para la burbuja de "meses validos" de la Gift Card
    // (ej. restringirla a temporada baja).
    var MESES = {
      es: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
      en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    };

    // ---------------------------------------------------------------------
    //  DEFINICION DE OCASIONES
    //  Cada una: color de acento, icono UI, campos del formulario, dibujo de
    //  la portada y del mensaje interior, y el texto sugerido (es/en).
    //  Placeholders en el mensaje: {n1}{n2}{nombre}{remitente}{destinatario}
    //  {noches}{inclusiones}
    // ---------------------------------------------------------------------
    var T = {
      aniversario: {
        acc: [169, 115, 123], icon: 'fa-heart', cupon: false,
        nombre: { es: 'Aniversario', en: 'Anniversary' },
        campos: [
          { key: 'n1', label: { es: 'Nombre 1', en: 'Name 1' }, ph: 'Esteban' },
          { key: 'n2', label: { es: 'Nombre 2', en: 'Name 2' }, ph: 'Carolina' }
        ],
        titulo: { es: ['Feliz', 'Aniversario'], en: ['Happy', 'Anniversary'] },
        sub: function (d) { return (d.n1 && d.n2) ? d.n1 + ' & ' + d.n2 : (d.n1 || d.n2 || ''); },
        motivo: function (p, cx, cy, a) { anillos(p, cx, cy, 11, a, 1.6); },
        mensaje: {
          es: '{n1} y {n2}:\n\nQue este nuevo aniversario los encuentre tan unidos como hoy, y que cada año que pasa sea una razón más para celebrar el camino que han construido juntos.\n\nNos llena de alegría poder acompañarlos en una fecha tan especial. Que la disfruten muchísimo.\n\nCon cariño,\nel equipo de Cascadas Hotel',
          en: '{n1} & {n2}:\n\nMay this anniversary find you as close as you are today, and may every year that passes be one more reason to celebrate the path you have built together.\n\nIt fills us with joy to be part of such a special date. We hope you enjoy it to the fullest.\n\nWarmly,\nthe Cascadas Hotel team'
        }
      },
      cumpleanos: {
        acc: [192, 145, 61], icon: 'fa-cake-candles', cupon: false,
        nombre: { es: 'Cumpleaños', en: 'Birthday' },
        campos: [{ key: 'nombre', label: { es: 'Nombre', en: 'Name' }, ph: 'Camila' }],
        titulo: { es: ['Feliz', 'Cumpleaños'], en: ['Happy', 'Birthday'] },
        sub: function (d) { return d.nombre || ''; },
        motivo: function (p, cx, cy, a) { chispas(p, cx, cy - 6, a); vela(p, cx, cy + 7, a); },
        mensaje: {
          es: '{nombre}:\n\n¡Feliz cumpleaños! Que este nuevo año de vida esté lleno de momentos hermosos, de risas compartidas y de todas esas pequeñas cosas que hacen la vida más dulce.\n\nEs un honor para todo el equipo poder celebrarlo contigo. Esperamos que tu estadía sea tan especial como la fecha.\n\nCon cariño,\nel equipo de Cascadas Hotel',
          en: '{nombre}:\n\nHappy birthday! May this new year of life be full of beautiful moments, shared laughter, and all those little things that make life sweeter.\n\nIt is an honor for our whole team to celebrate it with you. We hope your stay is as special as the date itself.\n\nWarmly,\nthe Cascadas Hotel team'
        }
      },
      lunademiel: {
        acc: [192, 132, 102], icon: 'fa-ring', cupon: false,
        nombre: { es: 'Luna de miel', en: 'Honeymoon' },
        campos: [
          { key: 'n1', label: { es: 'Nombre 1', en: 'Name 1' }, ph: '' },
          { key: 'n2', label: { es: 'Nombre 2', en: 'Name 2' }, ph: '' }
        ],
        titulo: { es: ['Luna', 'de Miel'], en: ['Honeymoon'] },
        sub: function (d) { return (d.n1 && d.n2) ? d.n1 + ' & ' + d.n2 : (APP.idioma === 'en' ? 'Newlyweds' : 'Recién casados'); },
        motivo: function (p, cx, cy, a) { anillos(p, cx, cy, 10, a, 1.5); corazon(p, cx, cy - 20, 5, a); },
        mensaje: {
          es: '{n1} y {n2}:\n\n¡Felicidades por su matrimonio! Que esta luna de miel sea apenas el primero de muchos viajes que emprendan juntos, y que cada uno de ellos los una todavía más.\n\nEstamos felices de acompañarlos en el inicio de esta nueva etapa. Que la disfruten al máximo.\n\nCon cariño,\nel equipo de Cascadas Hotel',
          en: '{n1} & {n2}:\n\nCongratulations on your wedding! May this honeymoon be just the first of many journeys you take together, and may each one bring you even closer.\n\nWe are delighted to be part of the start of this new chapter. We hope you enjoy it to the fullest.\n\nWarmly,\nthe Cascadas Hotel team'
        }
      },
      bienvenida: {
        acc: [156, 122, 60], wordmark: [58, 58, 60], icon: 'fa-mountain-sun', cupon: false,
        nombre: { es: 'Bienvenida', en: 'Welcome' },
        campos: [{ key: 'nombre', label: { es: 'Nombre / familia', en: 'Name / family' }, ph: 'Familia Pérez' }],
        kicker: { es: 'LES DAMOS LA', en: 'WE WELCOME YOU' },
        titulo: { es: ['Bienvenida'], en: ['Welcome'] },
        sub: function (d) { return d.nombre || ''; },
        motivo: function (p, cx, cy, a) { montanas(p, cx, cy, a); },
        mensaje: {
          es: '{nombre}:\n\nLes damos la más cálida bienvenida a Cascadas Hotel. Es un verdadero gusto recibirlos, y esperamos que desde el primer momento se sientan como en casa.\n\nNuestro equipo está para lo que necesiten, con el único objetivo de que su estadía sea una experiencia inolvidable, llena de descanso y buenos momentos.\n\nCon afecto,\nel equipo de Cascadas Hotel',
          en: '{nombre}:\n\nWe extend the warmest welcome to Cascadas Hotel. It is a true pleasure to have you, and we hope that from the very first moment you feel right at home.\n\nOur team is here for whatever you may need, with the sole goal of making your stay an unforgettable experience full of rest and good moments.\n\nWith warmth,\nthe Cascadas Hotel team'
        }
      },
      estadiaregalo: {
        acc: [122, 59, 59], icon: 'fa-gift', cupon: false,
        nombre: { es: 'Estadía de regalo', en: 'Gifted stay' },
        campos: [
          { key: 'destinatario', label: { es: 'Para (huésped)', en: 'To (guest)' }, ph: '' },
          { key: 'remitente', label: { es: 'De parte de', en: 'From' }, ph: 'Andrés' }
        ],
        kicker: { es: 'UN REGALO PARA TI', en: 'A GIFT FOR YOU' },
        titulo: { es: ['Estadía', 'de Regalo'], en: ['A Gifted', 'Stay'] },
        sub: function (d) { return d.remitente ? ((APP.idioma === 'en' ? 'From ' : 'De ') + d.remitente) : ''; },
        motivo: function (p, cx, cy, a) { mono(p, cx, cy, a); },

    }
    function chispas(p, cx, cy, a) {
      [[0, -16, 2.2], [15, -8, 1.5], [-15, -6, 1.6], [11, 9, 1.3], [-12, 10, 1.4], [0, 15, 1.1]].forEach(function (q) {
        var x = cx + q[0], y = cy + q[1], r = q[2];
        p.fill([[x, y - r * 2], [x + r * .5, y - r * .5], [x + r * 2, y], [x + r * .5, y + r * .5], [x, y + r * 2], [x - r * .5, y + r * .5], [x - r * 2, y], [x - r * .5, y - r * .5]], a);
      });
    }
    function vela(p, cx, cy, a) {
      p.rect(cx - 3, cy - 6, 6, 24, a, 1.6);
      p.line(cx - 3, cy + 2, cx + 3, cy + 2, a, 1);
      p.line(cx, cy - 10, cx, cy - 6, a, 1.4);
      p.fill(bez(cx, cy - 20, cx + 5, cy - 15, cx + 3, cy - 9, cx, cy - 10).concat(bez(cx, cy - 10, cx - 3, cy - 9, cx - 5, cy - 15, cx, cy - 20)), a);
    }
    function montanas(p, cx, cy, a) {
      // Dos picos limpios + sol, sin relleno de lineas internas que lo recargaban.
      p.circle(cx + 9, cy - 15, 5, a, 1.3);
      p.poly([[cx - 22, cy + 13], [cx - 6, cy - 9], [cx + 9, cy + 13]], a, 1.7);
      p.poly([[cx - 2, cy + 13], [cx + 13, cy - 4], [cx + 27, cy + 13]], a, 1.7);
      p.line(cx - 26, cy + 14, cx + 30, cy + 14, a, .9);
    }
    function mono(p, cx, cy, a) {
      p.poly(bez(cx, cy, cx - 20, cy - 12, cx - 20, cy + 12, cx, cy), a, 1.6);
      p.poly(bez(cx, cy, cx + 20, cy - 12, cx + 20, cy + 12, cx, cy), a, 1.6);
      p.circle(cx, cy, 2.6, a, 1, a);
      p.line(cx, cy + 2.5, cx - 6, cy + 16, a, 1.4); p.line(cx, cy + 2.5, cx + 6, cy + 16, a, 1.4);
    }
    function copa(p, cx, cy, a) {
      // Bol de la copa: semielipse (arco superior) que abre hacia arriba.
      var bol = samplePts(function (t) { var ang = Math.PI + Math.PI * t; return [cx + 12 * Math.cos(ang), cy - 10 - 8 * Math.sin(ang)]; }, 16);
      p.poly(bol, a, 1.6);
      p.line(cx, cy - 10, cx, cy + 14, a, 1.6);       // tallo
      p.line(cx - 9, cy + 16, cx + 9, cy + 16, a, 1.6); // base
      [[cx, cy - 22, 1.3], [cx + 5, cy - 27, 1], [cx - 4, cy - 28, .8]].forEach(function (b) { p.circle(b[0], b[1], b[2], a, .8); });
    }
    function laurel(p, cx, cy, a) {
      [-1, 1].forEach(function (lado) {
        var x0 = cx + lado * 2, y0 = cy + 17, cxp = cx + lado * 20, cyp = cy - 2, x1 = cx + lado * 9, y1 = cy - 17;
        p.poly(bez(x0, y0, cxp, cyp, x1, y1, x1, y1, true), a, 1.1);
        var N = 6;
        for (var i = 1; i <= N; i++) {
          var tt = i / (N + .5), u = 1 - tt;
          var bx = u * u * x0 + 2 * u * tt * cxp + tt * tt * x1, by = u * u * y0 + 2 * u * tt * cyp + tt * tt * y1;
          var dx = 2 * u * (cxp - x0) + 2 * tt * (x1 - cxp), dy = 2 * u * (cyp - y0) + 2 * tt * (y1 - cyp);
          var ang = Math.atan2(dy, dx) + lado * .9, lh = 5.2 * (1 - tt * .3);
          var ex = bx + Math.cos(ang) * lh, ey = by + Math.sin(ang) * lh;
          var nx = -Math.sin(ang), ny = Math.cos(ang), wl = lh * .42;
          p.fill([[bx, by], [bx + Math.cos(ang) * lh * .5 + nx * wl, by + Math.sin(ang) * lh * .5 + ny * wl], [ex, ey], [bx + Math.cos(ang) * lh * .5 - nx * wl, by + Math.sin(ang) * lh * .5 - ny * wl]], a);
        }
      });
    }
    // Bezier cubica -> array de puntos
    function bez(x0, y0, c1x, c1y, c2x, c2y, x1, y1, quad) {
      var pts = [], n = 14;
      for (var i = 0; i <= n; i++) {
        var t = i / n, u = 1 - t;
        if (quad) { pts.push([u * u * x0 + 2 * u * t * c1x + t * t * c2x, u * u * y0 + 2 * u * t * c1y + t * t * c2y]); }
        else { pts.push([u * u * u * x0 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x1, u * u * u * y0 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y1]); }
      }
      return pts;
    }

    // Corta el mensaje (con \n propios) en lineas que quepan (~maxch caracteres).
    function wrapTexto(txt, maxch) {
      var out = [];
      String(txt).split('\n').forEach(function (par) {
        if (par === '') { out.push(''); return; }
        var pal = par.split(' '), linea = '';
        pal.forEach(function (w) {
          if ((linea + ' ' + w).trim().length > maxch) { out.push(linea.trim()); linea = w; }
          else linea += ' ' + w;
        });
        if (linea.trim()) out.push(linea.trim());
      });
      return out;
    }

    // =====================================================================
    //  TARJETAS (aniversario, cumpleanos, etc.): tarjeta PEQUEÑA tipo libro.
    //  Card cerrada = A6 (105 x 148.5mm). Blanco sin doblar = 210 x 148.5mm
    //  (dos paginas de 105 una junto a otra). Un A4 trae 2 copias apiladas
    //  (un solo corte al medio) para no desperdiciar papel / tener repuesto.
    //  Pagina 1 = interior (izquierda: sello+motivo+titulo: derecha: mensaje).
    //  Pagina 2 = reverso, grafito SOLIDO a sangre completa. Al doblar cada
    //  copia por la mitad (vertical), el grafito queda afuera (ambas tapas)
    //  y el interior adentro; como el reverso es un color parejo, no importa
    //  el registro de la impresora a doble cara.
    // =====================================================================
    var CARD_W = 105, CARD_H = 148.5;

    // Pagina izquierda (portada): motivo con halo, titulo y nombre grande.
    // El logo del hotel ya NO va aqui (paso al reverso grafito, a pedido).
    function dibujarPagPortada(p, o, d) {
      var acc = o.acc;
      var fondo = mezclar(acc, PAPEL, 0.16);
      p.bg(0, 0, CARD_W, CARD_H, fondo);
      patronPuntos(p, 9, 9, CARD_W - 9, CARD_H - 9, mezclar(acc, fondo, .3), 8.5);
      p.rect(7, 7, CARD_W - 14, CARD_H - 14, acc, .8);
      p.rect(9.5, 9.5, CARD_W - 19, CARD_H - 19, mezclar(acc, INK, .3), .3);
      patronRombos(p, 15, CARD_W - 15, 13.5, acc, 8);
      patronRombos(p, 15, CARD_W - 15, CARD_H - 13.5, acc, 8);

      var cyMotivo = 46;
      p.circle(CARD_W / 2, cyMotivo, 24, null, 0, mezclar(acc, fondo, .22));
      if (o.motivo) o.motivo(p, CARD_W / 2, cyMotivo, acc);

      if (o.kicker) p.text(o.kicker[APP.idioma], CARD_W / 2, 82, 4.6, INK_SOFT, { font: 'helvetica', charSpace: 1.6 });

      // "Evento especial" tiene el titulo libre (lo escribe quien arma la
      // tarjeta), en vez de un titulo fijo por idioma.
      var tit = o.tituloCampo ? wrapTexto(d.titulo || (APP.idioma === 'en' ? 'Special Event' : 'Evento Especial'), 15) : (o.titulo[APP.idioma] || []);
      var ty = (o.kicker ? 96 : 90) - (tit.length > 1 ? 4 : 0);
      tit.forEach(function (l, i) { p.text(l, CARD_W / 2, ty + i * 12.5, 18, acc, { font: 'times', style: 'italic' }); });
      var sub = o.sub ? o.sub(d) : '';
      if (sub) p.text(sub, CARD_W / 2, ty + (tit.length - 1) * 12.5 + 13, 13.5, INK_SOFT, { font: 'times', style: 'italic' });
    }

    // Pagina derecha (mensaje): encabezado ornamental + texto completo + firma.
    function dibujarPagMensaje(p, o, d, mensaje) {
      var acc = o.acc;
      var fondo = mezclar(acc, PAPEL, 0.16);
      p.bg(0, 0, CARD_W, CARD_H, fondo);
      patronPuntos(p, 9, 9, CARD_W - 9, CARD_H - 9, mezclar(acc, fondo, .3), 8.5);
      p.rect(7, 7, CARD_W - 14, CARD_H - 14, acc, .8);
      p.rect(9.5, 9.5, CARD_W - 19, CARD_H - 19, mezclar(acc, INK, .3), .3);
      patronRombos(p, 15, CARD_W - 15, 13.5, acc, 8);
      patronRombos(p, 15, CARD_W - 15, CARD_H - 13.5, acc, 8);

      var yEnc = 24;
      p.line(CARD_W / 2 - 16, yEnc, CARD_W / 2 - 4, yEnc, acc, .6);
      p.line(CARD_W / 2 + 4, yEnc, CARD_W / 2 + 16, yEnc, acc, .6);
      p.circle(CARD_W / 2, yEnc, 1.7, acc, .6, fondo);

      var lineas = wrapTexto(mensaje, 33);
      var y = yEnc + 10, lh = 6;
      lineas.forEach(function (l) {
        // Solo la despedida final (no cualquier mencion a "Cascadas Hotel" en medio del texto).
        var esFirma = /^(con cari|con afecto|con respeto|warmly|with warmth|with respect)/i.test(l) ||
          /^(el equipo de cascadas hotel|the cascadas hotel team)\.?$/i.test(l.trim());
        p.text(l, CARD_W / 2, y, esFirma ? 8.6 : 7.4, esFirma ? acc : INK, { font: 'times', style: esFirma ? 'italic' : 'normal' });
        y += (l === '' ? lh * 0.5 : (esFirma ? lh * 1.15 : lh));
      });
    }

    function nombreDeArchivo(o) {
      return 'Detalle_' + o.nombre.es.replace(/[^a-zA-Z0-9]/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
    }

    function construirHojaTarjeta(doc, o, d, mensaje) {
      // Una sola copia, centrada verticalmente en la hoja A4.
      var offY = (297 - CARD_H) / 2;
      var tfIzq = function (x, y) { return [x, offY + y]; };
      var tfDer = function (x, y) { return [CARD_W + x, offY + y]; };
      dibujarPagPortada(penFor(doc, tfIzq, false), o, d);
      dibujarPagMensaje(penFor(doc, tfDer, false), o, d, mensaje);

      // Guias: 2 cortes horizontales (separan la tarjeta del resto de la hoja)
      // + 1 doblez vertical al medio.
      doc.setDrawColor(185, 185, 185); doc.setLineWidth(.2);
      if (doc.setLineDashPattern) doc.setLineDashPattern([1.4, 1.4], 0);
      doc.line(6, offY, 204, offY);
      doc.line(6, offY + CARD_H, 204, offY + CARD_H);
      doc.line(CARD_W, offY + 4, CARD_W, offY + CARD_H - 4);
      if (doc.setLineDashPattern) doc.setLineDashPattern([], 0);
      doc.setFontSize(6.5); doc.setTextColor(150, 150, 150); doc.setFont('helvetica', 'normal');
      doc.text(APP.idioma === 'en' ? 'cut' : 'cortar', 4, offY - 2, { align: 'left' });
      doc.text(APP.idioma === 'en' ? 'cut' : 'cortar', 4, offY + CARD_H + 4.5, { align: 'left' });
      doc.text(APP.idioma === 'en' ? 'fold' : 'doblar', CARD_W, offY + 2.6, { align: 'center' });
      doc.text(APP.idioma === 'en' ? 'fold' : 'doblar', CARD_W, offY + CARD_H - 1.4, { align: 'center' });

      // Pagina 2: reverso solido a sangre completa, con el logo centrado en
      // cada mitad (izq/der) para que quede bien puesto sea cual sea la tapa
      // que termine al frente despues de doblar.
      doc.addPage();
      doc.setFillColor(GRAFITO[0], GRAFITO[1], GRAFITO[2]);
      doc.rect(0, 0, 210, 297, 'F');
      var tfLogoIzq = function (x, y) { return [x, offY + y]; };
      var tfLogoDer = function (x, y) { return [CARD_W + x, offY + y]; };
      dibujarMarca(penFor(doc, tfLogoIzq, false), CARD_W / 2, CARD_H / 2, 26, [235, 233, 230], [200, 197, 193], 78);
      dibujarMarca(penFor(doc, tfLogoDer, false), CARD_W / 2, CARD_H / 2, 26, [235, 233, 230], [200, 197, 193], 78);
    }

    // =====================================================================
    //  CUPON (Welcome Drink): NO se dobla. Un boleto plano, fondo grafito
    //  (a juego con el reverso de las tarjetas), con el logo del hotel en
    //  vez de un icono. Se imprimen 4 por hoja A4, listos para repartir.
    // =====================================================================
    var CUPON_W = 182, CUPON_H = 66, CUPON_GAP = 6, CUPON_TOP = 11;
    var CREMA = [228, 224, 216];
    function aclararAcc(acc, f) { return mezclar([255, 255, 255], acc, f === undefined ? 0.5 : f); }

    function dibujarCupon(p, o, d, mensaje) {
      var acc = aclararAcc(o.acc, .55), W = CUPON_W, H = CUPON_H;
      p.bg(0, 0, W, H, GRAFITO);
      patronPuntos(p, 8, 8, W - 8, H - 8, mezclar(acc, GRAFITO, .18), 7.5);
      p.rect(4, 4, W - 8, H - 8, acc, .8, [2.8, 2.2]);
      p.circle(4, H / 2, 3, GRAFITO, .6, GRAFITO); p.circle(4, H / 2, 3, acc, .6);
      p.circle(W - 4, H / 2, 3, GRAFITO, .6, GRAFITO); p.circle(W - 4, H / 2, 3, acc, .6);

      var xLogo = 33, xDivA = 60, xDetalles = 88, xDivB = 116, xTerm = 150;
      p.line(xDivA, 10, xDivA, H - 10, acc, .3);
      p.line(xDivB, 10, xDivB, H - 10, acc, .3);

      dibujarMarca(p, xLogo, H / 2, 21, CREMA, mezclar(acc, CREMA, .5), 54);

      if (o.kicker) p.text(o.kicker[APP.idioma], xDetalles, 20, 4.4, mezclar(acc, CREMA, .4), { font: 'helvetica', charSpace: 1.4 });
      p.text(o.valor(d), xDetalles, H / 2 + 4, (o.valorSize || 16), acc, { font: 'times', style: 'bold' });
      var vs = o.valorSub ? o.valorSub(d) : '';
      if (vs) {
        wrapTexto(vs, 20).forEach(function (l, i) { p.text(l, xDetalles, H / 2 + 15 + i * 5.2, 4.4, mezclar(acc, CREMA, .3), { font: 'helvetica', charSpace: .8 }); });
      }

      var lineas = wrapTexto(mensaje, 25);
      var lh = 6.1;
      var y = Math.max(14, H / 2 - (lineas.length - 1) * lh / 2);
      lineas.forEach(function (l) {
        var esFirma = /^(una cortesía|a courtesy)/i.test(l);
        p.text(l, xTerm, y, esFirma ? 6.6 : 6.9, esFirma ? acc : CREMA, { font: 'times', style: esFirma ? 'italic' : 'normal' });
        y += (l === '' ? lh * 0.5 : lh);
      });
    }

    function construirHojaCupones(doc, o, d, mensaje) {
      var left = (210 - CUPON_W) / 2;
      for (var i = 0; i < 4; i++) {
        var y0 = CUPON_TOP + i * (CUPON_H + CUPON_GAP);
        (function (y0) {
          var tf = function (x, y) { return [left + x, y0 + y]; };
          dibujarCupon(penFor(doc, tf, false), o, d, mensaje);
        })(y0);
        if (i < 3) {
          var yCorte = y0 + CUPON_H + CUPON_GAP / 2;
          doc.setDrawColor(185, 185, 185); doc.setLineWidth(.2);
          if (doc.setLineDashPattern) doc.setLineDashPattern([1.4, 1.4], 0);
          doc.line(left - 4, yCorte, left + CUPON_W + 4, yCorte);
          if (doc.setLineDashPattern) doc.setLineDashPattern([], 0);
        }
      }
      doc.setFontSize(6.5); doc.setTextColor(150, 150, 150); doc.setFont('helvetica', 'normal');
      doc.text(APP.idioma === 'en' ? 'cut along the dashed lines' : 'recorta por las lineas punteadas', 105, 291, { align: 'center' });
    }

    // =====================================================================
    //  GIFT CARD: documento elegante de 1 sola pagina, tamano carta apaisado.
    //  No es un ticket chico: es un certificado completo, fondo grafito,
    //  con toda la informacion (para quien, de quien, vigencia, codigo).
    // =====================================================================
    var GC_W = 279.4, GC_H = 215.9; // carta (letter) apaisado, en mm

    function codigoGiftCard() {
      if (!APP.codigoGift) APP.codigoGift = 'CAS-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      return APP.codigoGift;
    }

    function dibujarGiftCard(p, o, d, mensaje) {
      var acc = aclararAcc(o.acc, .6), W = GC_W, H = GC_H;
      p.bg(0, 0, W, H, GRAFITO);
      patronPuntos(p, 16, 16, W - 16, H - 16, mezclar(acc, GRAFITO, .16), 9.5);
      p.rect(12, 12, W - 24, H - 24, acc, 1);
      p.rect(15, 15, W - 30, H - 30, mezclar(acc, GRAFITO, .45), .35);
      patronRombos(p, 26, W - 26, 24, acc, 15);
      patronRombos(p, 26, W - 26, H - 27, acc, 15);

      dibujarMarca(p, W / 2, 36, 17, CREMA, mezclar(acc, CREMA, .5), 90);

      if (o.kicker) p.text(o.kicker[APP.idioma], W / 2, 54, 5.2, mezclar(acc, CREMA, .4), { font: 'helvetica', charSpace: 2.2 });
      p.text(o.valor(d), W / 2, 78, 30, acc, { font: 'times', style: 'bold' });
      var vs = o.valorSub ? o.valorSub(d) : '';
      if (vs) p.text(vs, W / 2, 89, 9.5, mezclar(acc, CREMA, .35), { font: 'helvetica', charSpace: 1.3 });

      p.line(W / 2 - 26, 98, W / 2 - 6, 98, acc, .6);
      p.line(W / 2 + 6, 98, W / 2 + 26, 98, acc, .6);
      p.circle(W / 2, 98, 1.9, acc, .6, GRAFITO);

      var lineas = wrapTexto(mensaje, 88);
      var y = 108, lh = 7;
      lineas.forEach(function (l) {
        p.text(l, W / 2, y, 10, CREMA, { font: 'times', style: 'normal' });
        y += (l === '' ? lh * 0.45 : lh);
      });

      // Letra chica FIJA con las condiciones reales (vigencia, disponibilidad,
      // meses validos si se eligieron). Arranca justo debajo del mensaje (no
      // en una posicion fija) y se calculan cuantas lineas entran antes del
      // ribete inferior, para que crezca si hay mas condiciones sin cortarse.
      var chica = construirLetraChica(o, d);
      if (chica) {
        var lhChica = 4.3;
        var yChicaTope = H - 27 - 4;
        var yChica = Math.max(y + 6, 150);
        var maxLineasChica = Math.max(1, Math.floor((yChicaTope - yChica) / lhChica) + 1);
        wrapTexto(chica, 128).slice(0, maxLineasChica).forEach(function (l) {
          p.text(l, W / 2, yChica, 5.8, mezclar(acc, CREMA, .18), { font: 'helvetica', style: 'italic' });
          yChica += lhChica;
        });
      }

      // Pie: codigo unico a la izquierda, fecha de emision a la derecha.
      var hoy = new Date();
      var fecha = (hoy.getDate() + '').padStart(2, '0') + '/' + ((hoy.getMonth() + 1) + '').padStart(2, '0') + '/' + hoy.getFullYear();
      p.text((APP.idioma === 'en' ? 'No. ' : 'N.º ') + codigoGiftCard(), 30, H - 19, 7.2, mezclar(acc, CREMA, .3), { align: 'left', font: 'helvetica' });
      p.text((APP.idioma === 'en' ? 'Issued on ' : 'Emitida el ') + fecha, W - 30, H - 19, 7.2, mezclar(acc, CREMA, .3), { align: 'right', font: 'helvetica' });
    }

    function construirHojaGiftCard(doc, o, d, mensaje) {
      dibujarGiftCard(penFor(doc, function (x, y) { return [x, y]; }, false), o, d, mensaje);
    }

    async function generarPDF() {
      if (typeof jspdf === 'undefined') { toast('No se pudo cargar el generador de PDF', 'error'); return; }
      var o = T[APP.ocasion], d = datosForm();
      var mensaje = document.getElementById('inpMensaje').value;
      await obtenerLogo().then(function (logo) { APP.logo = logo; });
      var doc;
      if (o.full) {
        doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'letter' });
        construirHojaGiftCard(doc, o, d, mensaje);
        guardarGiftCardEmitida(d, mensaje);
      } else if (o.cupon) {
        doc = new jspdf.jsPDF('p', 'mm', 'a4');
        construirHojaCupones(doc, o, d, mensaje);
      } else {
        doc = new jspdf.jsPDF('p', 'mm', 'a4');
        construirHojaTarjeta(doc, o, d, mensaje);
      }
      doc.save(nombreDeArchivo(o));
    }

    // Guarda la Gift Card recien generada en la planilla (si la app corre
    // como Web App de Apps Script; si se abre como archivo local para
    // pruebas, "google" no existe y esto simplemente no hace nada).
    function guardarGiftCardEmitida(d, mensaje) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      google.script.run
        .withFailureHandler(function () { /* silencioso: no bloquear la descarga del PDF por esto */ })
        .withSuccessHandler(function () { if (APP.ocasion === 'giftcard') cargarGiftCardsEmitidas(); })
        .guardarGiftCard({
          codigo: codigoGiftCard(), noches: d.noches, vigencia: d.vigencia, mesesValidos: d.mesesValidos,
          inclusiones: d.inclusiones, destinatario: d.destinatario, remitente: d.remitente,
          idioma: APP.idioma, mensaje: mensaje
        });
      APP.codigoGift = null; // la proxima Gift Card que se genere tendra su propio codigo
    }

    // ---- Listado de Gift Cards ya emitidas (solo visible en la ocasion Gift Card) ----
    function cargarGiftCardsEmitidas() {
      var cont = document.getElementById('giftcardsLista');
      if (!cont) return;
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        cont.innerHTML = '<p class="hint">' + (APP.idioma === 'en'
          ? 'Issued Gift Cards list is only available once this app runs as a deployed Web App.'
          : 'El listado de Gift Cards emitidas solo está disponible cuando la app corre como Web App.') + '</p>';
        return;
      }
      cont.innerHTML = '<p class="hint">' + (APP.idioma === 'en' ? 'Loading…' : 'Cargando…') + '</p>';
      google.script.run
        .withFailureHandler(function (err) { cont.innerHTML = '<p class="hint">' + (APP.idioma === 'en' ? 'Could not load the list.' : 'No se pudo cargar el listado.') + '</p>'; })
        .withSuccessHandler(function (filas) { pintarGiftCardsEmitidas(filas || []); })
        .listarGiftCards(30);
    }
    function pintarGiftCardsEmitidas(filas) {
      var cont = document.getElementById('giftcardsLista');
      if (!cont) return;
      if (!filas.length) { cont.innerHTML = '<p class="hint">' + (APP.idioma === 'en' ? 'No Gift Cards issued yet.' : 'Todavía no se ha emitido ninguna Gift Card.') + '</p>'; return; }
      var cab = APP.idioma === 'en'
        ? ['Code', 'Issued', 'Nights', 'Validity', 'Valid months', 'To', 'From']
        : ['Código', 'Emitida', 'Noches', 'Vigencia', 'Meses válidos', 'Para', 'De'];
      var html = '<div style="overflow-x:auto"><table class="tabla-gc"><thead><tr>' +
        cab.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
        filas.map(function (f) {
          return '<tr><td>' + (f.Codigo || '') + '</td><td>' + (f.FechaEmision || '') + '</td><td>' + (f.Noches || '') +
            '</td><td>' + (f.VigenciaMeses || '') + (f.VigenciaMeses ? (APP.idioma === 'en' ? ' mo.' : ' m.') : '') +
            '</td><td>' + (f.MesesValidos || '—') +
            '</td><td>' + (f.Para || '') + '</td><td>' + (f.De || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      cont.innerHTML = html;
    }

    // ---- Vista previa ----
    function refrescarPrevia() {
      var o = T[APP.ocasion]; if (!o) return;
      var d = datosForm();
      var mensaje = document.getElementById('inpMensaje').value;
      var cont = document.getElementById('previa');
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

      if (o.full) {
        svg.setAttribute('viewBox', '0 0 ' + GC_W + ' ' + GC_H);
        dibujarGiftCard(penSVG(svg), o, d, mensaje);
        document.getElementById('previaRevSection').classList.add('oculto');
      } else if (o.cupon) {
        svg.setAttribute('viewBox', '0 0 ' + CUPON_W + ' ' + CUPON_H);
        dibujarCupon(penSVG(svg), o, d, mensaje);
        document.getElementById('previaRevSection').classList.add('oculto');
      } else {
        svg.setAttribute('viewBox', '0 0 ' + (CARD_W * 2) + ' ' + CARD_H);
        var p = penSVG(svg);
        var pIzq = penSVGOffset(svg, 0, 0), pDer = penSVGOffset(svg, CARD_W, 0);
        dibujarPagPortada(pIzq, o, d);
        dibujarPagMensaje(pDer, o, d, mensaje);
        svg.appendChild((function () { var l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); l.setAttribute('x1', CARD_W); l.setAttribute('y1', 0); l.setAttribute('x2', CARD_W); l.setAttribute('y2', CARD_H); l.setAttribute('stroke', '#B9B9BC'); l.setAttribute('stroke-width', .6); l.setAttribute('stroke-dasharray', '2 2'); return l; })());
        document.getElementById('previaRevSection').classList.remove('oculto');
        var rev = document.getElementById('previaReverso');
        rev.style.background = rgb(GRAFITO);
      }
      cont.innerHTML = ''; cont.appendChild(svg);
    }
    // Variante del pen SVG que ademas desplaza todo en (offX,offY): se usa
    // para pintar la vista previa de ambas paginas (izq/der) en un mismo SVG.
    function penSVGOffset(svg, offX, offY) {
      var base = penSVG(svg);
      return {
        line: function (x1, y1, x2, y2, col, w) { base.line(x1 + offX, y1 + offY, x2 + offX, y2 + offY, col, w); },
        circle: function (cx, cy, r, col, w, fill) { base.circle(cx + offX, cy + offY, r, col, w, fill); },
        dot: function (cx, cy, r, col) { base.dot(cx + offX, cy + offY, r, col); },
        poly: function (pts, col, w) { base.poly(pts.map(function (pt) { return [pt[0] + offX, pt[1] + offY]; }), col, w); },
        fill: function (pts, col) { base.fill(pts.map(function (pt) { return [pt[0] + offX, pt[1] + offY]; }), col); },
        rect: function (x, y, w, h, col, lw, dash) { base.rect(x + offX, y + offY, w, h, col, lw, dash); },
        bg: function (x, y, w, h, col) { base.bg(x + offX, y + offY, w, h, col); },
        image: function (dataUrl, x, y, w, h) { base.image(dataUrl, x + offX, y + offY, w, h); },
        text: function (str, x, y, size, col, opts) { base.text(str, x + offX, y + offY, size, col, opts); }
      };
    }
    // "pen" para SVG (misma interfaz que penFor, coordenadas directas)
    var SVGNS = 'http://www.w3.org/2000/svg';
    function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
    function rectSVG(x, y, w, h, fill) { var e = document.createElementNS(SVGNS, 'rect'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('width', w); e.setAttribute('height', h); e.setAttribute('fill', fill); return e; }
    function penSVG(svg) {
      function ptsStr(pts) { return pts.map(function (p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }).join(' L '); }
      return {
        line: function (x1, y1, x2, y2, col, w) { var e = document.createElementNS(SVGNS, 'line'); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); e.setAttribute('stroke', rgb(col)); e.setAttribute('stroke-width', w || .4); svg.appendChild(e); },
        circle: function (cx, cy, r, col, w, fill) { var e = document.createElementNS(SVGNS, 'circle'); e.setAttribute('cx', cx); e.setAttribute('cy', cy); e.setAttribute('r', r); e.setAttribute('fill', fill ? rgb(fill) : 'none'); if (col) { e.setAttribute('stroke', rgb(col)); e.setAttribute('stroke-width', w || .4); } svg.appendChild(e); },
        dot: function (cx, cy, r, col) { this.circle(cx, cy, r, null, 0, col); },
        poly: function (pts, col, w) { var e = document.createElementNS(SVGNS, 'path'); e.setAttribute('d', 'M ' + ptsStr(pts)); e.setAttribute('fill', 'none'); e.setAttribute('stroke', rgb(col)); e.setAttribute('stroke-width', w || .4); svg.appendChild(e); },
        fill: function (pts, col) { var e = document.createElementNS(SVGNS, 'path'); e.setAttribute('d', 'M ' + ptsStr(pts) + ' Z'); e.setAttribute('fill', rgb(col)); svg.appendChild(e); },
        rect: function (x, y, w, h, col, lw, dash) { var e = document.createElementNS(SVGNS, 'rect'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('width', w); e.setAttribute('height', h); e.setAttribute('fill', 'none'); e.setAttribute('stroke', rgb(col)); e.setAttribute('stroke-width', lw || .4); if (dash) e.setAttribute('stroke-dasharray', dash.join(' ')); svg.appendChild(e); },
        bg: function (x, y, w, h, col) { svg.appendChild(rectSVG(x, y, w, h, rgb(col))); },
        image: function (dataUrl, x, y, w, h) { var e = document.createElementNS(SVGNS, 'image'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('width', w); e.setAttribute('height', h); e.setAttributeNS('http://www.w3.org/1999/xlink', 'href', dataUrl); svg.appendChild(e); },
        text: function (str, x, y, size, col, opts) { opts = opts || {}; var e = document.createElementNS(SVGNS, 'text'); e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('text-anchor', opts.align === 'left' ? 'start' : 'middle'); e.setAttribute('font-size', size); e.setAttribute('fill', rgb(col)); e.setAttribute('font-family', opts.font === 'times' ? 'Cormorant Garamond, Georgia, serif' : 'Oswald, sans-serif'); if (opts.style === 'italic') e.setAttribute('font-style', 'italic'); if (opts.style === 'bold') e.setAttribute('font-weight', '600'); if (opts.charSpace) e.setAttribute('letter-spacing', opts.charSpace); e.textContent = str; svg.appendChild(e); }
      };
    }

    function toast(msg, tipo) {
      var el = document.getElementById('toast'); el.textContent = msg;
      el.className = 'toast show' + (tipo === 'error' ? ' error' : '');
      setTimeout(function () { el.className = 'toast'; }, 2600);
    }

    // Arranque
    aplicarIdiomaUI();
    pintarOcasiones();
  </script>
