<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Encuesta de Satisfacción</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #F4F4F5; --surface: #FFFFFF; --text: #3A3A3C; --text-sec: #6E6C69;
      --accent: #414143; --border: #C9C6C2; --success: #4E6B54; --danger: #8B3A3A;
      --shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(0,0,0,0.06), 0 10px 24px -14px rgba(46,46,48,0.30);
    }
    html, body {
      min-height: 100%;
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 300; background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.7), transparent 55%),
        repeating-linear-gradient(0deg, rgba(65,65,67,.02) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(65,65,67,.02) 0 1px, transparent 1px 4px);
      color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 60px; }
    .wrap { width: 100%; max-width: 480px; }

    .brand { text-align: center; margin-bottom: 22px; animation: fadeInDown .5s ease both; }
    .brand-logo {
      width: 68px; height: 68px; object-fit: contain; border-radius: 20px; display: inline-block; margin-bottom: 14px;
      background: linear-gradient(160deg, #525255, #414143 55%, #353537);
      padding: 8px; border: 1px solid #2A2A2C;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 22px -10px rgba(46,46,48,0.5);
    }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 1px; color: var(--text); line-height: 1.05; }
    .brand p { font-size: 12.5px; color: var(--text-sec); margin-top: 6px; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 22px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
      animation: fadeInUp .5s ease both;
    }
    .skeleton { text-align: center; padding: 30px 10px; color: var(--text-sec); font-size: 13px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; padding-left: 2px; text-transform: uppercase; letter-spacing: .4px; }
    .field input[type="text"] {
      width: 100%; height: 46px; padding: 0 14px; border: none; border-radius: 12px;
      font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 400; background: #F3F3F4; color: var(--text);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 0 0 1px var(--border);
    }
    .field input[type="text"]:focus { outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 0 0 2px var(--accent); }
    .field input::placeholder { color: #A8A5A0; font-weight: 300; }
    .field .hint { font-size: 11px; color: #A8A5A0; margin-top: 5px; padding-left: 2px; }

    .pregunta { margin-bottom: 20px; }
    .pregunta:last-child { margin-bottom: 0; }
    .pregunta-titulo { font-size: 14.5px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
    .pregunta-sub { font-size: 11px; color: var(--text-sec); margin-bottom: 9px; }

    /* Puntuacion 1-10: franja horizontal en degrade rojo -> grafito, como un
       termometro. El color en reposo YA indica la posicion en la escala; al
       elegir, esa pastilla se satura y se agranda, las demas se atenuan. */
    .escala { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .punto {
      aspect-ratio: 1 / 1; border-radius: 9px; border: none;
      display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif;
      font-size: 12.5px; font-weight: 600; color: #fff; cursor: pointer; user-select: none;
      filter: saturate(.55) brightness(1.12); opacity: .82; transform: scale(.92);
      transition: filter .15s, opacity .15s, transform .15s, box-shadow .15s;
    }
    .punto:active { transform: scale(0.88); }
    .punto.activo {
      filter: none; opacity: 1; transform: scale(1.14);
      box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4px var(--c, var(--accent)), 0 4px 10px -2px rgba(0,0,0,.4);
    }
    .escala-labels { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10px; color: #A8A5A0; padding: 0 1px; text-transform: uppercase; letter-spacing: .3px; }

    /* Escala de satisfaccion: grilla horizontal de chips con icono + color
       propios (traffic-light), mucho mas corta que una lista apilada. */
    .opciones-escala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .opcion-escala {
      border-radius: 12px; border: 1.5px solid transparent; background: #FAFAF9;
      padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; user-select: none; transition: all .15s;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.05);
    }
    .opcion-escala i { font-size: 19px; opacity: .55; transition: opacity .15s, transform .15s; }
    .opcion-escala span { font-size: 10.5px; font-weight: 500; color: var(--text-sec); text-align: center; line-height: 1.15; }
    .opcion-escala:active { transform: scale(0.96); }
    .opcion-escala.activo { background: var(--nivel-tint, #ECECEE); border-color: var(--nivel-color, var(--accent)); }
    .opcion-escala.activo i { opacity: 1; color: var(--nivel-color, var(--accent)); transform: scale(1.12); }
    .opcion-escala.activo span { color: var(--text); font-weight: 600; }

    /* Alternativas / si-no: chips horizontales que envuelven en filas. */
    .opciones { display: flex; flex-direction: column; gap: 8px; }
    .opciones.en-fila { flex-direction: row; flex-wrap: wrap; }
    .opciones.en-fila .opcion { flex: 1; min-width: 90px; }
    .opcion {
      border: 1px solid var(--border); background: #FAFAF9; border-radius: 12px;
      padding: 12px 14px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 400;
      color: var(--text); cursor: pointer; user-select: none; text-align: center;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.05); transition: all .15s;
    }
    .opcion:active { transform: scale(0.98); }
    .opcion.activo {
      background: linear-gradient(180deg, #57575A, #414143 50%, #39393B); color: #F2F0EE; border-color: #2A2A2C;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 8px -2px rgba(46,46,48,0.5);
    }

    .field textarea {
      width: 100%; min-height: 84px; padding: 13px 15px; border: 1.5px solid var(--border); border-radius: 16px;
      font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5;
      background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.04); resize: vertical;
      transition: border-color .15s, box-shadow .15s;
    }
    .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(65,65,67,.10); }
    .field textarea::placeholder { color: #A8A5A0; font-weight: 300; }

    .btn-enviar {
      width: 100%; height: 52px; border: none; border-radius: 16px;
      background: linear-gradient(180deg, #57575A, #414143 50%, #39393B);
      color: #F2F0EE; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 #242426, 0 8px 18px -8px rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; gap: 10px; transition: all .12s;
    }
    .btn-enviar:active { transform: translateY(2px); box-shadow: inset 0 2px 6px rgba(0,0,0,.4); }
    .btn-enviar:disabled { opacity: .55; cursor: default; }

    .msg-error {
      display: none; background: #ECDAD7; color: var(--danger); font-size: 13px; font-weight: 500;
      padding: 11px 14px; border-radius: 12px; margin-bottom: 14px; text-align: center;
    }
    .msg-error.show { display: block; }

    .spin { display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pantalla de agradecimiento */
    .gracias { display: none; text-align: center; padding: 40px 10px; animation: fadeIn .5s ease both; }
    .gracias.show { display: block; }
    .gracias .icono { font-size: 56px; color: var(--success); margin-bottom: 18px; }
    .gracias h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: .5px; margin-bottom: 10px; }
    .gracias p { font-size: 14px; color: var(--text-sec); line-height: 1.5; max-width: 320px; margin: 0 auto; }

    .footer { text-align: center; margin-top: 18px; font-size: 11px; color: #A8A5A0; font-weight: 500; text-transform: uppercase; letter-spacing: .8px; }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (min-width: 500px) {
      .brand h1 { font-size: 36px; }
      .brand-logo { width: 80px; height: 80px; }
      .card { padding: 28px 26px; }
      .punto { font-size: 14.5px; }
      .opcion-escala i { font-size: 21px; }
    }
    @media (max-width: 360px) {
      .escala { gap: 3px; }
      .punto { font-size: 11px; border-radius: 7px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">

      <div class="brand">
        <img src="https://lh3.googleusercontent.com/d/1l-GRXICSU6fHGe9uGsnGdZ6M0FKgKevJ" alt="Cascadas Hotel" class="brand-logo" onerror="this.style.display='none';document.getElementById('fallback-icon').style.display='inline-flex';">
        <div id="fallback-icon" class="brand-logo" style="display:none;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;color:#E9E7E5;font-size:34px;">C</div>
        <h1 id="tituloHotel">Cascadas Hotel</h1>
        <p>Encuesta de satisfacción</p>
      </div>

      <div id="formCard" class="card">
        <div id="msgError" class="msg-error"></div>
        <div id="skeleton" class="skeleton"><i class="fa-solid fa-circle-notch spin"></i> Cargando encuesta...</div>

        <div id="preguntasWrap" style="display:none;">
          <div class="field">
            <label>Tu nombre</label>
            <input type="text" id="f_nombre" placeholder="Nombre completo">
          </div>
          <div class="field">
            <label>Habitación</label>
            <input type="text" id="f_habitacion" placeholder="Ej: 105 (opcional)">
            <div class="hint">Opcional, nos ayuda a identificar tu estadía.</div>
          </div>

          <div id="listaPreguntas"></div>

          <button type="button" class="btn-enviar" id="btnEnviar" onclick="enviarEncuesta()" style="margin-top: 6px;">
            <i class="fa-solid fa-paper-plane"></i> <span>Enviar encuesta</span>
          </button>
        </div>
      </div>

      <div id="gracias" class="gracias">
        <div class="icono"><i class="fa-solid fa-circle-check"></i></div>
        <h2>¡Gracias por tu tiempo!</h2>
        <p>Tu opinión nos ayuda a mejorar cada día. Esperamos verte pronto de nuevo en Cascadas Hotel.</p>
      </div>

      <div class="footer">Cascadas Hotel</div>
    </div>
  </div>

  <script>
    var PREGUNTAS = [];
    var respuestas = {};
    var NIVELES_ESCALA = ['Muy bueno', 'Bueno', 'Regular', 'Malo', 'Muy malo', 'No aplica'];
    var NIVEL_ICONO = {
      'Muy bueno': 'fa-face-grin-hearts', 'Bueno': 'fa-face-smile', 'Regular': 'fa-face-meh',
      'Malo': 'fa-face-frown', 'Muy malo': 'fa-face-angry', 'No aplica': 'fa-ban'
    };
    var NIVEL_COLOR = {
      'Muy bueno': '#0ca30c', 'Bueno': '#8bbf3f', 'Regular': '#d98c12',
      'Malo': '#ec835a', 'Muy malo': '#d03b3b', 'No aplica': '#b3b0a9'
    };
    var NIVEL_TINT = {
      'Muy bueno': '#dcf1dc', 'Bueno': '#eaf3d8', 'Regular': '#faecd2',
      'Malo': '#fbe4da', 'Muy malo': '#f8dcdc', 'No aplica': '#ececea'
    };

    /* Interpola de rojo (1) a grafito casi negro (10): la fila entera actua
       como un indicador de temperatura, no solo el punto elegido. */
    function colorPuntuacion(i) {
      var start = [208, 59, 59], end = [35, 35, 37];
      var t = (i - 1) / 9;
      var r = Math.round(start[0] + (end[0] - start[0]) * t);
      var g = Math.round(start[1] + (end[1] - start[1]) * t);
      var b = Math.round(start[2] + (end[2] - start[2]) * t);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function escaparHTML(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function pintarPreguntas() {
      var cont = document.getElementById('listaPreguntas');
      cont.innerHTML = PREGUNTAS.map(function (p, idx) {
        var titulo = '<div class="pregunta-titulo">' + escaparHTML(p.texto) + '</div>';
        var cuerpo = '';

        if (p.tipo === 'puntuacion') {
          var puntos = '';
          for (var i = 1; i <= 10; i++) {
            var c = colorPuntuacion(i);
            puntos += '<div class="punto" data-val="' + i + '" style="background:' + c + ';--c:' + c + ';" onclick="seleccionarPuntuacion(\'' + p.id + '\', ' + i + ', this)">' + i + '</div>';
          }
          cuerpo =
            '<div class="pregunta-sub">1 = nada probable · 10 = muy probable</div>' +
            '<div class="escala" data-pregunta="' + p.id + '">' + puntos + '</div>' +
            '<div class="escala-labels"><span>Muy malo</span><span>Excelente</span></div>';
        } else if (p.tipo === 'escala') {
          cuerpo = '<div class="opciones-escala" data-pregunta="' + p.id + '">' +
            NIVELES_ESCALA.map(function (n) {
              return '<div class="opcion-escala" style="--nivel-color:' + NIVEL_COLOR[n] + ';--nivel-tint:' + NIVEL_TINT[n] + ';" onclick="seleccionarOpcion(\'' + p.id + '\', \'' + n + '\', this)">' +
                '<i class="fa-solid ' + NIVEL_ICONO[n] + '"></i><span>' + n + '</span></div>';
            }).join('') + '</div>';
        } else if (p.tipo === 'alternativas') {
          cuerpo = '<div class="opciones en-fila" data-pregunta="' + p.id + '">' +
            (p.opciones || []).map(function (o) {
              var oEsc = escaparHTML(o).replace(/'/g, "\\'");
              return '<div class="opcion" onclick="seleccionarOpcion(\'' + p.id + '\', \'' + oEsc + '\', this)">' + escaparHTML(o) + '</div>';
            }).join('') + '</div>';
        } else if (p.tipo === 'sino') {
          cuerpo = '<div class="opciones en-fila" data-pregunta="' + p.id + '">' +
            '<div class="opcion" onclick="seleccionarOpcion(\'' + p.id + '\', \'Si\', this)">Sí</div>' +
            '<div class="opcion" onclick="seleccionarOpcion(\'' + p.id + '\', \'No\', this)">No</div>' +
            '</div>';
        } else if (p.tipo === 'texto') {
          cuerpo = '<textarea data-pregunta-texto="' + p.id + '" placeholder="Escribe tu respuesta..." oninput="seleccionarTexto(\'' + p.id + '\', this.value)"></textarea>';
        }

        return '<div class="pregunta">' + titulo + cuerpo + '</div>';
      }).join('');
    }

    function seleccionarPuntuacion(preguntaID, valor, el) {
      respuestas[preguntaID] = valor;
      var cont = el.parentElement;
      cont.querySelectorAll('.punto').forEach(function (p) { p.classList.remove('activo'); });
      el.classList.add('activo');
      ocultarError();
    }
    function seleccionarOpcion(preguntaID, valor, el) {
      respuestas[preguntaID] = valor;
      var cont = el.parentElement;
      var selector = el.classList.contains('opcion-escala') ? '.opcion-escala' : '.opcion';
      cont.querySelectorAll(selector).forEach(function (o) { o.classList.remove('activo'); });
      el.classList.add('activo');
      ocultarError();
    }
    function seleccionarTexto(preguntaID, valor) {
      respuestas[preguntaID] = valor;
    }

    function ocultarError() {
      var m = document.getElementById('msgError');
      m.classList.remove('show'); m.textContent = '';
    }
    function mostrarError(txt) {
      var m = document.getElementById('msgError');
      m.textContent = txt; m.classList.add('show');
      m.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function enviarEncuesta() {
      var nombre = document.getElementById('f_nombre').value.trim();
      if (!nombre) { mostrarError('Por favor ingresa tu nombre.'); return; }

      for (var i = 0; i < PREGUNTAS.length; i++) {
        var p = PREGUNTAS[i];
        if (!p.requerida) continue;
        var v = respuestas[p.id];
        if (p.tipo === 'texto' ? !String(v || '').trim() : !v) {
          mostrarError('Por favor responde: "' + p.texto + '".');
          return;
        }
      }

      var datos = {
        nombre: nombre,
        habitacion: document.getElementById('f_habitacion').value.trim(),
        idioma: 'es',
        respuestas: respuestas
      };

      var btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i> <span>Enviando...</span>';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('gracias').classList.add('show');
          } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Enviar encuesta</span>';
            mostrarError((res && res.mensaje) || 'No se pudo enviar. Intenta de nuevo.');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Enviar encuesta</span>';
          mostrarError('Error de conexión. Intenta de nuevo.');
        })
        .enviarRespuestaEncuesta(datos);
    }

    function init() {
      google.script.run.withSuccessHandler(function (d) {
        if (d && d.hotelNombre) document.getElementById('tituloHotel').textContent = d.hotelNombre;
        PREGUNTAS = (d && d.preguntas) || [];
        document.getElementById('skeleton').style.display = 'none';
        document.getElementById('preguntasWrap').style.display = 'block';
        pintarPreguntas();
      }).withFailureHandler(function () {
        document.getElementById('skeleton').innerHTML = 'No se pudo cargar la encuesta. Intenta de nuevo mas tarde.';
      }).obtenerDatosPublicos();
    }
    init();
  </script>
</body>
</html>
